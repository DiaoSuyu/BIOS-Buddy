/* Staging for "file picked but not imported yet" in the dialog: one per side; picking is not importing */
const impPend = {A: null, B: null};
function setImpPend(p, file){
  impPend[p] = file;
  const tag = $("impTag" + p);
  if(file){
    tag.textContent = t("impFileTag", {n: file.name, b: file.bytes.length});
    tag.classList.add("show");
  } else {
    tag.textContent = "";
    tag.classList.remove("show");
  }
}
function clearImpPend(p){ setImpPend(p, null); }

/* Import one box into the given pane; empty text = skip (that pane stays as it is).
   Returns: >0 bytes, 0 = the box was empty (skipped), -1 = error (message shown, dialog stays open) */
function importTextTo(p){
  const ta = $(p === "A" ? "impTextA" : "impTextB");
  const errEl = $(p === "A" ? "impErrA" : "impErrB");
  errEl.textContent = "";
  const pend = impPend[p];
  if(pend){                              // A picked file wins over typed text
    loadTo(p, pend.bytes, pend.name, pend.src || null);
    const n = pend.bytes.length;
    clearImpPend(p);
    return n;
  }
  const raw = ta.value;
  if(!raw.trim()) return 0;
  let bytes;
  try{ bytes = parseHex(raw); }
  catch(err){
    errEl.textContent = String(err.message || err);
    markBad(ta); flash(String(err.message || err), true);
    return -1;
  }
  if(!bytes.length){
    errEl.textContent = t("msgNoHex"); markBad(ta); return -1;
  }
  loadTo(p, bytes.buffer, p === "A" ? "pasted.hex" : "pasted(B).hex");
  return bytes.length;
}
$("impApplyA").onclick = () => {
  const n = importTextTo("A");
  if(n <= 0) return;
  $("impTextA").value = ""; updateImpLen();
  $("impMask").classList.remove("show");
};
$("impApplyB").onclick = () => {
  const n = importTextTo("B");
  if(n <= 0) return;
  $("impTextB").value = ""; updateImpLen();
  $("impMask").classList.remove("show");
};
$("impBoth").onclick = () => {
  const a = importTextTo("A"), b = importTextTo("B");
  if(a < 0 || b < 0) return;                  // On error stay in the dialog so the red message is visible
  if(a === 0 && b === 0){ flash(t("msgImpNone"), true); return; }
  $("impTextA").value = ""; $("impTextB").value = ""; updateImpLen();
  $("impMask").classList.remove("show");
  flash(t("msgImpSum", {a: a || 0, b: b || 0}));
};

/* Pick a local file: remember which column was clicked */
let impPickTarget = "A";
["A", "B"].forEach(p => {
  $("impPick" + p).onclick = async () => {
    impPickTarget = p;
    /* Chrome / Edge prefer File System Access: only a handle makes "Save" able to write back */
    if(window.showOpenFilePicker){
      try{
        const [h] = await window.showOpenFilePicker();
        const f = await h.getFile();
        const bytes = new Uint8Array(await f.arrayBuffer());
        setImpPend(p, {bytes, name: f.name, src: {kind: "handle", handle: h, name: f.name}});
        updateImpLen();
        flash(t("msgFilePicked", {n: f.name}));
        return;
      }catch(err){
        if(err && err.name === "AbortError") return;
      }
    }
    $("impFile").value = "";
    $("impFile").click();
  };
  $("impClip" + p).onclick = () => {
    const ta = $(p === "A" ? "impTextA" : "impTextB");
    if(navigator.clipboard && navigator.clipboard.readText){
      navigator.clipboard.readText()
        .then(txt => { ta.value = txt.trim(); updateImpLen(); flash(t("msgCopiedDump")); })
        .catch(() => flash(lang === "zh" ? "剪贴板读取被拒绝，请手动 Ctrl+V 粘贴" : "Clipboard read denied, paste manually with Ctrl+V", true));
    } else {
      flash(lang === "zh" ? "环境不支持剪贴板读取，请手动 Ctrl+V 粘贴" : "Clipboard read not supported, paste manually with Ctrl+V", true);
    }
  };
});
$("impFile").onchange = e => {
  const f = e.target.files[0];
  const target = impPickTarget;
  e.target.value = "";
  if(!f) return;
  f.arrayBuffer().then(buf => {
    /* Stage only, do not import: that way the file for A can be picked before picking one for B */
    setImpPend(target, {bytes: new Uint8Array(buf), name: f.name});
    updateImpLen();
    flash(t("msgFilePicked", {n: f.name}));
  }).catch(() => flash(lang === "zh" ? "读取文件失败" : "Failed to read the file", true));
};
["A", "B"].forEach(p => {
  $("impTag" + p).onclick = () => { clearImpPend(p); updateImpLen(); };
  $(p === "A" ? "impTextA" : "impTextB").addEventListener("input", () => {
    if(impPend[p]) clearImpPend(p);      // Editing the text by hand drops the file that was just picked
  });
});
$("impClose").onclick = () => { clearImpPend("A"); clearImpPend("B"); $("impMask").classList.remove("show"); };
$("impMask").addEventListener("click", e => { if(e.target === $("impMask")) $("impMask").classList.remove("show"); });

/* ================= Drag and drop ================= */
let dragDepth = 0;
document.addEventListener("dragenter", e => {
  if(e.dataTransfer && Array.from(e.dataTransfer.types).includes("Files")){
    dragDepth++; $("dropHint").classList.add("show");
  }
});
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("dragleave", () => {
  if(--dragDepth <= 0){ dragDepth = 0; $("dropHint").classList.remove("show"); }
});
document.addEventListener("drop", e => {
  e.preventDefault();
  dragDepth = 0; $("dropHint").classList.remove("show");
  const fs = Array.from(e.dataTransfer.files || []);
  if(!fs.length) return;
  /* Files dropped from Chrome / Edge can carry a handle, and only a handle lets "Save" write back.
   But inside a VS Code webview createWritable() is blocked by the sandbox, so the handle is dead there:
   we skip it and let the host locate the real path by name + size instead. */
  const handles = [];
  if(!inHost){
    try{
      for(const it of Array.from(e.dataTransfer.items || []))
        if(it.kind === "file" && it.getAsFileSystemHandle) handles.push(it.getAsFileSystemHandle());
    }catch(_){ }
  }
  const srcOf = i => handles[i]
    ? handles[i].then(h => h && h.kind === "file" ? {kind: "handle", handle: h, name: fs[i].name} : null).catch(() => null)
    : Promise.resolve(null);
  if(fs.length >= 2){                        // Two at once -> one for A, one for B
    Promise.all([srcOf(0), srcOf(1)]).then(([sa, sb]) => loadTwoFiles(fs[0], fs[1], sa, sb));
    return;
  }
  const f = fs[0];
  const target = e.altKey ? "B" : "A";
  srcOf(0).then(src =>
    f.arrayBuffer().then(buf => loadTo(target, buf, f.name, src))
  ).catch(() => flash(lang === "zh" ? "读取文件失败" : "Failed to read the file", true));
});
/* Two files dropped together: the first goes to A, the second to B, dual pane turns on, one toast only.
   quiet=true is the restore path (tab switch / split): the panes come back as they were, nothing was loaded. */
async function loadTwoFiles(fa, fb, srcA, srcB, quiet){
  try{
    const [ba, bb] = await Promise.all([fa.arrayBuffer(), fb.arrayBuffer()]);
    const stA = P.A, stB = P.B;
    stA.buf = new Uint8Array(ba); stA.name = fa.name; stA.hadBytes = stA.buf.length > 0; stA.src = srcA || null; stA.cursor = 0; stA.sel = null; stA.phase = 0; stA.pend = null; stA.undo = []; stA.redo = [];
    stB.buf = new Uint8Array(bb); stB.name = fb.name; stB.hadBytes = stB.buf.length > 0; stB.src = srcB || null; stB.cursor = 0; stB.sel = null; stB.phase = 0; stB.pend = null; stB.undo = []; stB.redo = [];
    const tok = ++pairSeq;                  // Dropped as one batch -> same directory for sure, so saving never asks again
    stA.pairTok = tok; stB.pairTok = tok;
    nameA = fa.name; nameB = fb.name; dualView = true;
    if(stA.buf.length || stB.buf.length) hadContent = true;
    activePane = "A";
    clearDiff();
    updateBPane(); updateActiveUI(); render();
    if(!quiet) flash(t("msgLoadedPair", {a: fa.name, n1: stA.buf.length, b: fb.name, n2: stB.buf.length}));
    tryPairLocate();
  }catch(err){
    flash(lang === "zh" ? "读取文件失败" : "Failed to read the files", true);
  }
}

/* ================= Saving (several fallbacks) ================= */
function hexTextDump(buf){
  const b = buf || data;
  let s = "";
  for(let i = 0; i < b.length; i += 16)
    s += i.toString(16).padStart(8, "0").toUpperCase() + "  " + hexOf(b.subarray(i, i + 16), " ") + "\n";
  return s;
}
function showSaveFallback(){
  $("saveDlgTitle").textContent = t("saveDlgTitle");
  $("saveDlgMsg").innerHTML = t("saveBlockedMsg");
  $("saveDlgText").value = hexTextDump();
  $("saveMask").classList.add("show");
}
/* Returns the name actually written (the user's rename in the system dialog wins); null when cancelled */
async function saveData(blob, name){
  if(window.showSaveFilePicker){
    try{
      const handle = await window.showSaveFilePicker({ suggestedName: name });
      const w = await handle.createWritable();
      await w.write(blob); await w.close();
      const real = handle.name || name;        // <- the new name the user typed
      window.__beSavedHandle = handle;         // Remember the destination handle so later "Save" writes straight back
      flash(t("msgSaved") + real);
      return real;
    }catch(err){
      if(err && err.name === "AbortError") return null;
    }
  }
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name; a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 10000);
    if(inIframe){
      flash(t("msgTryDownload"));
      showSaveFallback();
    } else {
      flash(t("msgDownloading") + name);
    }
    return name;
  }catch(e){
    showSaveFallback();
    return null;
  }
}

/* ================= Save to source file: confirm first, overwrite only after that ================= */
/* The extension path gets hostWriteFile(path, bytes) -> Promise<boolean> injected by the bridge;
   the browser path uses the File System Access handle obtained when opening */
let hostWriteFile = null;
let cfmSavePane = "A";
function srcLabel(src){
  return src && src.kind === "path" ? src.path : (src && src.name) || "";
}
function openConfirmSave(p){
  cfmSavePane = p;
  $("cfmSaveMsg").textContent = t("cfmSaveMsg", {n: P[p].buf.length});
  $("cfmSavePath").textContent = srcLabel(P[p].src) || P[p].name;
  $("cfmSaveMask").classList.add("show");
}
function askSaveBack(p){
  const st = P[p];
  if(!st.buf || !st.buf.length){ flash(t("msgPaneEmpty", {p: p}), true); return; }
  /* In the extension a handle cannot write (createWritable is blocked): turn it into a real path first,
   so the confirmation can show the actual destination instead of a useless handle */
  if(inHost && st.src && st.src.kind === "handle"){
    if(st.buf.length){
      ensurePath(st, true).then(real => {
        if(real) openConfirmSave(p);
        else flash(t("msgNeedPathToSave"), true);   // Cancelled or no match: just tell the user, do not force Save As
      }).catch(() => {});
      return;
    }
  }
  if(st.src){ openConfirmSave(p); return; }
  /* Without a directly known path (e.g. dropped from Explorer):
   ask the host to look it up by name + size. A unique hit counts immediately after one overwrite
   confirmation; several namesakes make the user pick; nothing matching falls back to Save As. */
  const cached = locCache[locKey(st.name, st.buf.length)];
  if(cached && st.name){                       // The other pane just picked the same file: reuse it, do not ask twice
    st.src = cached; updateGates(); openConfirmSave(p); return;
  }
  if(st.name && window.__beLocate){
    window.__beLocate(st.name, st.buf.length, true, nearPathOf(p)).then(found => {
      if(st.src){ openConfirmSave(p); return; }
      if(found && found.path && adoptLocate(st, found)){
        updateGates();
        openConfirmSave(p);
        return;
      }
      if(found){                               // No matching file in the project -> Save As once
        flash(t("msgNoSrcThenSave"), true);
        openSavePick(p);
      }
      /* found === null: the user pressed Esc in the picker -- do nothing, never write blindly */
    }).catch(() => {});
    return;
  }
  flash(t("msgNoSrcThenSave"), true);    // Really no source: Save As once, the destination becomes the source after that
  openSavePick(p);
}
/* Candidates found by name: the name must match and the size must equal the current content,
   so a different file with the same name is never overwritten by mistake.
   trusted: the path was named by the user (or accepted earlier and cached by the host) --
   then a changed size still writes back, otherwise editing two bytes would make saving impossible. */
function adoptLocate(st, found){
  if(!found || !found.path) return false;
  const base = String(found.path).split(/[\\/]/).pop();
  if(st.name && base && base.toLowerCase() !== String(st.name).toLowerCase()) return false;
  if(!found.trusted && found.size != null && st.buf && found.size !== st.buf.length) return false;
  st.src = { kind: "path", path: found.path };
  locCache[locKey(st.name, st.buf.length)] = st.src;   // Remember the result so the other pane with the same name does not ask again
  tryPartnerLocate(st === P.B ? "B" : "A", st.src.path);   // Adopt the source for the other pane of the same drop too, no second question
  return true;
}
/* Ask once per session for a given name and length: remember the path that was picked.
   A changed length invalidates it (relocate) so a resized pane never writes to the wrong path */
const locCache = {};
function locKey(name, len){ return String(name || "").toLowerCase() + "|" + (len | 0); }

/* ---------- "Two dropped at once" = one directory ---------- */
/* Both panes arrived in one drop (same pairTok) -> the directories imply each other, so saving
   must not pop a picker; only separately dropped panes can come from different directories,
   and those keep the old "ask when needed" behaviour. */
let pairSeq = 0;
function isPaired(p){
  const q = p === "A" ? "B" : "A";
  return !!(P[p].pairTok && P[p].pairTok === P[q].pairTok);
}
/* Give the host a "same directory" hint: only for a single drop (same directory by definition),
   not for separate drops, which keep the old "ask when needed" behaviour */
function nearPathOf(p){
  if(!isPaired(p)) return "";
  const other = P[p === "A" ? "B" : "A"];
  if(!other || !other.src || other.src.kind !== "path") return "";
  return other.src.path;
}
/* Once one pane knows its source, the other pane of the same drop resolves within that directory
   (same name and size there means it is the file) */
function tryPartnerLocate(p, dirFrom){
  if(!isPaired(p) || !dirFrom || !window.__beLocate) return;
  const other = P[p === "A" ? "B" : "A"];
  if(!other || other.src || !other.name || !other.buf || !other.buf.length) return;
  const tok = P[p].pairTok;
  window.__beLocate(other.name, other.buf.length, false, dirFrom).then(found => {
    if(P[p].pairTok !== tok) return;
    if(adoptLocate(other, found)) updateGates();
  }).catch(() => {});
}
/* Neither pane knows its source yet: let the host find a directory that holds both files.
   One hit adopts both panes, so pressing Save never dumps a long list of namesakes first. */
function tryPairLocate(){
  const A = P.A, B = P.B;
  if(!isPaired("A")) return;
  if(!A.name || !B.name || !A.buf || !A.buf.length || !B.buf || !B.buf.length) return;
  if(A.src && B.src) return;
  const tokA = A.pairTok, tokB = B.pairTok;
  const alive = () => tokA && tokB && A.pairTok === tokA && B.pairTok === tokB;
  const known = A.src && A.src.kind === "path" ? "A"
              : (B.src && B.src.kind === "path" ? "B" : null);
  if(known){                               // One pane has a path -> resolve the other one inside its directory
    tryPartnerLocate(known, P[known].src.path);
    return;
  }
  if(!window.__beLocatePair) return;
  window.__beLocatePair({ name: A.name, size: A.buf.length }, { name: B.name, size: B.buf.length })
    .then(r => {
      if(!r || !alive()) return;
      let hit = false;
      if(r.a && !A.src) hit = adoptLocate(A, r.a) || hit;
      if(r.b && !B.src) hit = adoptLocate(B, r.b) || hit;
      if(hit) updateGates();
    }).catch(() => {});
}

/* Bind a pane to a real on-disk path: prefer an existing path, otherwise ask the host to look it up
   by name + current size. With ask=true (the user pressed Save) namesakes make the user pick;
   with ask=false only a unique hit counts and the user is never disturbed. */
async function ensurePath(st, ask){
  if(st.src && st.src.kind === "path") return st.src.path;
  if(!window.__beLocate || !st.name || !st.buf) return null;
  const p = st === P.B ? "B" : "A";
  const found = await window.__beLocate(st.name, st.buf.length, !!ask, nearPathOf(p));
  if(found && found.path && adoptLocate(st, found)) return st.src.path;
  return null;
}
async function doSaveBack(){
  $("cfmSaveMask").classList.remove("show");
  const st = P[cfmSavePane], src = st.src;
  if(!st.buf || !st.buf.length || !src) return;
  try{
    let done = false;
    if(src.kind === "path"){
      if(!hostWriteFile) throw new Error("host unavailable");
      const ok = await hostWriteFile(src.path, st.buf);
      if(!ok) return;                                   // The host already reported why it failed
      done = true;
    } else if(src.kind === "handle"){
      /* The handle has no write permission in the extension (createWritable blocked): turn it into a real path first */
      if(!inHost){
        try{
          const w = await src.handle.createWritable();
          await w.write(st.buf);
          await w.close();
          done = true;
        }catch(_){ /* If that fails, resolve the path instead; the fallbacks below take over */ }
      }
      if(!done){
        const real = await ensurePath(st, true);
        if(!real){
          flash(t("msgNeedPathToSave"), true);
          openSavePick(cfmSavePane);
          return;
        }
        const ok = await hostWriteFile(real, st.buf);
        if(!ok) return;
        done = true;
      }
    } else {
      flash(t("msgNoSrc"), true); return;
    }
    flash(t("msgSavedBack") + (st.name || srcLabel(src)));
  }catch(err){
    flash(t("msgSaveFail") + (err && err.message || err), true);
  }
}
$("cfmSaveYes").onclick = doSaveBack;
$("cfmSaveNo").onclick = () => $("cfmSaveMask").classList.remove("show");
$("cfmSaveMask").addEventListener("click", e => {

});

/* ---- Save per pane: A and B each write their own file ---- */
function paneName(p){
  return (p === "B" ? P.B.name : P.A.name) || (p === "B" ? "compare.bin" : "output.bin");
}
function setPaneName(p, nm){
  if(!nm) return;
  if(p === "B"){ P.B.name = nm; nameB = nm; }
  else { P.A.name = nm; nameA = nm; }
  render();                                        // Keep the pane header name in sync
}
function baseOf(nm){
  return String(nm || "").replace(/\.(hex\.txt|txt|hex|bin)$/i, "");
}
/* Save: ask which format first, then run the normal save flow */
let savePickPane = "A";
function openSavePick(p){
  if(!P[p].buf || !P[p].buf.length){ flash(t("msgPaneEmpty", {p: p}), true); return; }
  savePickPane = p;
  $("savePickSub").textContent = t("savePickSub", {p: p, n: P[p].buf.length, name: paneName(p)});
  $("savePickMask").classList.add("show");
}
$("saveAsBin").onclick = () => { $("savePickMask").classList.remove("show"); savePane(savePickPane, false); };
$("saveAsTxt").onclick = () => { $("savePickMask").classList.remove("show"); savePane(savePickPane, true); };
$("savePickClose").onclick = () => $("savePickMask").classList.remove("show");
$("savePickMask").addEventListener("click", e => {
  if(e.target === $("savePickMask")) $("savePickMask").classList.remove("show");
});

async function savePane(p, asText){
  const buf = (p === "B" ? P.B.buf : P.A.buf);
  if(!buf || !buf.length){ flash(t("msgNeedData", {p: p}), true); return; }
  let base = baseOf(paneName(p));
  if(!base || /^[(（]/.test(base)) base = (p === "B" ? "compare" : "output");
  const suggested = asText ? base + ".hex.txt" : base + ".bin";
  const blob = asText
    ? new Blob([hexTextDump(buf)], { type: "text/plain" })
    : new Blob([buf], { type: "application/octet-stream" });
  window.__beSavedPath = null;                 // The host writes it and reports the real path back
  window.__beSavedHandle = null;               // Browser build: the destination handle returned by the picker
  const hadSrc = !!P[p].src;
  const real = await saveData(blob, suggested);
  /* Saving binary renames this buffer and updates the header;
   saving HEX text only exports a copy, the buffer keeps its name */
  if(real && !asText){
    setPaneName(p, real);
    /* After Save As, the destination becomes the "source file", so later Save writes straight there */
    const hp = window.__beSavedPath, hh = window.__beSavedHandle;
    if(hp || hh){
      P[p].src = hp ? { kind: "path", path: hp } : { kind: "handle", handle: hh, name: real };
      updateGates();
      if(!hadSrc) flash(t("msgSrcLinked") + (hp || real));   // The first write also adopts the source
    }
  }
}

$("btnSetLen").onclick = () => {
  if(!$("newSize").value.trim()){ flash(t("msgNeedLen"), true); return; }
  const n = parseAny($("newSize").value);
  if(n === null || n < 0){ flash(t("msgBadNum"), true); return; }
  const fill = fillByte();
  let nb;
  if(n <= data.length) nb = data.slice(0, n);
  else { nb = new Uint8Array(n); nb.set(data); if(fill) nb.fill(fill, data.length); }
  if(data.length) doOp(0, data, nb);
  else { data = nb; clearDiff(); render(); }
  cursor = Math.min(cursor, data.length);
  render();
  flash(t("msgLenSet", {n: n, f: hex2(fill)}));
};
$("btnUndo").onclick = () => { commitPending(); undo(); };
$("btnRedo").onclick = () => { commitPending(); redo(); };

$("btnGoto").onclick = () => {
  const v = parseAny($("gotoInput").value);
  if(v === null || isNaN(v)){ flash(t("msgBadOffset"), true); return; }
  moveCursor(Math.min(v, data.length));
};
$("gotoInput").addEventListener("keydown", e => { if(e.key === "Enter") $("btnGoto").onclick(); });

$("btnSearch").onclick = () => {
  let pat;
  try{ pat = parsePattern($("searchInput").value); }
  catch(err){ flash(String(err.message || err), true); return; }
  if(!pat.length){ flash(t("msgNoHex"), true); return; }
  const span = data.length - pat.length + 1;
  if(span <= 0){ flash(t("msgShort"), true); return; }
  const start = cursor + 1;
  for(let i = 0; i < span; i++){
    const idx = (start + i) % span;
    let ok = true;
    for(let j = 0; j < pat.length; j++) if(data[idx + j] !== pat[j]){ ok = false; break; }
    if(ok){
      commitPending(); selAnchor = idx; cursor = idx + pat.length - 1;
      scrollArea.scrollTop = Math.max(0, Math.floor(idx / BPR) * ROWH - scrollArea.clientHeight / 2);
      if(dualVisible()) scrollAreaB.scrollTop = scrollArea.scrollTop;
      render();
      flash(t("msgSearchFound", {off: fmtOff(idx)}));
      return;
    }
  }
  flash(t("msgNotFound"), true);
};
$("searchInput").addEventListener("keydown", e => { if(e.key === "Enter") $("btnSearch").onclick(); });

$("btnInsert").onclick = () => {
  const n = parseAny($("opCount").value);
  if(n === null || n < 1){ flash(t("msgBadNum"), true); return; }
  let fill = parseByte($("insFill").value);
  if(fill === null) fill = 0;
  commitPending();
  const off = fmtOff(cursor);
  doOp(cursor, new Uint8Array(0), new Uint8Array(n).fill(fill));
  flash(t("msgInserted", {off: off, n: n}));
};
/* Copy / paste / delete inside a pane: switch to that pane first, A and B stay independent */
function actDelete(){
  const sel = selRange();
  if(sel){
    const s = sel[0], n = sel[1] - s + 1;
    doOp(s, bytesAt(s, n), new Uint8Array(0));
    selAnchor = null; cursor = s; render();
    flash(t("msgDelSel", {n: n}));
    return;
  }
  const n = parseAny($("opCount").value);
  if(n === null || n < 1){ flash(t("msgBadNum"), true); return; }
  const cnt = Math.min(n, data.length - cursor);
  if(cnt <= 0){ flash(t("msgNoDel"), true); return; }
  doOp(cursor, bytesAt(cursor, cnt), new Uint8Array(0));
  flash(t("msgDeleted", {n: cnt}));
}
function actCut(){
  const sel = selRange();
  if(!sel){ flash(t("msgNeedSel"), true); return; }
  const s = sel[0], n = sel[1] - s + 1;
  const bytes = bytesAt(s, n);
  copyText(hexOf(bytes, " "));
  doOp(s, bytes, new Uint8Array(0));
  selAnchor = null; cursor = Math.min(s, Math.max(data.length - 1, 0)); render();
  flash(t("msgCut", {n: n}));
}
function actCopyPane(){
  const sel = selRange();
  if(sel){ copySelectionHex(); return; }
  if(!data.length){ flash(t("msgPaneEmpty", {p: activePane}), true); return; }
  copyText(hexOf(data, " "));
  flash(t("msgCopyAll", {n: data.length}));
}
/* Switch pane + empty-pane guard: paste allows an empty pane, so it is handled separately */
function inPane(p, fn){
  if(!P[p].buf || !P[p].buf.length){ flash(t("msgPaneEmpty", {p: p}), true); return; }
  if(activePane !== p){ commitPending(); activePane = p; updateActiveUI(); render(); }
  fn();
}
function focusPane(p){
  if(activePane === p) return;
  if(!P[p].buf) return;                 // Do not switch to an empty pane yet; loadTo switches once the paste is done
  commitPending(); activePane = p; updateActiveUI(); render();
}

/* Real paste: put the clipboard HEX straight into this pane ("import" replaces the whole pane, do not confuse the two) */
function switchPane(p){
  if(activePane === p) return;
  if(P[p].buf) commitPending();
  activePane = p; updateActiveUI(); render();
}
function applyPaste(p, bytes){
  const st = P[p];
  if(!st.buf || !st.buf.length){                    // Empty pane: drop it in
    loadTo(p, bytes, p === "B" ? "pasted(B).hex" : "pasted.hex");
    cursor = data.length; render();
    flash(t("msgPasteIns", {n: bytes.length}));
    return;
  }
  switchPane(p);
  /* Start point: the selection head when there is one, but its length no longer decides how much is replaced --
   that comes from the insert / overwrite mode below (which is what the user asked for) */
  const sel = selRange();
  const at = sel ? sel[0] : cursor;
  if(sel) selAnchor = null;
  if(insModeOn){                                    // Insert mode: insert the whole run and shift the rest along
    doOp(at, new Uint8Array(0), bytes);
    cursor = at + bytes.length; render();
    flash(t("msgPasteIns", {n: bytes.length}));
    return;
  }
  const room = Math.max(data.length - at, 0);       // Overwrite mode: same-length overwrite, the length does not change
  if(room === 0){                                   // Caret at the end, nothing to overwrite -> append it
    doOp(at, new Uint8Array(0), bytes);
    cursor = at + bytes.length; render();
    flash(t("msgPasteIns", {n: bytes.length}));
    return;
  }
  const n = Math.min(bytes.length, room);
  doOp(at, bytesAt(at, n), bytes);
  cursor = at + bytes.length; render();
  flash(bytes.length > n ? t("msgPasteCoverGrow", {n: n, m: bytes.length - n})
                        : t("msgPasteCover", {n: n}));
}
function pasteHexToPane(p){
  if(!P[p].buf || !P[p].buf.length){        // Empty pane: open or import a file first, then paste
    flash(t("msgPaneEmpty", {p: p}), true); return;
  }
  const area = p === "B" ? scrollAreaB : scrollArea;
  if(!navigator.clipboard || !navigator.clipboard.readText){
    area.focus(); flash(t("msgClipDenied"), true); return;
  }
  navigator.clipboard.readText().then(txt => {
    area.focus();
    if(!txt || !txt.trim()){ flash(t("msgClipEmpty"), true); return; }
    let bytes;
    try{ bytes = parseHex(txt); }
    catch(err){ flash(String(err.message || err), true); return; }
    if(!bytes.length){ flash(t("msgNoHex"), true); return; }
    applyPaste(p, bytes);
  }).catch(() => { area.focus(); flash(t("msgClipDenied"), true); });
}
/* Ctrl+V inside the edit area also pastes: no clipboard permission involved, the most reliable path */
["A", "B"].forEach(p => {
  const area = p === "B" ? scrollAreaB : scrollArea;
  area.addEventListener("paste", e => {
    const cd = e.clipboardData || window.clipboardData;
    const txt = cd ? cd.getData("text") : "";
    if(!txt || !txt.trim()) return;
    e.preventDefault();
    if(!P[p].buf || !P[p].buf.length){ flash(t("msgPaneEmpty", {p: p}), true); return; }
    let bytes;
    try{ bytes = parseHex(txt); }
    catch(err){ flash(String(err.message || err), true); return; }
    if(!bytes.length){ flash(t("msgNoHex"), true); return; }
    applyPaste(p, bytes);
  });
});

/* Insert / overwrite mode: with the bottom strip gone, the Insert key toggles it (with a toast) */
function setInsMode(v){
  insModeOn = !!v;
  $("stMode").textContent = t(insModeOn ? "insertM" : "overwrite");
  flash(t(insModeOn ? "msgInsOn" : "msgOvrOn"));
}
/* The word "mode" in the status bar is clickable (dotted underline + pointer), and Insert works too */
$("stMode").style.cursor = "pointer";
$("stMode").style.textDecoration = "underline dotted";
$("stMode").title = t("insModeTip");
$("stMode").onclick = () => setInsMode(!insModeOn);

/* ================= Radix / language switch ================= */
$("btnBase").onclick = () => {
  const prev = ["newSize", "opCount"].map(id => ({id: id, n: parseAny($(id).value)}));
  numBase = numBase === 16 ? 10 : 16;
  prev.forEach(v => {
    if(v.n === null) return;
    $(v.id).value = numBase === 16 ? "0x" + v.n.toString(16).toUpperCase() : String(v.n);
  });
  updateBaseBtn();
  updatePh();                                        // The prompt follows the radix
  try{ localStorage.setItem("hxBase", numBase); }catch(e){}
  render(); renderDiffPanel();
};
$("btnLang").onclick = () => {
  lang = lang === "zh" ? "en" : "zh";
  try{ localStorage.setItem("hxLang", lang); }catch(e){}
  applyLang();
};

/* ================= Startup ================= */
$("newSize").addEventListener("keydown", e => {
  if(e.key !== "Enter") return;
  if(e.shiftKey) $("btnSetLen").onclick(); else $("btnNew").onclick();
});
$("opCount").addEventListener("keydown", e => { if(e.key === "Enter") $("btnInsert").onclick(); });
updateBaseBtn();
applyLang();
updateBPane();
updateActiveUI();
render();
</script>
<script>
/* ===== VS Code webview bridge (extension only; skipped automatically when opened in a browser) ===== */
(function(){
  const VSC = (typeof acquireVsCodeApi === "function") ? acquireVsCodeApi() : null;
  if(!VSC) return;
  let reqSeq = 0;
  const saveWaiters = {};
  let clipResolve = null, clipReject = null;

  function u8ToB64(u8){
    let s = ""; const CH = 0x8000;
    for(let i = 0; i < u8.length; i += CH)
      s += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
    return btoa(s);
  }
  function b64ToU8(b){
    const s = atob(b); const u = new Uint8Array(s.length);
    for(let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
    return u;
  }
  function mkFile(bytes, name){
    try{ return new File([bytes], name); }
    catch(e){ const b = new Blob([bytes]); b.name = name; return b; }
  }

  /* ---- State snapshot: the safety net for "split editor / drag the tab to another group" ----
   A rebuilt webview is a brand-new page with nothing in it. So on every change both panes
   (name, source path, bytes) are reported to the host, which pushes them back when the new
   instance says ready. */
  let snapT = 0;
  /* The fallback copy: if VS Code rebuilds the webview and the state does not come along, this still can */
  const BE_SNAP_KEY = "biosBuddy.beSnap";
  /* Snapshot format version. Copies written by older builds have no version and are ignored on sight:
     that is what makes a pair the user cleared before the upgrade stay gone after Reload Window. */
  const SNAP_V = 2;
  const snapOk = v => !!v && v.v === SNAP_V;
  /* Only a pane that actually holds bytes is worth remembering: a 0-byte pane is "not loaded", and
     restoring it as a named-but-empty pane is worse than restoring nothing at all. */
  function paneSnap(p){
    const st = P[p];
    if(!st || !st.buf || !st.buf.length) return null;
    return {
      name: st.name || "",
      path: (st.src && st.src.kind === "path") ? st.src.path : "",
      data: u8ToB64(st.buf)
    };
  }
  /* Path-only copy: when the bytes are too big to shuttle through postMessage, a rebuilt page can
     still re-read the two source files by path — silently, instead of coming back empty. */
  function pathSnap(p){
    const st = P[p];
    if(!st || !st.name) return null;
    return { name: st.name || "", path: (st.src && st.src.kind === "path") ? st.src.path : "" };
  }
  /* The persisted copies (webview state, localStorage) never carry megabytes of bytes: keeping just
     the two paths is enough, a rebuilt page re-reads the files from disk. Small pairs keep their
     bytes so a rebuild costs nothing at all. */
  function slimOf(x){ return x ? { name: x.name || "", path: x.path || "", data: "" } : null; }
  function saveState(a, b, heavy){
    const slim = heavy ? { v: SNAP_V, a: slimOf(a), b: slimOf(b) } : { v: SNAP_V, a, b };
    try{ VSC.setState({ snap: slim }); }catch(e){}
    try{
      const sz = (slim.a && slim.a.data ? slim.a.data.length : 0) + (slim.b && slim.b.data ? slim.b.data.length : 0);
      localStorage.setItem(BE_SNAP_KEY, JSON.stringify(sz <= 3 * 1024 * 1024 ? slim
        : { v: SNAP_V, a: slimOf(slim.a), b: slimOf(slim.b) }));
    }catch(e){ /* Quota exceeded is fine, the state path still works */ }
  }
  function forgetSnap(){
    /* Both panes are empty on purpose (Clear, or "select all + Delete"). Drop every saved copy as
       well — the host's in-memory snapshot and the persisted ones. Without this the old pair is
       pushed straight back the next time the tool opens, i.e. cleared content comes back from the
       dead. */
    VSC.postMessage({ type: "snapshot", a: null, b: null });
    try{ VSC.setState({ snap: null }); }catch(e){}
    try{ localStorage.removeItem(BE_SNAP_KEY); }catch(e){}
  }
  function snapNow(){
    try{
      const total = (P.A.buf ? P.A.buf.length : 0) + (P.B.buf ? P.B.buf.length : 0);
      if(total > 24 * 1024 * 1024){                 // Too big even for the in-memory copy: paths are enough to come back
        const pa = pathSnap("A"), pb = pathSnap("B");
        VSC.postMessage({ type: "snapshotPaths", a: pa, b: pb });
        saveState(pa, pb, true);
        return;
      }
      const a = paneSnap("A"), b = paneSnap("B");
      if(!a && !b){
        if(hadContent){ hadContent = false; forgetSnap(); }
        return;
      }
      hadContent = true;
      VSC.postMessage({ type: "snapshot", a, b });
      // Keep a copy in two places:
      //   1) webview state -- on split or drag-to-another-group VS Code builds the new instance with it;
      //   2) localStorage -- when the new instance gets no state, webviews in the same window share an origin and can read it here.
      const sz = (a && a.data ? a.data.length : 0) + (b && b.data ? b.data.length : 0);
      saveState(a, b, sz > 8 * 1024 * 1024);
    }catch(e){ /* A failed snapshot must not break anything */ }
  }
  /* immediate=true is used by Clear: the tab may be closed inside the 600ms debounce, and a
     snapshot that never fires is exactly how cleared content survives a reopen. An empty pair is
     flushed at once for the same reason ("select all + Delete" then close the tab). */
  function scheduleSnap(immediate){
    clearTimeout(snapT);
    const empty = !(P.A.buf && P.A.buf.length) && !(P.B.buf && P.B.buf.length);
    if(immediate || empty){ snapNow(); return; }
    snapT = setTimeout(snapNow, 600);
  }
  window.__beSnap = scheduleSnap;
  scheduleSnap();                                    // Fire once right after the bridge is up, so the page has a base as soon as it is ready

  /* Clipboard: the webview may refuse it, so route through the extension */
  try{
    Object.defineProperty(navigator, "clipboard", {
      configurable: true,
      value: {
        readText: () => new Promise((res, rej) => {
          clipResolve = res; clipReject = rej;
          VSC.postMessage({ type: "readClipboard" });
        }),
        writeText: (t2) => { VSC.postMessage({ type: "writeClipboard", text: t2 }); return Promise.resolve(); }
      }
    });
  }catch(e){}

  /* Save: hand the buffer to the extension and show the VS Code save dialog */
  const origSaveData = saveData;
  saveData = async function(blob, name){
    try{
      const buf = new Uint8Array(await blob.arrayBuffer());
      const id = ++reqSeq;
      const p = new Promise(res => { saveWaiters[id] = res; });
      VSC.postMessage({ type: "save", id, name, data: u8ToB64(buf) });
      const real = await p;
      return real;
    }catch(e){ return origSaveData(blob, name); }
  };

  /* Open button: show the VS Code file picker (two files at once are sorted into A and B) */
  const pick = pane => VSC.postMessage({ type: "pickFile", pane });
  $("impPickA").onclick = () => pick("A");
  $("impPickB").onclick = () => pick("B");

  /* Save back to the source file: hand the buffer to the host to write at the original path */
  let wrSeq = 0; const wrWaiters = {};
  const srcOf = m => m.path ? { kind: "path", path: m.path } : null;
  hostWriteFile = (path, bytes) => new Promise(res => {
    const id = ++wrSeq; wrWaiters[id] = res;
    VSC.postMessage({ type: "writeFile", id, path, data: u8ToB64(bytes) });
  });

  /* Without a path (dropped from Explorer, which gives none): let the host look it up by name + size.
   ask=false: only a unique hit counts, the user is never disturbed (this is the background path at load time);
   ask=true : the user pressed Save, a unique hit is adopted silently and only namesakes make them pick.
   nearPath: the path of the other pane from the same drop -- same name and size in that directory
   means it is the file, adopt it without a dialog. */
  let locSeq = 0; const locWaiters = {};
  window.__beLocate = (name, size, ask, nearPath) => new Promise(res => {
    const id = ++locSeq;
    const done = v => { if(!locWaiters[id]) return; delete locWaiters[id]; res(v); };
    locWaiters[id] = done;
    VSC.postMessage({ type: "locateFile", id, name, size: (size | 0), ask: !!ask, nearPath: nearPath || "" });
    setTimeout(() => done(null), ask ? 60000 : 1200);   // Fallback for hosts that do not know this message
  });
  /* For "two dropped at once": find a directory that holds both files. A hit means that is where they
   came from, so both panes adopt their source and Save never lists namesakes. */
  window.__beLocatePair = (a, b) => new Promise(res => {
    const id = ++locSeq;
    const done = v => { if(!locWaiters[id]) return; delete locWaiters[id]; res(v); };
    locWaiters[id] = done;
    VSC.postMessage({
      type: "locatePair", id,
      a: { name: a.name, size: a.size | 0 },
      b: { name: b.name, size: b.size | 0 },
    });
    setTimeout(() => done(null), 6000);
  });

  /* ---------- Drag and drop: VS Code Explorer and system files; two at most ---------- */
  const dropFiles = dt => {                       // files can be empty while items still carries a File
    const out = Array.from((dt && dt.files) || []);
    if(!out.length && dt && dt.items){
      for(const it of Array.from(dt.items)){
        if(it.kind === "file"){ const f = it.getAsFile && it.getAsFile(); if(f) out.push(f); }
      }
    }
    return out;
  };
  const URIMIMES = ["text/uri-list", "application/vnd.code.uri-list", "resourceURLs", "codefiles"];
  const collectUris = dt => {
    const out = [];
    const types = Array.from((dt && dt.types) || []).map(t => String(t).toLowerCase());
    const has = m => types.includes(m.toLowerCase());
    const add = v => String(v).split(/\r?\n/).forEach(x => {
      x = x.trim();
      if(x && x !== "undefined" && !/^#/.test(x)) out.push(x);
    });
    for(const mime of URIMIMES){
      if(!has(mime)) continue;
      try{ const v = dt.getData(mime); if(v) add(v); }catch(e){}
    }
    if(has("text/plain")){                 // Some drags only expose plain-text paths
      try{
        const raw = String(dt.getData("text/plain") || "").trim();
        if(/^(file:|vscode-file:|vscode-remote:|[a-zA-Z]:[\\/]|\/)/.test(raw)) add(raw);
      }catch(e){}
    }
    return Array.from(new Set(out));
  };
  const hideHint = () => $("dropHint").classList.remove("show", "dropB");

  /* Important: during a drag dataTransfer may be locked (files empty, types hidden), so dragenter and
   dragover must call preventDefault unconditionally to accept the drop. Otherwise the webview refuses,
   the VS Code workbench takes over and the file opens in another tab. What it is gets decided on drop. */
  document.addEventListener("dragenter", e => {
    e.preventDefault(); e.stopPropagation();
    $("dropHint").classList.add("show");
  }, true);
  document.addEventListener("dragover", e => {
    e.preventDefault(); e.stopPropagation();
    try{ e.dataTransfer.dropEffect = "copy"; }catch(_){}
    $("dropHint").classList.add("show");
    $("dropHint").classList.toggle("dropB", !!e.altKey);
  }, true);
  document.addEventListener("dragleave", e => {
    e.stopPropagation();
    hideHint();
  }, true);
  document.addEventListener("drop", e => {
    e.preventDefault(); e.stopPropagation();
    hideHint();
    const dt = e.dataTransfer;
    const files = dropFiles(dt);
    /* Check for a uri-list first: dragging from the VS Code Explorer carries real paths,
   and handing them to the extension yields a path (saving straight to it is the most reliable) */
    const uris = collectUris(dt);
    /* Some Electron versions put a real path on Files dropped from the OS -- use it when present,
   which even skips the "adopt the source" step when saving back */
    const fpaths = files.map(f => (f && typeof f.path === "string") ? f.path : "").filter(Boolean);
    const list = uris.length ? uris : fpaths;
    if(list.length){
      VSC.postMessage({ type: "readUris", uris: list.slice(0, 2), alt: !!e.altKey, total: list.length });
      return;
    }
    if(files.length){                       // OS file (Explorer): no path available, so locate it by name + size
      /* The webview sandbox blocks createWritable(): the handle is obtainable but useless, so skip it.
   Let the host resolve the real path by name + size, which is what actually makes saving work. */
      if(files.length >= 2){
        loadTwoFiles(files[0], files[1], null, null);
        return;
      }
      const target = e.altKey ? "B" : "A";
      files[0].arrayBuffer().then(buf => loadTo(target, buf, files[0].name, null))
        .catch(() => flash(lang === "zh" ? "读取文件失败" : "Failed to read the file", true));
      return;
    }
    flash(lang === "zh" ? "拖入的内容无法识别，请从资源管理器拖文件"
                        : "Unrecognized drop — drag files from the Explorer", true);
  }, true);

  window.addEventListener("message", e => {
    const m = e.data; if(!m || !m.type) return;
    switch(m.type){
      case "init": {
        if(m.name && m.data) loadTo(m.pane || "A", b64ToU8(m.data), m.name, srcOf(m), m.quiet === true);
        /* "Open in Binary Editor" on a single file = edit that file on its own: collapse the
           pane the file did not land in, so the window is not half empty. The hidden pane keeps
           its bytes — turning Dual back on brings it straight back. */
        if(m.single){ dualView = false; updateBPane(); render(); }
        break;
      }
      case "filePicked": {          // A single file -> stage it in the import dialog (same as the web version)
        if(m.cancel) return;
        setImpPend(m.pane, { bytes: b64ToU8(m.data), name: m.name, src: srcOf(m) });
        updateImpLen();
        flash(t("msgFilePicked", { n: m.name }));
        break;
      }
      case "fileDirect": {          // A single drop -> load it into the given pane directly
        loadTo(m.pane, b64ToU8(m.data), m.name, srcOf(m));
        break;
      }
      case "filesLoaded2": {        // Two at once -> one for A, one for B
        try{
          loadTwoFiles(mkFile(b64ToU8(m.a.data), m.a.name), mkFile(b64ToU8(m.b.data), m.b.name),
                       srcOf(m.a), srcOf(m.b), m.quiet === true);
        }catch(err){ flash(lang === "zh" ? "读取文件失败" : "Failed to read the files", true); }
        break;
      }
      case "writeResult": {
        const w = wrWaiters[m.id]; delete wrWaiters[m.id];
        if(w) w(m.ok === true);
        break;
      }
      case "locateResult": {
        const w = locWaiters[m.id];
        if(w) w(m.path ? { path: m.path, size: (typeof m.size === "number" ? m.size : null),
                          trusted: m.trusted === true }
                       : (m.none === true ? { none: true } : null));   // none=true: nothing found; null: the user cancelled
        break;
      }
      case "locatePairResult": {
        const w = locWaiters[m.id];
        if(w) w(m.a && m.a.path ? { a: { path: m.a.path, size: m.a.size }, b: m.b && m.b.path ? { path: m.b.path, size: m.b.size } : null } : null);
        break;
      }
      case "saved": {
        const w = saveWaiters[m.id]; delete saveWaiters[m.id];
        if(m.ok) window.__beSavedPath = m.path || null;    // The Save As destination, used to adopt the source
        if(w) w(m.ok ? m.name : null);
        if(m.ok) flash(t("msgSaved") + m.name);
        break;
      }
      case "clipboardText": {
        if(clipResolve){ const r = clipResolve; clipResolve = clipReject = null; r(m.text); }
        break;
      }
      case "clipboardError": {
        if(clipReject){ const r = clipReject; clipResolve = clipReject = null; r(new Error("denied")); }
        break;
      }
    }
  });

  /* ---------- Self-restore after "split editor / drag the tab to another group" ----------
   VS Code builds a brand-new webview from the same html, and the host may not be in time
   (or may never hear about it), so the content never arrives and the split is blank. So restore
   locally first: 1) webview state -- VS Code hands the setState copy to the rebuilt instance;
   2) localStorage -- the copy when it does not. Once restored, mark ready with restored so a host
   that brings no files does not pour the snapshot in a second time. */
  let booted = false;
  let reread = null;      // The snapshot knows which files were on screen but not their bytes
  try{
    const st0 = VSC.getState() || {};
    let bs = snapOk(st0.snap) ? st0.snap : null;
    if(!bs){
      let ls = null;
      try{ ls = JSON.parse(localStorage.getItem(BE_SNAP_KEY) || "null"); }catch(e2){ ls = null; }
      if(snapOk(ls)) bs = ls;
      else if(ls){ try{ localStorage.removeItem(BE_SNAP_KEY); }catch(e2){} }   // Written by an older build: drop it
    }
    const hasData = v => !!(v && typeof v.data === "string" && v.data.length);
    if(bs && (bs.a || bs.b)){
      if((!bs.a || hasData(bs.a)) && (!bs.b || hasData(bs.b))){
        if(bs.a && bs.b){
          loadTwoFiles(mkFile(b64ToU8(bs.a.data), bs.a.name), mkFile(b64ToU8(bs.b.data), bs.b.name),
                       srcOf(bs.a), srcOf(bs.b), true);
        } else {
          const one = bs.a || bs.b;
          loadTo(bs.a ? "A" : "B", b64ToU8(one.data), one.name, srcOf(one), true);
        }
        booted = true;
      } else if((bs.a && bs.a.path) || (bs.b && bs.b.path)){
        /* A pane was recorded without its bytes (too big to shuttle, or a state copy that lost them).
           Re-read those paths instead of restoring a pair of empty panes. */
        reread = { a: (bs.a && bs.a.path) || "", b: (bs.b && bs.b.path) || "" };
      } else {
        /* Neither bytes nor a path: nothing to bring back. Drop the copy, or every rebuild would
           restore the same empty panes again. */
        try{ VSC.setState({ snap: null }); }catch(e){}
        try{ localStorage.removeItem(BE_SNAP_KEY); }catch(e){}
      }
    }
  }catch(e){ booted = false; }

  /* Nothing to restore on our own: ask the host for the last snapshot of this tool.
     "Split editor" can hand a brand new webview to us with no state at all, and the
     host still holds the two panes it was showing a moment ago. */
  if(reread){ try{ VSC.postMessage({ type: "restorePaths", a: reread.a, b: reread.b }); }catch(e){ } }
  else if(!booted){ try{ VSC.postMessage({ type: "needSnap" }); }catch(e){ } }

  VSC.postMessage({ type: "ready", restored: booted || !!reread });
})();
</script>

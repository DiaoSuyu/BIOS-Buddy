<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:;">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Binary Editor</title>
<style>
  :root{
    --bg:#eef0f4; --panel:#ffffff; --line:#dfe2e9; --line2:#eceef3;
    --text:#1f2430; --muted:#8a90a0; --accent:#2563eb; --accent-soft:#eef2ff;
    --sel:#bfdbfe; --row-alt:#fafbfd; --danger:#dc2626;
    /* Marker the other pane shows for the active pane's cursor / selection. Each pane draws it in
       its own identity colour (A blue, B purple), so a mark on the right never looks like it
       belongs to the left */
    --mirAbg:rgba(37,99,235,.12);
    --mirBbg:rgba(124,58,237,.13);
    --diffbg:#fecaca; --difftx:#b91c1c;
    /* A / B identity colours, same pair the Text Comparer uses: A blue, B purple */
    --curA:#2563eb; --curB:#7c3aed;
    /* The centre line and the diff panel stay neutral grey, never mixed with the A / B accent colours */
    --split:#c9d0dc; --split-hi:#8b94a3;
    --tint-a-head:#e9f0ff; --tint-b-head:#f4f0ff;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif; font-size:13px;
    display:flex; flex-direction:column; overflow:hidden;
  }
  body.resizing{ user-select:none; cursor:ns-resize; }
  body.resizing-col{ user-select:none; cursor:col-resize; }
  body.resizing #diffSplit{ background:var(--row-alt); }

  /* ===== Title bar ===== */
  #titlebar{
    /* 43px in both tools: one number, so the band below it starts at the same place */
    background:var(--panel); border-bottom:1px solid var(--line); height:43px;
    padding:7px 14px; display:flex; align-items:center; gap:10px;
  }
  #titlebar .brand{font-weight:700; font-size:15px; letter-spacing:.5px; color:var(--accent);}
  /* Same recipe as the Text Comparer title bar: identical height, radius, font size and hover */
  #btnAbout{
    height:22px; padding:0 9px; font-size:11.5px; border-radius:11px; color:var(--muted);
  }
  #btnAbout:hover{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}
  /* About dialog: blurb, date row, author */
  .dlg.about{width:min(560px, 92vw); padding:18px 20px;}
  .dlg.about h3{display:flex; align-items:center; gap:8px; margin:0; font-size:17px;}
  .dlg.about h3 .vtag{font-size:11px; font-weight:600; color:#fff; background:var(--accent);
    border-radius:4px; padding:1px 7px; letter-spacing:0;}
  .ab-head{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .ab-date{display:flex; align-items:center; gap:6px; font:600 11.5px/1 Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace;
    color:var(--accent); background:var(--accent-soft); border:1px solid var(--soft-line-a);
    border-radius:6px; padding:5px 9px; white-space:nowrap;}
  .ab-date i{font-style:normal; font-weight:600; color:var(--muted); font-size:10.5px; letter-spacing:.6px;}
  .ab-blurb{font-size:12.5px; color:var(--muted); line-height:1.55; margin:7px 0 15px;}
  .ab-grid{display:grid; grid-template-columns:1fr 1fr; gap:13px 16px;}
  .ab-item{border-left:3px solid var(--soft-line-a); padding-left:10px;}
  .ab-item .t{font-size:12.5px; font-weight:700; color:var(--text);}
  .ab-item .d{font-size:11.5px; color:var(--muted); line-height:1.55; margin-top:3px;}
  .ab-foot{display:flex; gap:8px; align-items:baseline; margin-top:16px; padding-top:11px;
    border-top:1px solid var(--line2); font-size:12px; color:var(--muted);}
  .ab-foot b{color:var(--text); font-weight:600;}
  .dlg.about .btns{display:flex; justify-content:flex-end; gap:8px; margin-top:14px;}
  /* Save-format dialog */
  .dlg.pick{width:min(380px, 92vw); padding:16px 18px;}
  .dlg.pick h3{margin-bottom:6px;}
  .dlg.pick .pickSub{font-size:12px; color:var(--muted); margin-bottom:12px;}
  /* Overwrite confirmation: the path is the key information, so it gets its own readable monospace strip */
  .dlg.pick #cfmSavePath{
    font:600 12px Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace; color:var(--text); word-break:break-all;
    background:var(--head-bg); border:1px solid var(--line); border-radius:6px;
    padding:7px 9px; margin:0 0 12px; line-height:1.5;
  }
  .dlg.pick .pickRow{display:flex; gap:8px;}
  .dlg.pick .pickRow button{flex:1; height:38px; font-size:12.5px;}
  .dlg.pick .btns{display:flex; justify-content:flex-end; margin-top:10px;}
  /* Badge for a chosen file inside the import dialog */
  .impTag{display:none; margin-top:6px; font-size:11.5px; color:var(--accent); cursor:pointer;
    background:var(--accent-soft); border:1px solid var(--soft-line-a); border-radius:5px; padding:3px 7px;}
  .impTag.show{display:block;}
  .impCol.b .impTag{color:var(--curB); background:var(--tint-a); border-color:var(--soft-line-b);}
  #titlebar .spacer{flex:1;}
  #btnBase{min-width:58px; font-weight:600;}
  /* The language button matches the COM Debugger one — a normal button, not a pill */
  #btnLang{min-width:52px; height:24px; padding:0 10px; font-size:12px; font-weight:600; border-radius:6px; justify-content:center;}

  /* ===== Toolbar =====
     Size, spacing and padding copied from the Text Comparer toolbar so both tools
     look like they came out of the same mould */
  #toolbar{
    flex:none; background:var(--panel); border-bottom:1px solid var(--line);
    padding:12px 14px 10px; display:flex; flex-wrap:wrap; gap:10px; align-items:stretch;
  }
  .group{
    flex:0 0 auto;
    position:relative; border:1px solid var(--line2); border-radius:9px;
    padding:12px 9px 7px; background:var(--group-bg); display:flex; gap:6px; align-items:flex-end; flex-wrap:wrap;
    min-height:56px;
  }
  .group .cap{
    position:absolute; top:-8px; left:9px; background:var(--panel);
    padding:0 5px; font-size:11px; color:var(--muted); letter-spacing:1px;
  }
  button, input[type=text]{
    font:inherit; border:1px solid var(--line); border-radius:6px;
    background:var(--input-bg); color:var(--text); height:28px;
  }
  /* 10px side padding, like the Text Comparer buttons, so both tools size their buttons the same */
  button{padding:0 10px;}
  input[type=text]{padding:4px 8px;}
  input::placeholder{font-family:inherit; font-size:inherit; color:var(--muted); opacity:1;}
  input[type=text].num{width:104px; min-width:104px; text-align:left; font:12.5px Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace;}
  input[type=text].num.narrow{width:92px; min-width:92px;}
  input[type=text].w120{width:178px; min-width:178px; text-align:left; font:12.5px Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace;}
  select.preset{
    height:28px; border:1px solid var(--line); border-radius:6px; background:var(--input-bg);
    color:var(--text); font:12px Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace; padding:0 4px; max-width:132px; cursor:pointer;
  }
  select.preset:hover{border-color:var(--accent);}
  button{cursor:pointer; white-space:nowrap;}
  button:hover{background:var(--accent-soft); border-color:var(--accent);}
  button:active{background:var(--btn-active);}
  button:disabled{opacity:.5; cursor:not-allowed; background:var(--input-bg); border-color:var(--line); color:var(--muted);}
  input[type=text]:disabled{opacity:.55; cursor:not-allowed; background:var(--input-bg-ro); color:var(--muted);}
  button.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
  button.primary:hover{background:#1d4fd7;}
  button.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:600;}
  /* Diff navigation: ◀ 1 / 2 ▶ ⇄ plus the list toggle, laid out like the Text Comparer group */
  /* The counter is an inline block with a fixed 28px line box: it stays centred on the buttons,
     and - unlike a flex container - keeps the spaces around the slash (a flex container drops
     whitespace-only text nodes, which ate the space before the slash).
     Its width is set from the digits of the total (see updateNav), so the box keeps its place in
     the toolbar, and the text is centred inside it as plain "12 / 103310" — the old version padded
     the short number with spaces, which left the digits sitting off-centre. */
  #navPos{display:inline-block; flex:0 0 auto; width:5ch; min-width:64px; height:28px; line-height:28px;
    padding:0 6px; box-sizing:border-box; text-align:center; white-space:pre;
    font:600 12px/28px Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace;
    color:var(--muted); font-variant-numeric:tabular-nums;}
  #navPos b{color:var(--text);}
  .group button.icon{width:28px; padding:0; text-align:center;}
  .mini{font-size:12px; color:var(--muted); margin-right:-2px;}
  /* Icon column: fixed width, so icons line up with the text; field labels are the small text above an input */
  .group .ci{margin-right:5px;}
  .ci{display:inline-block; flex:0 0 16px; width:16px; text-align:center; font-size:12.5px; line-height:1;}
  .fld{display:inline-flex; flex-direction:column; gap:3px; align-items:stretch;}
  .fl{font-size:10.5px; color:var(--muted); line-height:1; margin-left:1px; white-space:nowrap;}
  .chk{display:inline-flex; align-items:center; gap:5px; color:var(--muted); user-select:none; height:28px; font-size:12.5px;}

  /* ===== Two-pane main area ===== */
  #mainArea{flex:1; display:flex; overflow:hidden; min-height:0;}
  .paneWrap{flex:1 1 0; display:flex; flex-direction:column; min-width:0; background:var(--panel); position:relative;}
  /* Between A and B: a draggable splitter whose centre line stays neutral grey, never an A or B accent */
  #paneSplit{
    display:none; flex:0 0 9px; width:9px; position:relative; cursor:col-resize;
    background:var(--group-bg); touch-action:none;
  }
  #paneSplit.show{display:block;}
  #paneSplit::before{
    content:""; position:absolute; top:0; bottom:0; left:50%; width:2px; margin-left:-1px;
    background:var(--split); transition:background .12s;
  }
  #paneSplit::after{
    content:""; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:4px; height:84px; border-radius:2px; background:var(--grip);
    box-shadow:0 0 0 1px rgba(0,0,0,.06); transition:background .12s, height .12s;
  }
  #paneSplit:hover::after, #paneSplit.dragging::after{background:var(--split-hi); height:112px;}
  #paneSplit.dragging::before{background:var(--split-hi);}
  #paneSplit.dragging{background:var(--row-alt);}
  /* Pane body: diff minimap on the far left, then the address header and hex area */
  .paneBody{flex:1 1 auto; display:flex; min-height:0; min-width:0; position:relative;}
  .paneCols{flex:1 1 0; display:flex; flex-direction:column; min-width:0; min-height:0;}
  /* Empty state: ONE hint card for the whole editor, exactly like the Text Comparer's.
     It starts below the pane headers / tool rows (top is measured in placeEmptyMain(), since
     those rows are not a fixed height) and covers both pane bodies, so an unloaded editor can
     no longer be clicked or drag-selected. Its two buttons load A or B. */
  #mainArea{position:relative;}
  #emptyMain{position:absolute; left:0; right:0; bottom:0; top:0; z-index:8; display:flex;
    align-items:center; justify-content:center; padding:20px; background:var(--panel); text-align:center;}
  #emptyMain.hide{display:none;}
  #emptyMain .ecard{display:flex; flex-direction:column; align-items:center; gap:7px;
    max-width:min(420px,88%); color:var(--muted); font-size:12.5px; line-height:1.6;
    font-family:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif;}
  #emptyMain b{color:var(--text); font-size:13.5px; font-weight:600;}
  /* Shown only when a pane still remembers a file name although every byte is gone */
  #emptyMain .enote:empty{display:none;}
  #emptyMain .enote{color:var(--danger); opacity:.85; font-size:12px;}
  #emptyMain .ebtns{display:flex; gap:8px; margin-top:6px;}
  #emptyMain button{height:28px; padding:0 12px;}
  .gutCol{
    display:none; flex:0 0 14px; width:14px; flex-direction:column;
    background:var(--off-bg); border-right:1px solid var(--line);
  }
  .gutCol.show{display:flex;}
  .gutHead{flex:0 0 23px; height:23px; border-bottom:1px solid var(--line);}
  .gutTrack{position:relative; flex:1 1 auto; overflow:hidden; cursor:pointer;}
  .gutTrack i{position:absolute; left:2px; right:2px; background:var(--gutbar); border-radius:1px; pointer-events:none;}
  .gutView{
    position:absolute; left:0; right:0; display:none; pointer-events:none;
    background:rgba(128,128,128,.26);
    border-top:1px solid rgba(128,128,128,.42); border-bottom:1px solid rgba(128,128,128,.42);
  }
  .gutView.show{display:block;}
  /* Frame around the active pane, drawn on all four sides above the content, blue for A and purple for B */
  .paneWrap::after{
    content:""; position:absolute; inset:0; display:none; pointer-events:none; z-index:7;
    border:2px solid var(--accent);
  }
  .paneWrap.active::after{display:block;}
  #paneBWrap::after{border-color:var(--curB);}
  #scrollAreaB:focus{outline:none;}
  .paneHead{
    /* Fixed 28px, the same band height the Text Comparer uses, so the two tools
       line up when they sit in a split view */
    flex:none; display:flex; align-items:center; gap:8px; height:28px;
    padding:4px 10px; font-size:12px; color:var(--muted);
    background:var(--head-bg); border-bottom:1px solid var(--line);
    font-family:Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace;
  }
  /* Pane header body: letter · side word · dot · file name, laid out as one flex row with a 7px
     gap so the dot has exactly the same space on both sides (the Text Comparer does the same). */
  .paneHead .phead{flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:7px;
    overflow:hidden; white-space:nowrap;}
  .paneHead .ptools{flex:0 0 auto; display:flex; align-items:center; gap:4px;}
  .paneHead .ptools input{
    width:148px; height:22px; font:12px Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace; color:var(--text);
    border:1px solid var(--line); border-radius:5px; padding:1px 6px; background:var(--input-bg);
  }
  .paneHead .ptools input::placeholder{font-size:11px; color:var(--muted);}
  .paneHead .ptools button{
    height:22px; font-size:11.5px; line-height:1; padding:0 7px; border-radius:5px;
  }
  .paneWrap.active .paneHead{background:var(--tint-a-head);}
  #paneBWrap.active .paneHead{background:var(--tint-b-head);}
  .paneHead .lbl{color:var(--muted); font-size:11px;}
  .paneHead .dot{color:var(--muted); font-weight:400; flex:none;}
  /* File name: body colour and bold on both panes (it used to inherit .paneHead's grey, which made B look unloaded).
     It owns the ellipsis now that the header is a flex row. */
  .paneHead .fname{flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis;
    color:var(--text); font-weight:600;}
  /* A and B each own one mirror colour: the mark the other pane paints for this pane's caret and
     selection follows the pane it is drawn in, so right-side marks are purple and left-side blue.
     Same pair as the pane badge / active frame, only the fill stays translucent. */
  #paneAWrap{--mir:var(--curA); --mirbg:var(--mirAbg);}
  #paneBWrap{--mir:var(--curB); --mirbg:var(--mirBbg); background:var(--soft-b);}
  .paneHead .badge{
    flex:0 0 auto; font-size:11px; font-weight:700; color:#fff; background:var(--curA);
    border-radius:4px; padding:1px 6px;
  }
  #paneBWrap .paneHead .badge{background:var(--curB);}
  @media (max-width:1180px){
    .paneHead .ptools input{width:104px;}
    .paneHead{font-size:11.5px;}
  }
  @media (max-width:1180px){
    .paneHead .ptools input{width:104px;}
    .paneHead{font-size:11.5px;}
  }
  /* Version badge: font size, padding and radius identical to the Text Comparer's .ver.
     Background is the theme accent (blue) — it is the tool's badge, not pane B's colour. */
  .ver{
    font:600 10.5px/1 Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace;
    color:#fff; background:var(--accent); border-radius:4px; padding:3px 7px; letter-spacing:.3px;
  }
  .paneHead b{color:var(--curA); font-size:12px;}
  #paneBWrap .paneHead b{color:var(--curB);}
  #scrollArea,#scrollAreaB{
    flex:1; overflow:auto; outline:none; background:var(--panel);
    font-family:Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace; font-size:13px;
  }
  #spacer,#spacerB{position:relative; width:max-content; min-width:100%; padding:6px 0;}
  .hrow{
    position:absolute; left:0; height:22px; line-height:22px;
    display:flex; align-items:center; white-space:pre; padding:0 14px;
    width:max-content; min-width:100%;   /* Wide content widens the row so it scrolls horizontally, and flex must not shrink it */
  }
  .hrow.alt{background:var(--row-alt);}
  .off{
    color:var(--muted); background:var(--off-bg); border-radius:4px; flex:0 0 auto;
    padding:0 8px; margin-right:12px; user-select:none; min-width:78px; text-align:center;
  }
  .hrow.currow .off{background:var(--accent-soft); color:var(--accent); font-weight:600;}
  #paneBWrap .hrow.currow .off{background:var(--tint-a); color:var(--curB);}
  .hexc{width:26px; flex:0 0 26px; text-align:center; border-radius:3px; cursor:text; display:inline-block;}
  .hexc.gap{margin-left:10px;}
  .hexc.empty{color:transparent; cursor:default;}
  .hexc.sel{background:var(--sel);}
  .hexc.diff{background:var(--diffbg); color:var(--difftx);}
  .hexc.cur{background:var(--accent); color:#fff !important;}
  .hexc.curB{background:var(--curB); color:#fff !important;}
  /* Same offset, mirrored into the other pane. The cursor is filled, the selection is drawn as
     a ring around every byte (adjacent cells share their edges, so a range reads as one band).
     Neither touches the text colour, so a diff-tinted byte keeps its red / green */
  .hexc.mir{box-shadow:inset 0 0 0 1px var(--mir); background:var(--mirbg);}
  .hexc.mirsel{box-shadow:inset 0 -2px 0 var(--mir), inset 0 2px 0 var(--mir);}
  .asc{
    margin-left:16px; flex:0 0 auto; color:var(--asc-fg); border-left:1px solid var(--line);
    padding-left:12px; letter-spacing:1.5px;
  }
  /* Address header (HxD style: Address | 0..F | Dump), exactly the same width as the data rows */
  .colhead{
    flex:none; overflow:hidden; border-bottom:1px solid var(--line); background:var(--head-bg);
    font-family:Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace; font-size:13px;
    color:var(--colhead-fg, var(--muted)); user-select:none;
  }
  .colheadIn{display:flex; align-items:center; white-space:pre; padding:0 14px; height:22px; line-height:22px; width:max-content; min-width:100%;}
  .colhead .choff{min-width:78px; flex:0 0 auto; padding:0 8px; margin-right:12px; text-align:center; font-weight:600;}
  .colhead .chc{width:26px; flex:0 0 26px; text-align:center; display:inline-block;}
  .colhead .chc.gap{margin-left:10px;}
  .colhead .chasc{margin-left:16px; flex:0 0 auto; border-left:1px solid var(--line); padding-left:12px; letter-spacing:1.5px; font-weight:600;}

  .asc .ac.sel{background:var(--sel);}
  .asc .ac.diff{background:var(--diffbg); color:var(--difftx);}
  .asc .ac.cur{background:var(--accent); color:#fff;}
  .asc .ac.curB{background:var(--curB); color:#fff;}
  .asc .ac.mir{box-shadow:inset 0 0 0 1px var(--mir); background:var(--mirbg);}
  .asc .ac.mirsel{box-shadow:inset 0 -2px 0 var(--mir), inset 0 2px 0 var(--mir);}

  /* ===== Diff panel ===== */
  /* Drag the splitter up or down to resize the diff panel; double-click restores the default height */
  #diffSplit{
    display:none; flex:none; height:9px; cursor:ns-resize; align-items:center; justify-content:center;
    background:var(--group-bg); border-top:1px solid var(--line); position:relative; touch-action:none;
  }
  #diffSplit.show{display:flex;}
  #diffSplit::after{
    content:""; width:84px; height:4px; border-radius:2px; background:var(--grip);
    box-shadow:0 0 0 1px rgba(0,0,0,.06);
    transition:background .12s, width .12s;
  }
  #diffSplit:hover::after, #diffSplit.dragging::after{background:var(--split-hi); width:112px;}
  #diffSplit.dragging{background:var(--row-alt);}
  #diffPanel{
    background:var(--panel); border-top:2px solid var(--split);
    display:none; flex-direction:column; max-height:220px; flex:none; position:relative;
  }
  #diffPanel.show{display:flex;}
  /* Title bar matches the Text Comparer: a centred title and a close button on the right
     (the size / diff-count text that used to sit next to the title is gone) */
  #diffPanel .dhead{
    padding:5px 10px; display:flex; align-items:center; justify-content:center; gap:8px;
    border-bottom:1px solid var(--line); background:var(--head-bg); flex:none;
    position:relative; min-height:30px;
  }
  #diffPanel .dhead b{color:var(--text);}
  #diffPanel .dhead button{height:23px; padding:0 8px; font-size:11.5px; flex:none;}
  #diffPanel .dright{position:absolute; right:10px; top:50%; transform:translateY(-50%);
    display:flex; align-items:center; gap:6px;}
  #diffList{position:relative; overflow:auto; font-family:Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace; font-size:12.5px;}
  /* Header like the Text Comparer: offset range | bytes | A file | B file, sticky so the
     column names stay visible while scrolling (the list used to start straight at the data) */
  /* Column widths: the first three are fixed; A and B split the rest by --ga : --gb, an even half by default */
  #diffPanel{--c-range:222px; --c-cnt:84px; --c-idx:30px; --ga:1; --gb:1;}
  /* Header and rows: font, size, colour and padding copied from the Text Comparer list
     (this list used to be 11.5px monospace while the UI font was 11px, and it showed) */
  #diffPanel .dcols{
    position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:8px;
    padding:0 8px; height:22px; background:var(--head-bg); border-bottom:1px solid var(--line);
    color:var(--muted); font-size:11px; letter-spacing:.3px; white-space:nowrap;
    font-family:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif;
  }
  #diffPanel .dcols .h-r{flex:0 0 var(--c-range); min-width:0; text-align:center;
    overflow:hidden; text-overflow:ellipsis;}
  #diffPanel .dcols .h-cnt{flex:0 0 var(--c-cnt); text-align:center;}
  #diffPanel .dcols .h-idx{flex:0 0 var(--c-idx); text-align:center;}
  #diffPanel .dcols .h-pv{flex:1 1 0; min-width:0; display:flex; align-items:center;
    justify-content:center; gap:5px; overflow:hidden;}
  #diffPanel .dcols .h-pv .hn{min-width:0; overflow:hidden; text-overflow:ellipsis;}
  #diffPanel .dcols .h-pv.a{color:var(--dl-a-fg); flex-grow:var(--ga,1);}
  #diffPanel .dcols .h-pv.b{color:var(--dl-b-fg); flex-grow:var(--gb,1);}
  .drow{
    padding:0 8px; min-height:22px; display:flex; gap:8px; cursor:pointer;
    border-bottom:1px solid var(--line2); align-items:center;
  }
  .drow:hover{background-color:var(--row-alt);}
  /* Every ◀ / ▶ step marks its row in the list, as the Text Comparer does.
     The A and B cells paint their own tinted background, so a plain row background
     was invisible — the outline is what actually shows up. */
  .drow.cur{background-color:var(--accent-soft);
    box-shadow:inset 3px 0 0 var(--accent), inset 0 0 0 1px var(--accent);}
  .drow.cur .r{color:var(--accent);}
  /* Everything is centred per column: the header already was, the rows were left-aligned and did not line up */
  .drow .r{flex:0 0 var(--c-range); min-width:0; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; color:var(--text); font-weight:600; text-align:center;}
  .drow .cnt{flex:0 0 var(--c-cnt); color:var(--muted); white-space:nowrap; text-align:center;}
  /* Row number in front of the offset range, matching the Text Comparer's list */
  .drow .idx{flex:0 0 var(--c-idx); text-align:center; white-space:nowrap;
    color:var(--muted); font-weight:400; font-variant-numeric:tabular-nums; opacity:.8;}
  .drow.cur .idx{color:var(--accent); opacity:1; font-weight:600;}
  /* The A and B cells tint their whole cell pale red / green, not just the text behind the bytes */
  .drow .pv{flex:1 1 0; min-width:0; display:flex; align-items:center; justify-content:center;
    gap:6px; height:18px; padding:0 6px; border-radius:4px; overflow:hidden;}
  .drow .pv.a{flex-grow:var(--ga,1); background:var(--dl-a-bg); color:var(--dl-a-fg);}
  .drow .pv.b{flex-grow:var(--gb,1); background:var(--dl-b-bg); color:var(--dl-b-fg);}
  /* Byte string: the full 16 bytes (0~F) centred when there is room, shrinking both sides with an ellipsis when there is not */
  .drow .pv .tx{flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis;
    white-space:pre; text-align:center; color:inherit; background:none;}
  /* Column separators: four vertical lines at # | offset | bytes | A | B, positioned by
     placeDiffSeps() through --dx0/1/2/3. They are painted as backgrounds, so layout and
     row height do not matter and header plus rows form one continuous line. */
  #diffPanel .dcols, #diffPanel .drow{
    background-image:
      linear-gradient(var(--line), var(--line)),
      linear-gradient(var(--line), var(--line)),
      linear-gradient(var(--line), var(--line)),
      linear-gradient(var(--line), var(--line));
    background-repeat:no-repeat;
    background-size:1px 100%;
    background-position:var(--dx0,-99px) 0, var(--dx1,-99px) 0, var(--dx2,-99px) 0, var(--dx3,-99px) 0;
    background-origin:border-box;
  }
  /* All four lines drag left and right; the grip sits on the line at full height:
     0 = # | offset, 1 = offset | bytes, 2 = bytes | A, 3 = A | B */
  #diffSeps{position:absolute; top:0; bottom:0; left:0; width:0; z-index:4; pointer-events:none;}
  #diffSeps .cgrip{position:absolute; top:0; bottom:0; width:11px; margin-left:-5px;
    cursor:col-resize; pointer-events:auto; touch-action:none;}
  #diffSeps .cgrip::after{content:""; position:absolute; left:5px; top:0; bottom:0; width:1px;
    background:transparent; transition:background .12s, width .12s;}
  #diffSeps .cgrip:hover::after, #diffSeps .cgrip.on::after{background:var(--accent); width:2px; left:4px;}

  /* ===== Status bar ===== */

  /* ===== Drop overlay ===== */
  #dropHint{
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(15,23,42,.58); z-index:40; pointer-events:none;
    box-shadow:inset 0 0 0 4px rgba(37,99,235,.75);
  }
  #dropHint.show{display:flex;}
  #dropHint .dh-card{
    background:var(--card-bg); border:2px solid var(--accent); border-radius:16px;
    padding:22px 36px 20px; min-width:360px; text-align:center;
    box-shadow:0 22px 60px rgba(0,0,0,.45);
    animation:dhIn .16s ease-out;
  }
  @keyframes dhIn{from{transform:scale(.94); opacity:0;} to{transform:scale(1); opacity:1;}}
  #dropHint .dh-ico{color:var(--accent); line-height:0; margin-bottom:10px;}
  #dropHint .dh-row1{
    display:flex; align-items:center; justify-content:center; gap:7px;
    font-size:21px; font-weight:800; color:var(--card-fg); letter-spacing:.2px;
  }
  #dropHint .dh-badge{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:26px; height:26px; padding:0 6px; border-radius:7px;
    background:var(--accent); color:#fff; font:800 15px/1 Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace;
    box-shadow:0 2px 0 rgba(37,99,235,.35);
  }
  #dropHint .dh-plus{color:var(--muted); font-weight:700;}
  #dropHint .dh-row2{
    display:flex; align-items:center; justify-content:center; gap:6px;
    margin-top:12px; padding-top:11px; border-top:1px dashed var(--dash);
    font-size:14px; color:var(--card-sub);
  }
  #dropHint kbd{
    display:inline-block; padding:1px 7px; border-radius:5px;
    background:var(--kbd-bg); border:1px solid var(--kbd-line); border-bottom-width:2px;
    font-family:Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace; font-size:12.5px; font-weight:700; color:var(--card-fg);
  }
  #dropHint .dh-row2 .dh-badge{
    min-width:20px; height:20px; padding:0 5px; border-radius:5px;
    font-size:12.5px; box-shadow:none;
  }

  /* ===== Dialogs ===== */
  .mask{
    position:fixed; inset:0; background:rgba(15,20,35,.45);
    display:none; align-items:center; justify-content:center; z-index:50;
  }
  .mask.show{display:flex;}
  .dlg{
    background:var(--panel); border-radius:12px; padding:18px 20px;
    width:min(720px, 94vw); box-shadow:0 12px 40px rgba(0,0,0,.18);
    max-height:90vh; overflow:auto;
  }
  .dlg h3{margin:0 0 8px; font-size:15px;}
  .dlg p{margin:4px 0 10px; color:var(--muted); font-size:12.5px; line-height:1.6;}
  .dlg textarea{
    width:100%; height:170px; font:12px Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace; color:var(--text);
    border:1px solid var(--line); border-radius:8px; padding:8px; resize:vertical;
  }
  .dlg .btns{margin-top:10px; display:flex; gap:8px; justify-content:flex-end; align-items:center;}
  .dlg .radio-row{display:flex; gap:14px; margin:6px 0 10px; color:var(--text); flex-wrap:wrap;}
  .dlg .radio-row label{display:inline-flex; gap:5px; align-items:center; cursor:pointer;}

  /* ===== The always-present pane toolbar (one per pane) ===== */
  .paneEntry{
    flex:none; display:flex; align-items:center; gap:5px; flex-wrap:wrap;
    padding:6px 8px; border-bottom:1px solid var(--line); background:var(--soft-a);
  }
  #paneBWrap .paneEntry{background:var(--soft-b);}
  .paneEntry .cap2{
    flex:0 0 auto; font-size:11px; font-weight:700; color:#fff; background:var(--accent);
    border-radius:4px; padding:3px 6px; letter-spacing:.3px; white-space:nowrap;
  }
  #paneBWrap .paneEntry .cap2{background:var(--curB);}
  .paneEntry input{
    flex:1 1 auto; min-width:70px; height:27px; font:12.5px Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace;
    border:1.5px solid var(--soft-line-a); border-radius:6px; padding:2px 8px; background:var(--input-bg);
  }
  #paneBWrap .paneEntry input{border-color:var(--soft-line-b);}
  .paneEntry input:focus{outline:none; border-color:var(--accent);}
  #paneBWrap .paneEntry input:focus{border-color:var(--curB);}
  .paneEntry input::placeholder{font-size:11px; color:var(--muted);}
  .paneEntry button{height:27px; padding:0 7px; font-size:11.5px; flex:0 0 auto; white-space:nowrap; display:inline-flex; align-items:center; gap:4px;}
  .paneEntry button:disabled{opacity:.4; cursor:not-allowed;}
  .paneEntry .sep{flex:0 0 auto; width:1px; height:16px; background:var(--line2); margin:0 4px;}
  /* "Open" no longer gets the A blue / B purple background — it matches the rest of the row, like the Text Comparer */
  .paneEntry button.w{font-weight:600;}
  @media (max-width:1180px){
    .paneEntry{gap:4px; padding:6px 6px;}
    .paneEntry button{padding:0 5px; font-size:11px;}
    .paneEntry .cap2{display:none;}
  }
  /* An empty signature must not leave a bare pill behind */
  .sig:empty{display:none;}
  .sig{
    flex:0 0 auto; font:11px Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace; color:var(--accent);
    background:var(--accent-soft); border:1px solid var(--soft-line-a); border-radius:4px; padding:1px 6px;
    max-width:min(64%, 400px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  #paneBWrap .sig{color:var(--curB); background:var(--tint-a); border-color:var(--soft-line-b);}
  .relchip{font-weight:700; border-radius:4px; padding:1px 8px; font-size:11.5px;}
  .relchip.same{color:var(--same-fg); background:var(--same-bg); border:1px solid var(--same-line);}
  .relchip.diff{color:var(--diff2-fg); background:var(--diff2-bg); border:1px solid var(--diff2-line);}

  /* ===== Import dialog: two independent columns ===== */
  .dlg.wide{width:min(1000px, 96vw);}
  .impGrid{display:flex; gap:14px; align-items:stretch;}
  .impCol{flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:6px;
    border:1.5px solid var(--soft-line-a); border-radius:10px; padding:10px; background:var(--soft-a);}
  .impCol.b{border-color:var(--soft-line-b); background:var(--soft-b);}
  .impCol .ch{display:flex; align-items:center; gap:8px; font-weight:700; font-size:12.5px;}
  .impCol .ch .bdg{color:#fff; background:var(--accent); border-radius:4px; padding:1px 7px; font-size:11px;}
  .impCol.b .ch .bdg{background:var(--curB);}
  .impCol .ch .len{color:var(--muted); font:11px Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace; font-weight:400;}
  .impCol textarea{
    width:100%; height:132px; font:12px Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace; color:var(--text);
    border:1px solid var(--line); border-radius:8px; padding:8px; resize:vertical;
  }
  .impCol .row{display:flex; gap:6px;}
  .impCol .row button{flex:1 1 0; min-width:0; height:26px; font-size:12px; padding:0 6px;}
  .impErr{min-height:16px; font-size:11.5px; color:var(--danger); font-weight:600;}

  #status{
    background:var(--panel); border-top:1px solid var(--line);
    padding:6px 14px; font-size:12px; color:var(--muted);
    font-family:Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace; display:flex; gap:18px; flex-wrap:wrap; align-items:center;
  }
  #status b{color:var(--text); font-weight:600;}
  #status .flash{font-weight:600;}
  #status .flash.ok{color:var(--accent);}
  #status .flash.err{color:var(--danger);}

  /* ===== Toasts at the top, easier to notice than the status bar ===== */
  #toastWrap{
    position:fixed; top:12px; left:50%; transform:translateX(-50%);
    z-index:80; display:flex; flex-direction:column; gap:8px; align-items:center;
    pointer-events:none; max-width:92vw;
  }
  .toast{
    display:flex; align-items:center; gap:8px;
    background:#0f172a; color:#fff; border-radius:8px; padding:8px 16px 8px 12px;
    font-size:13px; line-height:1.5; box-shadow:0 8px 26px rgba(0,0,0,.28);
    max-width:min(92vw, 560px); animation:toastIn .16s ease-out;
  }
  /* A round icon on the left: tick = success, bang = error, i = info, same as the Text Comparer toasts */
  .toast .ic{flex:0 0 auto; width:17px; height:17px; border-radius:50%; background:rgba(255,255,255,.22);
    display:flex; align-items:center; justify-content:center; font:700 11.5px/1 "Segoe UI",Arial,sans-serif;}
  .toast .tx{min-width:0;}
  .toast.ok{background:#1d4ed8;}
  .toast.err{background:#dc2626;}
  @keyframes toastIn{from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:none;}}

  /* ===== Hex area context menu ===== */
  .ctxMenu{
    position:fixed; left:0; top:0; z-index:90; display:none;
    min-width:172px; padding:5px;
    background:var(--panel); border:1px solid var(--line); border-radius:9px;
    box-shadow:0 10px 30px rgba(15,23,42,.22), 0 2px 6px rgba(15,23,42,.08);
  }
  .ctxMenu.show{display:block; animation:ctxIn .1s ease-out;}
  @keyframes ctxIn{from{opacity:0; transform:scale(.97);} to{opacity:1; transform:none;}}
  .ctxMenu .ctxHead{display:flex; align-items:center; gap:6px; padding:3px 8px 6px; font-size:11px; color:var(--muted);}
  .ctxMenu .ctxHead .b{
    background:var(--accent); color:#fff; border-radius:4px;
    padding:1px 6px; font-weight:700; letter-spacing:.3px;
  }
  .ctxMenu .ctxHead.parB .b{background:var(--curB);}
  .ctxMenu button{
    display:flex; align-items:center; gap:9px; width:100%; height:30px; padding:0 10px;
    border:1px solid transparent; background:transparent; border-radius:6px;
    font-size:12.5px; color:var(--text); text-align:left; cursor:pointer; white-space:nowrap;
  }
  .ctxMenu button:hover:not(:disabled){background:var(--accent-soft); color:var(--accent); border-color:var(--soft-line-a);}
  .ctxMenu button.danger:hover:not(:disabled){background:var(--danger-bg); color:var(--danger); border-color:rgba(220,38,38,.45);}
  .ctxMenu button:disabled{opacity:.35; cursor:default;}
  .ctxMenu .sep{display:block; height:1px; margin:4px 6px; background:var(--line2);}

  /* ===== VS Code theming: every colour is a variable, so the webview follows the editor theme ===== */
  :root{
    --bg:var(--vscode-editorWidget-background,#eef0f4);
    --panel:var(--vscode-editor-background,#ffffff);
    --line:var(--vscode-panel-border,#dfe2e9);
    --line2:var(--vscode-editorWidget-border,#eceef3);
    --text:var(--vscode-editor-foreground,#1f2430);
    --muted:var(--vscode-descriptionForeground,#8a90a0);
    --accent:var(--vscode-button-background,#2563eb);
    --accent-soft:var(--vscode-list-hoverBackground,#eef2ff);
    --sel:var(--vscode-editor-selectionBackground,#bfdbfe);
    --row-alt:var(--vscode-editor-lineHighlightBackground,#fafbfd);
    --danger:var(--vscode-errorForeground,#dc2626);
    --diffbg:#fecaca; --difftx:#b91c1c;
    /* A / B identity colours, same pair the Text Comparer uses: A blue, B purple */
    --curA:#2563eb; --curB:#7c3aed;
    --input-bg:#fff; --input-bg-ro:#f4f5f9; --btn-active:#dbe6ff;
    --group-bg:#fcfcfe; --head-bg:#f7f8fb; --off-bg:#f2f3f7; --asc-fg:#4b5563;
    --card-bg:#fff; --card-fg:#0f172a; --card-sub:#475569;
    --kbd-bg:#eef2f8; --kbd-line:var(--kbd-line); --dash:#dbe3ee;
    --soft-a:#fafcff; --soft-b:#fbf9ff; --soft-line-a:var(--soft-line-a); --soft-line-b:var(--soft-line-b);
    --tint-a:#f3efff; --diff-a-bg:#fff5f5; --diff-b-bg:#f2fdf2; --ok-fg:#166534;
    /* Background and text colour of the A / B cells in the diff list, aligned with the Text Comparer's --del-bg / --ins-bg */
    --dl-a-bg:rgba(220,38,38,.09); --dl-a-fg:#b91c1c;
    --dl-b-bg:rgba(22,163,74,.11); --dl-b-fg:#15803d;
    /* A=B / A≠B badge: green when identical, red when not (--same-* green, --diff2-* red) */
    --same-fg:#047857; --same-bg:#ecfdf5; --same-line:#6ee7b7;
    --diff2-fg:#b91c1c; --diff2-bg:#fef2f2; --diff2-line:#fca5a5;
    --danger-bg:#fef2f2;
    --gutbar:#dc2626;
    --grip:#9aa3b2;
    --split:#c9d0dc; --split-hi:#8b94a3;
    --tint-a-head:#e9f0ff; --tint-b-head:#f4f0ff;
  }
  /* Dark themes: VS Code adds vscode-dark / vscode-high-contrast to the body */
  body.vscode-dark, body.vscode-high-contrast{
    /* Background and text colours are also given fallbacks, identical to the Text Comparer's
     dark block, so light text never lands on a light background when the theme
     variables are missing. */
    --bg:var(--vscode-editorWidget-background,#1e1e1e);
    --panel:var(--vscode-editor-background,#1e1e1e);
    --line:var(--vscode-panel-border,#3c3c3c);
    --line2:var(--vscode-editorWidget-border,#343434);
    --text:var(--vscode-editor-foreground,#e6e6e6);
    --muted:var(--vscode-descriptionForeground,#a3a3a3);
    --accent:var(--vscode-button-background,#3b82f6);
    --accent-hover:#2563eb;
    --accent-soft:rgba(59,130,246,.18);
    --danger:var(--vscode-errorForeground,#ef4444);
    --sel:rgba(37,99,235,.34);
    --colhead-fg:rgba(255,255,255,.82);
    --grip:rgba(255,255,255,.46);
    --split:#3f3f3f; --split-hi:rgba(255,255,255,.72);
    --tint-a-head:rgba(37,99,235,.22); --tint-b-head:rgba(167,139,250,.20);
    --row-alt:rgba(255,255,255,.045);
    --diffbg:rgba(248,113,113,.28); --difftx:#fca5a5; --curA:#3b82f6; --curB:#a78bfa;
    --mirAbg:rgba(96,165,250,.24);
    --mirBbg:rgba(167,139,250,.26);
    --input-bg:var(--vscode-input-background,#3c3c3c); --input-bg-ro:rgba(255,255,255,.06);
    --btn-active:rgba(37,99,235,.35);
    --group-bg:var(--vscode-editorWidget-background,#252526);
    --head-bg:var(--vscode-sideBar-background,#252526);
    --off-bg:rgba(255,255,255,.07); --asc-fg:var(--vscode-editor-foreground,#d4d4d4);
    --card-bg:var(--vscode-editorWidget-background,#252526);
    --card-fg:var(--vscode-editor-foreground,#e6e6e6);
    --card-sub:var(--vscode-descriptionForeground,#a3a3a3);
    --kbd-bg:rgba(255,255,255,.09); --kbd-line:rgba(255,255,255,.20); --dash:rgba(255,255,255,.16);
    --soft-a:rgba(255,255,255,.045); --soft-b:rgba(167,139,250,.10);
    --soft-line-a:rgba(37,99,235,.45); --soft-line-b:rgba(167,139,250,.45);
    --tint-a:rgba(167,139,250,.14);
    --diff-a-bg:rgba(248,113,113,.14); --diff-b-bg:rgba(52,211,153,.14); --ok-fg:#6ee7b7;
    --dl-a-bg:rgba(248,81,73,.13); --dl-a-fg:#f48771;
    --dl-b-bg:rgba(63,185,80,.13); --dl-b-fg:#7ee787;
    --same-fg:#6ee7b7; --same-bg:rgba(110,231,183,.12); --same-line:rgba(110,231,183,.42);
    --diff2-fg:#fca5a5; --diff2-bg:rgba(252,165,165,.13); --diff2-line:rgba(252,165,165,.42);
    --danger-bg:rgba(220,38,38,.16);
    --gutbar:#ef4444;
  }
  .dlg textarea, .impCol textarea{background:var(--input-bg);}
  /* Scrollbars follow the theme too */

function t(key, vars){
  let s = (I18N[lang] && I18N[lang][key]) || I18N.zh[key] || key;
  if(vars) for(const k in vars) s = s.split("{" + k + "}").join(vars[k]);
  return s;
}
function applyLang(){
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-html]").forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll("[data-i18n-title]").forEach(el => el.title = t(el.dataset.i18nTitle));
  $("btnLang").textContent = lang === "zh" ? "EN" : "中文";
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  $("stMode").textContent = t(insModeOn ? "insertM" : "overwrite");
  $("stMode").title = t("insModeTip");
  updatePh();                                        // Placeholders follow both the language and HEX/DEC
  if($("aboutMask").classList.contains("show")) renderAbout();

}

/* ================= Number base ================= */
let numBase = 16;
try{ numBase = parseInt(localStorage.getItem("hxBase")) === 10 ? 10 : 16; }catch(e){}
function offsetWidth(){
  const n = Math.max(P.A.buf.length, P.B.buf ? P.B.buf.length : 0, 1);
  return numBase === 16 ? 8 : String(n).length;
}
function fmtOff(n){
  return numBase === 16
    ? "0x" + n.toString(16).toUpperCase().padStart(8, "0")
    : String(n);
}
/* Number parsing: decimal by default; a 0x prefix (or $ prefix / h suffix) means hex.
     Examples: 100 → 100 decimal; 0x100 / 100h / $100 → 256 */
function parseAny(s){
  s = (s || "").trim().replace(/[\s_,]/g, "");
  if(!s) return null;
  let m;
  if((m = /^0x([0-9a-f]+)$/i.exec(s))) return parseInt(m[1], 16);
  if((m = /^\$([0-9a-f]+)$/i.exec(s))) return parseInt(m[1], 16);
  if((m = /^([0-9a-f]+)h$/i.exec(s))) return parseInt(m[1], 16);   // 100h / FFh
  if(/^[0-9]+$/.test(s)) return parseInt(s, 10);                   // Digits only = decimal
  if((m = /^[0-9a-f]+$/i.exec(s))) return parseInt(m[1] || s, 16);  // Anything with a letter (FF) is read as hex
  return null;
}
/* Single-byte parsing for the fill value: 0xFF, FFh, FF and 255 all work */
function parseByte(s){
  s = (s || "").trim().replace(/[\s_,]/g, "");
  if(!s) return null;
  let m, v;
  if((m = /^0x([0-9a-f]{1,4})$/i.exec(s))) v = parseInt(m[1], 16);
  else if((m = /^\$([0-9a-f]{1,4})$/i.exec(s))) v = parseInt(m[1], 16);
  else if((m = /^([0-9a-f]{1,4})h$/i.exec(s))) v = parseInt(m[1], 16);
  else if(/^[0-9]{1,3}$/.test(s)) v = parseInt(s, 10);          // Digits only = decimal (11 → 11)
  else if(/^[0-9a-f]{1,2}$/i.test(s)) v = parseInt(s, 16);      // Letters mean hex (FF → 255)
  else return null;
  if(isNaN(v)) return null;
  return Math.max(0, Math.min(255, v));
}
function updateBaseBtn(){
  $("btnBase").textContent = numBase === 16 ? "HEX" : "DEC";
  $("btnBase").classList.toggle("on", numBase === 16);

/* Lenient hex text parsing.
     - space, comma, newline, 0x prefix, colon and dash all act as separators
     - with separators, each token is one byte, left-padded to two digits ("1 2 3" → 01 02 03)
     - without separators, bytes are taken two at a time and a lone nibble is
       right-padded ("123" → 12 30)
     - an odd number of digits is no longer an error */
function parseHex(str){
  const s = (str || "").trim();
  if(!s) return new Uint8Array(0);
  const cleaned = s.replace(/0x/gi, " ");
  let toks = cleaned.split(/[\s,;:_\-|.]+/).filter(Boolean);
  if(!toks.length) return new Uint8Array(0);
  const out = [];
  if(toks.length === 1){
    const one = toks[0];
    if(!/^[0-9a-fA-F]+$/.test(one)) throw t("msgNoHex");
    const parts = one.match(/.{1,2}/g) || [];
    for(let i = 0; i < parts.length; i++){
      const p = parts[i].length === 1 ? parts[i] + "0" : parts[i];   // The lone nibble is padded on the right
      out.push(parseInt(p, 16));
    }
    return new Uint8Array(out);
  }
  for(const tk of toks){
    if(!/^[0-9a-fA-F]+$/.test(tk)) throw t("msgNoHex");
    if(tk.length <= 2){
      out.push(parseInt(tk.padStart(2, "0"), 16));                   // A single token is padded on the left
    } else {
      const parts = tk.match(/.{1,2}/g) || [];
      for(const p of parts) out.push(parseInt(p.length === 1 ? p + "0" : p, 16));
    }
  }
  return new Uint8Array(out);
}
/* Byte-string parsing for search: hex in HEX mode, decimal in DEC mode (0x.. or tokens with A-F are still read as hex) */
function parsePattern(str){
  const s = (str || "").trim();
  if(!s) return new Uint8Array(0);
  if(numBase !== 10) return parseHex(s);
  const toks = s.split(/[\s,;:_\-|.]+/).filter(Boolean);
  if(!toks.length) return new Uint8Array(0);
  const out = [];
  for(const tk of toks){
    let v;
    if(/^0x[0-9a-f]+$/i.test(tk)) v = parseInt(tk.slice(2), 16);
    else if(/[a-f]/i.test(tk)){                       // Letters → still hex (EB / AA55)
      if(!/^[0-9a-f]+$/i.test(tk)) throw t("msgNoHex");
      const parts = tk.length <= 2 ? [tk.padStart(2, "0")] : (tk.match(/.{1,2}/g) || []);
      for(const p of parts) out.push(parseInt(p.length === 1 ? p + "0" : p, 16));
      continue;
    }
    else if(/^\d+$/.test(tk)){
      const dec = parseInt(tk, 10);
      if(dec <= 255) v = dec;                        // Plain decimal: 235 → 0xEB
      else if(tk.length % 2 === 0){                  // Out of range with an even digit count → read as a hex run: 112233 → 11 22 33
        for(const p of (tk.match(/.{2}/g) || [])) out.push(parseInt(p, 16));
        continue;
      }
      else v = dec;                                  // Let the range check below report it
    }
    else throw t("msgBadByte", {v: tk});
    if(isNaN(v) || v < 0 || v > 255) throw t("msgBadByte", {v: tk});
    out.push(v);
  }
  return new Uint8Array(out);
}

  commitPending();

  P.A = b; P.B = a;

  diffDirty = false;

  if(!B || !B.length) return;
  if(A.length + B.length > 16 * 1024 * 1024) return;   // Too large: skip the highlighting rather than stall
  const n = Math.max(A.length, B.length);
  let i = 0;
  while(i < n){
    const a = i < A.length ? A[i] : NaN;
    const b = i < B.length ? B[i] : NaN;
    if(a === b){ i++; continue; }
    const s = i;
    while(i < n){

      const y = i < B.length ? B[i] : NaN;

    if(a === b){ i++; continue; }

    }, 0);

  $("sigA").textContent = A.buf && A.buf.length ? fmtSize(A.buf.length) : "";
  $("sigB").textContent = B.buf && B.buf.length ? fmtSize(B.buf.length) : "";
  /* The header keeps just "which pane + file name"; the size moved to the right-hand signature (bytes only).
   The little "editing" badge is gone: the 2px frame and the caret already show which pane is active.
   The name is tied to the bytes, not to the load history: once a pane holds no bytes (every byte
   deleted, or a 0-byte file opened) the header goes back to "Not loaded" -- a file name over an
   empty body reads as if the file were still there. The name itself survives in the state, so
   Ctrl+Z brings the bytes and the name back together. */
  const hasA = !!(A.buf && A.buf.length), hasB = !!(B.buf && B.buf.length);
  const nmA = hasA ? (nameA || t("notLoaded")) : t("notLoaded");
  const nmB = hasB ? (nameB || t("notLoaded")) : t("notLoaded");
  $("headA").innerHTML = "<b>A</b><span class=\"lbl\">" + t("paneLeft") + "</span>"
    + "<span class=\"dot\">·</span><span class=\"fname\">" + esc(nmA) + "</span>";
  $("headB").innerHTML = "<b>B</b><span class=\"lbl\">" + t("paneRight") + "</span>"
    + "<span class=\"dot\">·</span><span class=\"fname\">" + esc(nmB) + "</span>";
  /* One hint card for the whole editor: it appears as soon as one pane is still empty and
     moves over that pane (or spans both when neither holds any bytes) */
  const anyEmpty = !hasA || !hasB;
  $("emptyMain").classList.toggle("hide", !anyEmpty);
  /* Say why the name vanished: an empty pane that still remembers a file name means the bytes
     were deleted (Ctrl+Z works) rather than that nothing was ever opened */
  const gone = [!hasA && A.hadBytes ? nameA : "", !hasB && B.hadBytes ? nameB : ""].filter(Boolean);
  $("emptyNote").textContent = gone.length ? t("emptyNote", { n: gone.join(" / ") }) : "";
  placeEmptyMain();
  /* Turning dual view on / off re-lays out both panes after this frame, so measure once more */
  if(typeof requestAnimationFrame === "function") requestAnimationFrame(placeEmptyMain);
  /* Live status bar fields: the A/B size items were removed on request, the rest stay */
  const rel = $("stRel");
  if(!B.buf || !B.buf.length || !A.buf.length){ rel.className = ""; rel.textContent = ""; }
  else if(sameAB){ rel.className = "relchip same"; rel.textContent = t("relSame"); }
  else { rel.className = "relchip diff"; rel.textContent = t("relDiff"); }
  $("stActive").textContent = activePane;
  $("stActive").style.color = activePane === "A" ? "var(--curA)" : "var(--curB)";
  $("stCur").textContent = fmtOff(cur().cursor);
  const c0 = cur().cursor;
  const bv = buf => (buf && c0 < buf.length)
    ? "0x" + buf[c0].toString(16).toUpperCase().padStart(2, "0") + " '" + printable(buf[c0]) + "'"
    : "—";
  const other = activePane === "A" ? "B" : "A";
  $("stByte").textContent = activePane + ": " + bv(cur().buf) + " · " + other + ": " + bv(P[other].buf);
  const sel = selRange();
  $("stSel").textContent = sel
    ? fmtOff(sel[0]) + (numBase === 16 ? t("offTo") : t("offToDec")) +
      (numBase === 16 ? sel[1].toString(16).toUpperCase().padStart(8, "0") : sel[1])
      + " (" + (sel[1] - sel[0] + 1) + " " + t("bytes") + ")"
    : "—";
  $("btnUndo").disabled = cur().undo.length === 0;
  $("btnRedo").disabled = cur().redo.length === 0;
  updateGates();
  updateNav();                       // Toolbar: previous / n of N / next / swap / diff-list toggle; plus "Diffs: n / N" in the status bar
  renderGutters();
  /* After every change, quietly report both panes to the host: when the editor is split or the tab is
   dragged to another group the webview reloads, and the new instance refills itself from this snapshot
   (otherwise it comes up blank) */
  if(window.__beSnap) window.__beSnap();
}

/* Buttons that must be dead without content:
   the six per-pane ones other than Open (Save / Clear / Cut / Copy / Paste / Delete),
   Go-to and Find (they act on the active pane, and an empty pane has nowhere to go),
   and Compare (only meaningful once both A and B are loaded) */
function updateGates(){
  ["A", "B"].forEach(p => {
    const has = !!(P[p].buf && P[p].buf.length);
    ["paneSave", "paneClear", "paneCut", "paneCopy", "panePaste", "paneDelete"].forEach(k => {

      srcBtn.disabled = !has;

                          : (P[p].src ? t("paneSaveBackTip") + "\n" + srcLabel(P[p].src) : t("msgNoSrcThenSave"));

function ensureVisible(){
  const area = curArea();
  const top = Math.floor(cursor / BPR) * ROWH, bottom = top + ROWH;
  if(top < area.scrollTop) area.scrollTop = top;
  else if(bottom > area.scrollTop + area.clientHeight)
    area.scrollTop = bottom - area.clientHeight;
  if(dualVisible()){
    const other = area === scrollArea ? scrollAreaB : scrollArea;
    other.scrollTop = area.scrollTop;
    other.scrollLeft = area.scrollLeft;
  }

/* ================= Editing (pane A only) ================= */
function commitPending(){
  if(phase === 1 && pendingOld !== null){
    undoStack.push({start: cursor, oldBytes: new Uint8Array([pendingOld]),
                    newBytes: new Uint8Array([data[cursor]])});
    redoStack.length = 0;
  }
  phase = 0; pendingOld = null;
}
function moveCursor(idx, extend){
  commitPending();
  if(extend){ if(selAnchor === null) selAnchor = cursor; }
  else selAnchor = null;
  cursor = Math.max(0, Math.min(idx, data.length));
  render(); ensureVisible();
}
function typeHexDigit(ch){
  const d = parseInt(ch, 16);
  diffDirty = true;                     // Byte edits bypass doOp, so mark the buffer dirty here by hand
  sameDirty = true;                     // Content changed -> the A = B / A != B chip has to be recomputed
  const insertMode = insModeOn || cursor >= data.length;
  if(phase === 0){
    if(insertMode){
      doOp(cursor, new Uint8Array(0), new Uint8Array([d << 4]));
      pendingOld = null; phase = 1;
    } else {
      pendingOld = data[cursor];
      data[cursor] = (d << 4) | (data[cursor] & 0x0F);
      phase = 1;
    }
  } else {
    const v = (data[cursor] & 0xF0) | d;
    data[cursor] = v;
    if(pendingOld === null){
      const top = undoStack[undoStack.length - 1];
      if(top) top.newBytes = new Uint8Array([v]);
    } else {
      undoStack.push({start: cursor, oldBytes: new Uint8Array([pendingOld]),
                      newBytes: new Uint8Array([v])});
      redoStack.length = 0;
    }
    pendingOld = null; phase = 0;
    cursor = Math.min(cursor + 1, data.length);
    ensureVisible();
  }
  render();
}
function deleteSelection(){
  const sel = selRange();
  if(sel){
    const start = sel[0];
    doOp(start, bytesAt(sel[0], sel[1] - sel[0] + 1), new Uint8Array(0));
    selAnchor = null; cursor = start;
  } else if(cursor < data.length){
    doOp(cursor, bytesAt(cursor, 1), new Uint8Array(0));
  }
  render();
}
function backspace(){
  commitPending();
  if(cursor > 0){ cursor--; deleteSelection(); }
}

/* ================= Mouse (both panes are editable; act on whichever was clicked) ================= */
let dragging = false;
function bindPaneMouse(area, pane){
  area.addEventListener("mousedown", e => {
    if(e.button !== 0) return;              // Leave the right button to contextmenu so the selection is not cleared
    const c = e.target.closest(".hexc");
    setActive(pane);                       // Clicking a pane makes it the edit target
    if(!c){ area.focus(); return; }
    const idx = +c.dataset.idx;
    const buf = P[pane].buf;
    if(!buf || idx >= buf.length) return;
    area.focus();
    dragging = true;
    if(e.shiftKey){ if(selAnchor === null) selAnchor = cursor; }
    else selAnchor = idx;
    cursor = idx;
    commitPending(); render(); e.preventDefault();
  });
  area.addEventListener("mouseover", e => {
    if(!dragging) return;
    const c = e.target.closest(".hexc"); if(!c) return;
    const idx = +c.dataset.idx;
    const buf = P[pane].buf; if(!buf || idx >= buf.length) return;
    if(activePane !== pane) setActive(pane);
    if(idx !== cursor){ cursor = idx; render(); }
  });
  area.addEventListener("focus", () => setActive(pane));
  area.addEventListener("contextmenu", e => {
    e.preventDefault();
    setActive(pane);                        // Right-clicking a pane applies to that pane
    const c = e.target.closest(".hexc");
    if(c){
      const idx = +c.dataset.idx, buf = P[pane].buf;
      if(buf && idx < buf.length){
        const sel = selRange();
        const inside = sel && idx >= sel[0] && idx <= sel[1];
        if(!inside){ commitPending(); selAnchor = idx; cursor = idx; render(); }
      }
    }
    openCtxMenu(pane, e.clientX, e.clientY);
  });
}
bindPaneMouse(scrollArea, "A");
bindPaneMouse(scrollAreaB, "B");
document.addEventListener("mouseup", () => dragging = false);

/* Send this pane's selection (the whole pane when there is none) to the other pane at the same offset:
   move=false copies (source untouched); move=true cuts (the source slice is removed afterwards).
   Target empty -> take it as the content; long enough -> overwrite in place; too short -> pad and extend. */
function rangeToOther(src, move){
  const dst = src === "A" ? "B" : "A";
  const sbuf = P[src].buf;
  if(!sbuf || !sbuf.length){ flash(t("msgPaneEmpty", {p: src}), true); return; }
  const sel = src === activePane ? selRange() : null;
  const from = sel ? sel[0] : 0;
  const n = sel ? sel[1] - from + 1 : sbuf.length;
  const bytes = sbuf.slice(from, from + n);
  if(activePane !== src){ commitPending(); activePane = src; }
  let off = from;
  if(!P[dst].buf || !P[dst].buf.length){          // The other pane is still empty: drop it straight in
    off = 0;
    const st = P[dst];
    st.buf = new Uint8Array(bytes);                // Copy, never share the buffer with the source pane
    st.name = src === "A" ? "from-A.bin" : "from-B.bin";
    st.cursor = 0; st.sel = null; st.phase = 0; st.pend = null;
    st.undo = []; st.redo = [];
    if(dst === "A") nameA = st.name; else { nameB = st.name; dualView = true; }
    clearDiff(); updateBPane(); updateActiveUI();
  }else{
    if(P[dst].buf.length < from + n){             // Target too short: pad with zeros until it fits
      const grown = new Uint8Array(from + n);
      grown.set(P[dst].buf, 0);
      P[dst].buf = grown;
      P[dst].undo = []; P[dst].redo = [];         // The length changed, so old undo records no longer line up -- drop them
    }
    const back = activePane;
    commitPending();
    activePane = dst; updateActiveUI();
    doOp(from, bytesAt(from, n), bytes);          // Overwrite at the same offset, touching only the other pane
    activePane = back; updateActiveUI();
  }
  if(move){                                       // Cut: remove this slice from the source pane
    if(activePane !== src){ activePane = src; updateActiveUI(); }
    commitPending();
    doOp(from, bytesAt(from, n), new Uint8Array(0));
    selAnchor = null;
    cursor = Math.min(from, Math.max(P[src].buf.length - 1, 0));
  }
  render();
  flash(t(move ? "msgMovedTo" : "msgCopiedTo", {from: src, to: dst, off: fmtOff(off), n: n}));
}
document.addEventListener("mousedown", e => { if(!ctxEl.contains(e.target)) closeCtxMenu(); }, true);

/* Clear one pane only */
function clearPane(p){
  const st = P[p];
  if(!st.buf || !st.buf.length) { flash(t("msgPaneCleared", {p: p}), false); return; }
  st.buf = new Uint8Array(0);
  st.src = null;
  st.hadBytes = false;                  // An explicit Clear is not "you deleted the bytes": no undo note
  st.cursor = 0; st.sel = null; st.phase = 0; st.pend = null;
  st.undo = []; st.redo = [];
  if(p === "A") nameA = ""; else nameB = "";
  clearDiff();
  render();
  flash(t("msgPaneCleared", {p: p}));
  /* Report right away instead of waiting for the debounce: a cleared pane must not come back when
     the tab is reopened (if both panes are now empty the saved snapshot is dropped entirely). */
  if(window.__beSnap) window.__beSnap(true);
}

/* ================= Keyboard ================= */
function onKey(e){
  const k = e.key;
  if(/^[0-9a-fA-F]$/.test(k) && !e.ctrlKey && !e.altKey && !e.metaKey){
    typeHexDigit(k); e.preventDefault(); return;
  }
  const sel = selRange();
  const area = curArea();
  switch(k){
    case "ArrowLeft":  moveCursor(cursor - 1, e.shiftKey); break;
    case "ArrowRight": moveCursor(cursor + 1, e.shiftKey); break;
    case "ArrowUp":    moveCursor(cursor - BPR, e.shiftKey); break;
    case "ArrowDown":  moveCursor(cursor + BPR, e.shiftKey); break;
    case "Home":       moveCursor(Math.floor(cursor / BPR) * BPR, e.shiftKey); break;
    case "End":        moveCursor(Math.floor(cursor / BPR) * BPR + BPR - 1, e.shiftKey); break;
    case "PageUp":     moveCursor(cursor - BPR * Math.floor(area.clientHeight / ROWH / 2), e.shiftKey); break;
    case "PageDown":   moveCursor(cursor + BPR * Math.floor(area.clientHeight / ROWH / 2), e.shiftKey); break;
    case "Backspace":  backspace(); break;
    case "Delete":
      if(sel){ const s0 = sel[0]; doOp(s0, bytesAt(s0, sel[1] - s0 + 1), new Uint8Array(0)); selAnchor = null; cursor = s0; render(); }
      else deleteSelection();
      break;
    case "a": case "A":
      if(e.ctrlKey){ commitPending(); selAnchor = 0; cursor = Math.max(data.length - 1, 0); render(); e.preventDefault(); }
      break;
    case "c": case "C":
      if(e.ctrlKey){ copySelectionHex(); e.preventDefault(); }
      break;
    case "x": case "X":
      if(e.ctrlKey){ actCut(); e.preventDefault(); }
      break;
    case "z": case "Z":
      if(e.ctrlKey){ commitPending(); e.shiftKey ? redo() : undo(); e.preventDefault(); }
      break;
    case "y": case "Y":
      if(e.ctrlKey){ commitPending(); redo(); e.preventDefault(); }
      break;
    case "Tab":
      if(dualVisible()){ setActive(activePane === "A" ? "B" : "A"); curArea().focus(); e.preventDefault(); }
      break;
    case "Insert":
      setInsMode(!insModeOn);            // With the bottom status strip gone, Insert toggles insert / overwrite
      break;
    default: return;
  }
  e.preventDefault();
}
scrollArea.addEventListener("keydown", onKey);
scrollAreaB.addEventListener("keydown", onKey);

/* ================= Copy ================= */
function copySelectionHex(){
  const sel = selRange();
  const bytes = sel ? bytesAt(sel[0], sel[1] - sel[0] + 1)
                    : (cursor < data.length ? bytesAt(cursor, 1) : new Uint8Array(0));
  copyText(hexOf(bytes, " "));
  flash(t("msgCopied", {n: bytes.length}));
}

/* ================= File loading ================= */
/* Important: touch only P[p].buf of the target pane, the other pane's object reference stays untouched.
   quiet=true restores a page that came back after a tab switch: no "loaded" toast, the user did not load anything. */
function loadTo(target, buf, name, src, quiet){
  const p = target === "B" ? "B" : "A";
  const st = P[p];
  st.buf = new Uint8Array(buf);          // Copy it, never share memory with the other pane
  st.name = name;
  st.hadBytes = st.buf.length > 0;       // A 0-byte file is "loaded but empty", not "everything deleted"
  st.src = src || null;                  // Source file info: {kind:"path",path} (extension) or {kind:"handle",handle} (browser)
  st.cursor = 0; st.sel = null; st.phase = 0; st.pend = null;
  st.undo = []; st.redo = [];
  st.pairTok = 0;                        // Loaded on its own: do not assume it shares a directory with the other pane
  if(st.buf.length) hadContent = true;   // Also "loaded but empty" counts as a load only when it has bytes
  if(p === "A") nameA = name;
  else { nameB = name; dualView = true; }
  clearDiff();
  activePane = p;                         // Focus follows the pane that was just imported
  updateBPane(); updateActiveUI(); render();
  if(!quiet) flash((p === "A" ? t("msgLoadedA") : t("msgLoadedB")) + name
    + "（" + st.buf.length + " " + t("bytes") + "）→ " + p + " " + t("paneWord")
    + (p === "B" ? t("msgBHint") : ""));
  /* When the host gives no path (dropped from Explorer, or an older host that only returned content),
   locate it quietly in the background by name + size: only a unique hit counts, several namesakes stay untouched */
  const seq = (st.loadSeq = (st.loadSeq || 0) + 1);
  if(!st.src && window.__beLocate && name && /\.[A-Za-z0-9]+$/.test(name)){
    window.__beLocate(name, st.buf.length, false, nearPathOf(p)).then(found => {
      if(st.loadSeq !== seq || st.src || !st.buf || !st.buf.length) return;
      if(adoptLocate(st, found)) updateGates();
    }).catch(() => {});
  }
}

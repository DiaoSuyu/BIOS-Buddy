<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:;">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COM Assistant</title>
<style>
  :root{
    --bg:var(--vscode-editorWidget-background,#eef0f4);
    --panel:var(--vscode-editor-background,#ffffff);
    --line:var(--vscode-panel-border,#dfe2e9);
    --line2:var(--vscode-editorWidget-border,#eceef3);
    --text:var(--vscode-editor-foreground,#1f2430);
    --muted:var(--vscode-descriptionForeground,#8a90a0);
    --accent:var(--vscode-button-background,#2563eb);
    --accent-hover:var(--vscode-button-hoverBackground,#1d4fd7);
    --accent-soft:var(--vscode-list-hoverBackground,#eef2ff);
    --input-bg:var(--vscode-input-background,#fff);
    --input-ro:var(--vscode-input-background,#f4f5f9);
    --group-bg:var(--vscode-editorWidget-background,#fcfcfe);
    --head-bg:var(--vscode-sideBar-background,#f7f8fb);
    --btn-active:#dbe6ff;
    --danger:var(--vscode-errorForeground,#dc2626);
    --danger-bg:#fef2f2;
    --ok:#166534; --ok-bg:#ecfdf5;
    --warn:#b45309; --warn-bg:#fef3c7;
    --tx:#1d4ed8; --tx-bg:#eef2ff;
    --rx:#1f2937;
    --soft-line-a:rgba(37,99,235,.30);
  }
  body.vscode-dark, body.vscode-high-contrast{
    /* Dark fallbacks: use --vscode-* when VS Code injects it, but the page must not render
       light text on a light background when those variables are missing */
    --bg:var(--vscode-editorWidget-background,#1e1e1e);
    --panel:var(--vscode-editor-background,#1e1e1e);
    --line:var(--vscode-panel-border,#3c3c3c);
    --line2:var(--vscode-editorWidget-border,#343434);
    --text:var(--vscode-editor-foreground,#e6e6e6);
    --muted:var(--vscode-descriptionForeground,#a3a3a3);
    --accent:var(--vscode-button-background,#3b82f6);
    --accent-hover:#2563eb;
    --input-bg:var(--vscode-input-background,#3c3c3c);
    --input-ro:rgba(255,255,255,.06);
    --group-bg:var(--vscode-editorWidget-background,#252526);
    --head-bg:var(--vscode-sideBar-background,#252526);
    --btn-active:rgba(37,99,235,.35);
    --accent-soft:rgba(37,99,235,.22);
    --danger-bg:rgba(220,38,38,.16);
    --ok:#6ee7b7; --ok-bg:rgba(52,211,153,.14);
    --warn:#fcd34d; --warn-bg:rgba(252,211,77,.14);
    --tx:#93c5fd; --tx-bg:rgba(37,99,235,.16);
    --rx:var(--vscode-editor-foreground,#d4d4d4);
    --soft-line-a:rgba(37,99,235,.45);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif; font-size:13px;
    display:flex; flex-direction:column; overflow:hidden;
  }
  button, input[type=text], select{
    font:inherit; border:1px solid var(--line); border-radius:6px;
    background:var(--input-bg); color:var(--text); padding:4px 8px; height:28px;
  }
  button{cursor:pointer; white-space:nowrap;}
  button:hover:not(:disabled){background:var(--accent-soft); border-color:var(--accent);}
  button:active:not(:disabled){background:var(--btn-active);}
  button:disabled{opacity:.5; cursor:not-allowed;}
  button.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
  button.primary:hover:not(:disabled){background:var(--accent-hover); border-color:var(--accent-hover);}
  button.danger{color:var(--danger); border-color:var(--line);}
  button.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:600;}
  select{cursor:pointer; padding:2px 4px;}
  select:disabled, input:disabled{opacity:.55; cursor:not-allowed; background:var(--input-ro); color:var(--muted);}

  /* ===== Title bar ===== */
  #titlebar{background:var(--panel); border-bottom:1px solid var(--line); padding:7px 14px; display:flex; align-items:center; gap:10px;}
  #titlebar .brand{font-weight:700; font-size:15px; letter-spacing:.5px; color:var(--accent);}
  /* Written the same way as the Text Comparer title bar (same height, radius, font size and hover effect) */
  #btnAbout{height:22px; padding:0 9px; font-size:11.5px; border-radius:11px; color:var(--muted);}
  #btnAbout:hover{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}
  #titlebar .spacer{flex:1;}
  /* Same centring rule as the other three tools: the label sits dead centre of the box */
  #btnLang{min-width:52px; height:24px; font-weight:600; font-size:12px;
    display:inline-flex; align-items:center; justify-content:center;}
  /* Version badge: font size, padding and radius match .ver in the Text Comparer */
  .ver{font:600 10.5px/1 Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace; color:#fff; background:var(--accent); border-radius:4px; padding:3px 7px;}
  #connPill{display:inline-flex; align-items:center; gap:6px; height:22px; padding:0 10px; border-radius:11px;
    font-size:11.5px; font-weight:600; background:var(--group-bg); border:1px solid var(--line2); color:var(--muted);}
  #connPill.on{background:var(--ok-bg); border-color:var(--ok); color:var(--ok);}
  #connPill .dot{width:7px; height:7px; border-radius:50%; background:var(--muted);}
  #connPill.on .dot{background:var(--ok);}

  /* ===== Toolbar ===== */
  #toolbar{background:var(--panel); border-bottom:1px solid var(--line); padding:12px 14px 10px; display:flex; flex-wrap:wrap; gap:12px; align-items:stretch;}
  .group{position:relative; border:1px solid var(--line2); border-radius:9px; padding:13px 10px 8px;
    background:var(--group-bg); display:flex; gap:6px; align-items:flex-end; flex-wrap:wrap; min-height:61px;
    flex:0 0 auto;}
  /* Controls inside a group must never shrink: shrinking clips their small labels (Parity / Stop / Flow) first */
  .group > .fld, .group > .chk, .group > button, .group > .cap{flex:0 0 auto;}
  .group .cap{position:absolute; top:-8px; left:9px; background:var(--panel); padding:0 5px; font-size:11px; color:var(--muted); letter-spacing:1px;}
  .fld{display:inline-flex; flex-direction:column; gap:3px; align-items:stretch;}
  .fl{font-size:10.5px; color:var(--muted); line-height:1; margin-left:1px; white-space:nowrap;}
  .chk{display:inline-flex; align-items:center; gap:5px; color:var(--muted); user-select:none; height:28px;}
  .chk input{margin:0;}
  input.num{width:104px; font:12.5px Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace;}
  input.num.small{width:72px; font:12.5px Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace;}
  /* Port names (COM3 -- USB-Enhanced-SERIAL CH343 (COM3)) are far wider than a fixed width:
   let the content size it, cap at 420px and fall back to the title tooltip when it still does not fit */
  select#port{min-width:250px; max-width:420px; width:auto; font:12.5px Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace;}
  select.sel{font:12.5px Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace;}
  /* Baud rate: common values in the list, the free-form input only appears for Custom
   (side by side, and only as wide as needed) */
  .combo{display:inline-flex; gap:5px; align-items:center;}
  select#baud{min-width:106px; font:12.5px Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace;}
  input#baudFree{display:none; width:88px; font:12.5px Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace;}
  input#baudFree.show{display:inline-block;}
  .hint{font-size:11px; color:var(--muted); align-self:center;}

  /* ===== Main area ===== */
  #logWrap{flex:1; display:flex; flex-direction:column; min-height:0; background:var(--panel); position:relative;}
  #log{flex:1; overflow:auto; padding:6px 14px 12px; font:12.5px/1.55 Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace; color:var(--rx); white-space:pre;}
  #log.wrap{white-space:pre-wrap; word-break:break-all;}
  /* Of a thousand-odd lines only a few dozen are on screen: let the renderer skip layout and paint for
   the rest -- the most direct fix for "slower and slower over time" (same line count, but an order of
   magnitude less to lay out per frame) */
  #log .ln{min-height:1.55em; content-visibility:auto; contain-intrinsic-size:auto 19px;}
  #log .ln.sys{color:var(--muted);}
  #log .ln.err{color:var(--danger);}
  #log .ln.tx{color:var(--tx);}
  #log .ln .ts{color:var(--muted);}
  #log .ln .ts + .txt{margin-left:0;}
  #log .ln.tx .ts{color:var(--tx); opacity:.7;}
  #log .hexln{white-space:pre; color:var(--rx);}
  #log .hexln .off{color:var(--muted); margin-right:10px;}
  #log .hexln .gut{margin-left:12px; color:var(--muted);}
  #log .cursor{display:inline-block; width:7px; height:14px; background:currentColor; vertical-align:-2px; opacity:.5;}

  /* ===== Find bar (Ctrl+F): sits right under the log header, never covering content ===== */
  #findBar{flex:none; display:none; align-items:center; gap:6px; padding:5px 14px;
    background:var(--head-bg); border-bottom:1px solid var(--line);}
  #findBar.show{display:flex;}
  #findInput{height:26px; width:220px; font:12.5px Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace;}
  #findCount{font:11.5px Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace; color:var(--muted); min-width:56px; text-align:center;}
  #findBar.none #findCount{color:var(--danger);}
  #findBar button{height:26px; min-width:28px; padding:0 7px; font-size:12px; line-height:1;}
  #findBar .ci{font-size:12px; color:var(--muted);}
  /* Match highlight: pale yellow for the set, amber for the current one */
  ::highlight(sc-find){background:rgba(250,204,21,.38);}
  ::highlight(sc-find-cur){background:#f59e0b; color:#111;}

  /* ===== Line numbers: display only, drawn from data-n, never part of the log text (copy / save / find unaffected) ===== */
  /* Column width follows the digit count (--numw is written by the script from the highest line number):
   numbers right-aligned, text left edges always on one vertical line, no jump from 4 to 5 digits */
  #log.nums .ln::before{
    content:attr(data-n); display:inline-block; width:var(--numw,4ch); margin-right:10px;
    text-align:right; color:var(--muted); opacity:.7; user-select:none; -webkit-user-select:none;
    font-variant-numeric:tabular-nums;
  }

  /* ===== Find all: results panel at the bottom (laid out like VS Code search results: line number + snippet) ===== */
  /* Splitter between the log and the results panel: drag to resize, double-click for the default */
  #resSplit{flex:none; display:none; height:9px; margin-bottom:-5px; position:relative; z-index:4;
    cursor:ns-resize; background:transparent;}
  #resSplit.show{display:block;}
  /* Idle it is a small centred bar (clearly draggable); on hover or drag it takes the accent colour */
  #resSplit::after{content:""; position:absolute; left:50%; top:3px; width:46px; height:3px;
    margin-left:-23px; border-radius:2px; background:var(--line);
    transition:background .12s, height .12s;}
  #resSplit:hover::after, #resSplit.drag::after{background:var(--accent);}
  #findRes{flex:none; display:none; flex-direction:column; min-height:90px; max-height:none;
    border-top:1px solid var(--line); background:var(--panel);}
  #findRes.show{display:flex;}
  #findRes .frHead{flex:none; display:flex; align-items:center; gap:8px; padding:5px 14px;
    background:var(--head-bg); border-bottom:1px solid var(--line);
    font:11.5px Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace;
    color:var(--muted);}
  #findRes .frHead b{color:var(--text); font-weight:600;}
  #findRes .frHead .grow{flex:1;}
  #findRes .frHead button{height:23px; min-width:24px; padding:0 7px; font-size:11.5px; line-height:1;}
  #frList{flex:1; overflow:auto; font:12.5px/1.65 Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace;}
  #frList::-webkit-scrollbar{width:12px; height:12px;}
  #frList::-webkit-scrollbar-thumb{background:var(--vscode-scrollbarSlider-background,rgba(120,130,150,.4));
    border:3px solid transparent; background-clip:content-box; border-radius:10px;}
  .frRow{display:flex; gap:10px; padding:1px 14px; cursor:pointer; white-space:pre; overflow:hidden;}
  .frRow:hover{background:var(--accent-soft);}
  .frRow.cur{background:var(--accent-soft); box-shadow:inset 2px 0 0 var(--accent);}
  /* The line-number column width uses the same variable as the log: both digit columns end on one line */
  .frRow .fln{flex:0 0 auto; min-width:var(--numw,4ch); width:auto; text-align:right;
    color:var(--muted); font-variant-numeric:tabular-nums;}
  .frRow .ftx{min-width:0; overflow:hidden; text-overflow:ellipsis; color:var(--text);}
  .frRow mark{background:rgba(250,204,21,.40); color:inherit; border-radius:2px;}
  .frRow.cur mark{background:#f59e0b; color:#111;}
  /* A match that scrolled out of the display buffer: still visible and clickable, but the view cannot
   jump to it any more, so dim it slightly. 0.55 read as "disabled" in dark themes, and it is still a
   real hit -- keep it only a little dimmer than a live one. */
  .frRow.gone .ftx{opacity:.82;}
  .frRow.gone .fln{opacity:.7;}

  /* History view: double-clicking a result that has scrolled out of the buffer rebuilds a read-only
   window from the archive. Clicking the banner at the top returns to the live log. */
  #histBar{
    position:absolute; left:0; right:0; top:0; z-index:22;
    display:flex; align-items:center; gap:10px; padding:4px 12px;
    background:var(--off-bg); border-bottom:1px solid var(--line);
    font-size:11.5px; color:var(--muted); box-shadow:0 2px 8px rgba(0,0,0,.18);
  }
  #histBar .grow{flex:1;}
  #histBar button{height:22px; padding:0 9px; font-size:11.5px; border-radius:5px;}
  #log .ln.histTarget{background:var(--accent-soft); box-shadow:inset 2px 0 0 var(--accent);}

  /* ===== Context menu: drawn in-house so it follows the language setting (the built-in one follows the editor language and cannot be changed) ===== */
  #ctxMenu{position:fixed; left:0; top:0; z-index:90; display:none; min-width:198px; padding:5px;
    background:var(--panel); border:1px solid var(--line); border-radius:9px;
    box-shadow:0 14px 34px rgba(15,23,42,.30);}
  #ctxMenu.show{display:block;}
  #ctxMenu button{display:flex; align-items:center; gap:9px; width:100%; height:29px; padding:0 9px;
    background:transparent; border:1px solid transparent; border-radius:6px;
    color:var(--text); font-size:12.5px; text-align:left;}
  #ctxMenu button:hover:not(:disabled){background:var(--accent-soft); color:var(--accent); border-color:var(--soft-line-a);}
  #ctxMenu button:disabled{opacity:.35; cursor:default;}
  #ctxMenu .ci{width:15px; text-align:center; flex:none;}
  #ctxMenu .kb{margin-left:auto; color:var(--muted); font:11px Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace;}
  #ctxMenu .sep{display:block; height:1px; margin:4px 6px; background:var(--line2);}

  /* ===== Send bar ===== */
  #sendBar{flex:none; display:flex; gap:8px; align-items:flex-end; padding:9px 14px;
    background:var(--panel); border-top:1px solid var(--line);}
  #sendInput{flex:1; height:32px; font:13px Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace; min-width:120px;}
  #sendBar .fld select, #sendBar .fld input{height:32px;}
  #btnSend{height:32px; min-width:88px; font-weight:600;}

  /* ===== Status bar ===== */
  /* Status bar: same size, padding, gap and colours as the Binary Editor's,
     so the three tools read as one product */
  #statusbar{flex:none; display:flex; align-items:center; gap:18px; padding:6px 14px;
    font:12px Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace;
    color:var(--muted); background:var(--panel); border-top:1px solid var(--line);}
  /* Same rule as the Binary Editor: label in muted grey, value in body colour and bold */
  #statusbar b{color:var(--text); font-weight:600;}
  #statusbar .grow{flex:1;}
  #statusMsg{color:var(--muted);}
  #statusMsg.err{color:var(--danger);}
  #statusMsg.ok{color:var(--ok);}

  /* ===== About ===== */
  #veil{position:fixed; inset:0; background:rgba(15,23,42,.42); display:none; align-items:center; justify-content:center; z-index:50;}
  #veil.show{display:flex;}
  .dlg{background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:10px;
    box-shadow:0 14px 40px rgba(15,23,42,.28); padding:18px 20px; width:min(520px,92vw);}
  .dlg h3{margin:0 0 6px; font-size:16px; display:flex; align-items:center; gap:8px;}
  .dlg h3 .vtag{font-size:11px; font-weight:600; color:#fff; background:var(--accent); border-radius:4px; padding:1px 7px;}
  .dlg .blurb{font-size:12.5px; color:var(--muted); line-height:1.6; margin:6px 0 12px;}
  .dlg .kv{display:grid; grid-template-columns:auto 1fr; gap:5px 12px; font-size:12px; margin-bottom:12px;}
  .dlg .kv b{font-weight:600; color:var(--text); white-space:nowrap;}
  .dlg .kv span{color:var(--muted);}
  .dlg .btns{display:flex; justify-content:flex-end; gap:8px;}
  /* About dialog: same layout as the Binary Editor -- title + date badge / one-line summary / four capability cells / author */
  .dlg.about{width:min(560px,92vw); padding:18px 20px;}
  .dlg.about h3{margin:0; font-size:17px;}
  .ab-head{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .ab-date{display:flex; align-items:center; gap:6px; font:600 11.5px/1 Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace;
    color:var(--accent); background:var(--accent-soft); border:1px solid var(--soft-line-a);
    border-radius:6px; padding:5px 9px; white-space:nowrap;}
  .ab-date i{font-style:normal; font-weight:600; color:var(--muted); font-size:10.5px; letter-spacing:.6px;}
  .ab-blurb{font-size:12.5px; color:var(--muted); line-height:1.55; margin:7px 0 15px;}
  .ab-grid{display:grid; grid-template-columns:1fr 1fr; gap:13px 16px;}
  .ab-item{border-left:3px solid var(--soft-line-a); padding-left:10px;}
  .ab-item .t{font-size:12.5px; font-weight:700; color:var(--text);}
  .ab-item .d{font-size:11.5px; color:var(--muted); line-height:1.55; margin-top:3px;}
  .ab-foot{display:flex; gap:8px; align-items:baseline; margin-top:16px; padding-top:11px;
    border-top:1px solid var(--line2); font-size:12px; color:var(--muted);}
  .ab-foot b{color:var(--text); font-weight:600;}
  .dlg.about .btns{margin-top:14px;}
  kbd{font:11px Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace; background:var(--group-bg); border:1px solid var(--line2); border-radius:4px; padding:1px 5px;}

  /* Scrollbars follow the theme */
  #log::-webkit-scrollbar{width:12px; height:12px;}
  #log::-webkit-scrollbar-thumb{background:var(--vscode-scrollbarSlider-background,rgba(120,130,150,.4));
    border:3px solid transparent; background-clip:content-box; border-radius:10px;}
  @media (max-width:1000px){ select#port{min-width:190px; max-width:300px;} .hint{display:none;} }
</style>
</head>
<body>

<div id="titlebar">
  <span class="brand">⬡ COM Assistant</span>
  <button id="btnAbout" data-i18n-title="aboutTip" data-i18n="aboutBtn"></button>
  <span class="ver">__BB_VER__</span>
  <span class="spacer"></span>
  <span id="connPill"><span class="dot"></span><span id="connText"></span></span>
  <button id="btnLang" title="Switch language / 切换界面语言">EN</button>
</div>

<div id="toolbar">
  <div class="group"><span class="cap" data-i18n="capPort"></span>
    <span class="fld">
      <select id="port" data-i18n-title="portTip"></select>
    </span>
    <button id="btnReload" data-i18n-title="reloadTip">⟳</button>
  </div>

  <div class="group"><span class="cap" data-i18n="capUart"></span>
    <span class="fld"><span class="fl" data-i18n="lblBaud"></span>
      <span class="combo">
        <select id="baud" class="sel" data-i18n-title="baudTip"></select>
        <input id="baudFree" type="text" inputmode="numeric" value="" data-i18n-title="baudTip">
      </span>
    </span>
    <span class="fld"><span class="fl" data-i18n="lblData"></span>
      <select id="dataBits" class="sel"></select>
    </span>
    <span class="fld"><span class="fl" data-i18n="lblParity"></span>
      <select id="parity" class="sel"></select>
    </span>
    <span class="fld"><span class="fl" data-i18n="lblStop"></span>
      <select id="stopBits" class="sel"></select>
    </span>
    <span class="fld"><span class="fl" data-i18n="lblFlow"></span>
      <select id="flow" class="sel"></select>
    </span>
  </div>

  <div class="group"><span class="cap" data-i18n="capLine"></span>

  }

  function toast(msg, kind){

  /* ---------------- log ---------------- */

  // and are appended once per frame, cutting reflows from hundreds per second to a few dozen.
  var MAX_LINES = 1200;

  }

  function stampNode(tsText){
    var f = document.createDocumentFragment();
    var ts = document.createElement('span');

    ts.textContent = tsText || hhmmss();
    f.appendChild(ts);
    f.appendChild(document.createTextNode(' '));
    return f;
  }
  function newLine(cls, tsText){
    var d = document.createElement('div');
    d.className = 'ln' + (cls ? ' ' + cls : '');
    d.setAttribute('data-n', String(++state.lineSeq));   // row number lives on an attribute only, never in the text
    if (stampOn()) d.appendChild(stampNode(tsText));
    frag().appendChild(d);
    state.lineCount++;
    state.line = d;
    return d;
  }
  function trimLog(){
    // childNodes.length is a cached count (no layout), so it beats our own bookkeeping here:
    // one missed increment and trimming never happens - the classic "gets slower the longer it runs"
    var over = el.log.childNodes.length - MAX_LINES;
    if (over <= 0) return;
    var r = document.createRange();
    r.setStart(el.log, 0);
    r.setEnd(el.log, over);
    r.deleteContents();

    if (state.line && !state.line.parentNode) state.line = null;
  }
  // Follow policy: auto-scroll only while the user sits at the bottom. Intent comes from wheel/keyboard,
  // so scrollHeight is normally never read - reading it forces a synchronous layout.
  el.log.addEventListener('wheel', function(e){
    if (e.deltaY < 0) state.pinBottom = false;      // scrolling up means reading history: release the scrollbar
  }, { passive: true });
  el.log.addEventListener('keydown', function(e){
    if (e.key === 'PageUp' || e.key === 'ArrowUp' || e.key === 'Home') state.pinBottom = false;
  });

  // and histBase counts what was dropped so row numbers never shift.
  var HIST_MAX = 16 * 1024 * 1024;

      while (cut < n) { drop += state.hist[cut].length; cut++; }

      if (!state.histView) el.log.appendChild(state.frag);

      for (i = 0; i < fresh.length; i++) histPush(fresh[i].textContent || '');
    }
    if (state.histView) { if (state.line && !state.line.parentNode) state.line = null; return; }
    // When the digit count changes (999 -> 1000) widen the gutter, so numbers stay right-aligned and the text does not move
    var dg = String(state.lineSeq).length;

      state.numDigits = dg;

  }
  function sysLine(msg, kind, key, vars){
    var d = document.createElement('div');

    if (stampOn()) d.appendChild(stampNode());
    var txt = document.createElement('span');
    txt.className = 'txt';
    txt.textContent = msg;
    d.appendChild(txt);

    if (key) {

  function appendText(str, tsText){

      var seg = parts[i];

    }
    var d = document.createElement('div');
    d.className = 'ln hexln';
    d.setAttribute('data-n', String(++state.lineSeq));
    var o = document.createElement('span');
    o.className = 'off';
    o.textContent = ('0000000' + off.toString(16).toUpperCase()).slice(-8);
    var g = document.createElement('span');
    g.className = 'gut';
    g.textContent = '|' + gut + '|';

  // Serial data trickles in: emit a row as soon as 16 bytes are available, and flush a shorter
  // remainder after 150 ms without new data - otherwise a slow device stays invisible for ages.
  function flushHexRest(){

    state.hexOffset += state.hexRest.length;
    state.hexRest = [];
    commitLog();
  }
  function appendHex(bytes){
    if (!bytes.length) return;
    var all = state.hexRest.concat(Array.prototype.slice.call(bytes));
    var rows = Math.floor(all.length / 16);
    // At 3 Mbps that is 20k+ rows per second: paint only the tail and account for the rest without drawing
    var skip = rows > 800 ? rows - 800 : 0;
    state.hexOffset += skip * 16;
    for (var r = skip; r < rows; r++) hexRow(all.slice(r * 16, r * 16 + 16), state.hexOffset + r * 16);
    state.hexOffset += (rows - skip) * 16;
    state.hexRest = all.slice(rows * 16);

  function serializeLog(){
    // Use the whole archive: the log keeps only the last 1200 rows, but copy/save must cover everything
    var src = state.hist, out = [], i;

      for (i = 0; i < el.log.childNodes.length; i++) out.push(el.log.childNodes[i].textContent || '');
      src = out; out = [];

    for (i = 0; i < src.length; i++) out.push((src[i] || '').replace(/\u00a0/g, ' '));
    return out.join('\n') + '\n';
  }

  /* ---------------- connection state ---------------- */
  function setConnected(on, info){
    state.connected = !!on;
    state.connecting = false;
    state.rxWin = 0; state.rxWinAt = 0;
    if (!on) state.fastHinted = false;
    el.pill.classList.toggle('on', state.connected);
    el.connText.textContent = state.connected ? t('connected') : t('disconnected');
    el.btnConn.textContent = state.connected ? t('disconnect') : t('connect');
    el.btnConn.classList.toggle('primary', !state.connected);
    el.btnConn.classList.toggle('danger', state.connected);
    ['port','baud','baudFree','dataBits','parity','stopBits','flow'].forEach(function(k){ el[k].disabled = state.connected; });
    el.btnReload.disabled = state.connected;
    if (state.connected && info) {
      state.portName = info.port;
      /* The baud rate already lives in the Config field — this one is the port alone */
      el.statusPort.textContent = info.port;
      el.statusCfg.textContent = fmtCfg();
    } else {
      state.portName = '—';
      el.statusPort.textContent = '—';
    }

  /* ---------------- receive: buffer first, paint once per frame ---------------- */
  // 3 Mbps of continuous data is hundreds of chunks per second. Painting each one means hundreds of
  // reflows per second and drags the whole of VS Code down. Buffering them and decoding + committing
  // every 40 ms costs a little freshness but takes CPU from "one core pinned" to "barely visible".
  var RX_FLUSH_MS = 40;
  var MAX_QUEUE = 1024 * 1024;       // buffer at most 1 MB of unpainted data, then drop the oldest
  var MAX_RENDER = 192 * 1024;       // paint at most 192 KB per frame, keep only the newest part of the rest
  var LINES_PER_FLUSH = 500;         // max rows created per frame, so long-line bursts cannot blow up one frame
  function dropHead(q, want){
    var dropped = 0;

    state.rxQueued -= dropped;
    state.dropped += dropped;

  }
  function queueRx(bytes){

    if (state.rxQueued > MAX_QUEUE) dropHead(q, state.rxQueued - MAX_QUEUE / 2);
    if (state.rxTimer) {
      // With a big backlog stop waiting for the timer and paint now, or the screen lags by seconds
      if (state.rxQueued > 262144) { clearTimeout(state.rxTimer); state.rxTimer = null; flushRx(); }
      return;
    }
    // The slower the last frame, the later the next one starts: fewer updates beats a saturated main thread
    var delay = RX_FLUSH_MS;
    if (state.flushCost > 6) delay = Math.max(delay, Math.min(250, state.flushCost * 5));
    if (state.rxQueued > 16384) delay = Math.max(delay, 100);

  function flushRx(){

    var total = state.rxQueued;

    for (var i = 0; i < q.length; i++) { all.set(q[i], at); at += q[i].length; }

      var keep = all.subarray(total - MAX_RENDER);

      state.dropped += total - keep.length;

    var ts = stampOn() ? hhmmss() : '';

      var text = state.decoder.decode(all, { stream: true }).replace(/\r\n/g, '\n').replace(/\r/g, '\n');

      var capped = capLines(text, LINES_PER_FLUSH);

  function updateCounters(force){

  }
  function prefsNow(){
    return {

  /* ---------------- control defaults ---------------- */
  var BAUD_RATES = [300, 600, 1200, 2400, 4800, 9600, 14400, 19200, 28800, 38400,

    921600, 1000000, 1152000, 1500000, 2000000, 2500000, 3000000];

  /* ---------------- baud rate: dropdown + custom ---------------- */

  }
  function setBaud(v){
    var want = String(v == null ? '' : v).trim() || '115200';

  function buildSelects(){

  }
  function applyPrefs(){
    setBaud(saved.baud || '115200');
    if (saved.dataBits) el.dataBits.value = saved.dataBits;
    if (saved.parity) el.parity.value = saved.parity;
    if (saved.stopBits) el.stopBits.value = saved.stopBits;
    if (saved.flow) el.flow.value = saved.flow;
    el.dtr.checked = saved.dtr !== false;
    el.rts.checked = saved.rts !== false;
    el.optHex.checked = saved.hex === true;
    el.optTs.checked = saved.ts === true;
    el.optAuto.checked = saved.auto !== false;
    el.optWrap.checked = saved.wrap === true;
    el.optNums.checked = saved.nums !== false;      // on by default
    el.sendEnc.value = saved.sendEnc === 'hex' ? 'hex' : 'text';
    if (saved.eol) el.eol.value = saved.eol;
    if (saved.repeatMs) el.repeatMs.value = saved.repeatMs;
    el.log.classList.toggle('wrap', el.optWrap.checked);
    el.log.classList.toggle('nums', el.optNums.checked);

    el.statusCfg.textContent = fmtCfg();
  }

  /* ---------------- port list ---------------- */
  // The device name usually already contains (COM3); prefixing the port again would show COM3 twice
  function portLabel(p){
    var desc = p.desc || '';
    if (!desc || desc === 'Serial port' || desc === p.path) return p.path;
    if (desc.toUpperCase().indexOf(p.path.toUpperCase()) >= 0) return desc;
    return p.path + '  —  ' + desc;
  }
  function renderPorts(ports, keepSilent){
    state.ports = ports || [];

    } else {
      state.ports.forEach(function(p){
        el.port.appendChild(new Option(portLabel(p), p.path));
      });
      if (want && !state.ports.some(function(p){ return p.path === want; })) {
        el.port.appendChild(new Option(want + t('notDetected'), want));
      }
      var hit = state.ports.filter(function(p){ return p.path === want; })[0];
      el.port.value = hit ? hit.path : state.ports[0].path;
    }

  // Device names often exceed the box width, so put a title on the selected option to show it in full on hover
  function syncPortTitle(){
    var o = el.port.options[el.port.selectedIndex];

  }
  function scan(keepSilent){
    if (!keepSilent) toast(t('scanning'));

  }

  /* ---------------- connect ---------------- */
  function config(){
    return {
      port: el.port.value,
      baud: Number(baudVal()),
      dataBits: Number(el.dataBits.value),
      parity: el.parity.value,
      stopBits: el.stopBits.value,
      flow: el.flow.value,
      dtr: el.dtr.checked,
      rts: el.rts.checked

  }
  function connect(){
    var cfg = config();
    if (!cfg.port) { toast(t('pickPort'), 'err'); return; }
    if (!baudVal()) { toast(t('baudEmpty'), 'err'); el.baudFree.focus(); return; }
    if (!isFinite(cfg.baud) || cfg.baud <= 0) { toast(t('openFail').replace('{e}', 'baud'), 'err'); return; }
    state.connecting = true;
    el.btnConn.disabled = true;
    el.btnConn.textContent = t('connecting');
    toast(fill(t('opening'), { p: cfg.port, b: cfg.baud }));

  }
  function disconnect(){
    vscode.postMessage({ type: 'close' });

  /* ---------------- send ---------------- */
  function payloadFor(text){
    if (el.sendEnc.value === 'hex') {
      var bytes = parseHex(text);
      if (bytes === null) return { error: t('hexBad') };
      if (!bytes.length) return { error: t('emptySend') };
      return { bytes: bytes, echo: bytes.length + ' bytes' };
    }
    if (!text.length) return { error: t('emptySend') };
    var eolMap = { none: '', cr: '\r', lf: '\n', crlf: '\r\n' };
    var str = text + (eolMap[el.eol.value] || '');
    return { bytes: textToBytes(str), echo: text };
  }
  function send(payload, label){
    if (!payload || !payload.bytes) return;
    if (!state.connected) { toast(t('needConn'), 'err'); return; }
    vscode.postMessage({ type: 'send', data: bytesToBase64(payload.bytes) });
    state.txBytes += payload.bytes.length;
    var d = document.createElement('div');
    d.className = 'ln tx';
    if (stampOn()) d.appendChild(stampNode());
    d.appendChild(document.createTextNode('→ ' + label));
    el.log.appendChild(d);
    state.line = null;
    updateCounters(); trimLog(); scrollEnd();
  }
  function sendNow(){
    var text = el.sendInput.value;
    var r = payloadFor(text);
    if (r.error) { toast(r.error, 'err'); return; }
    state.lastPayload = r;
    if (state.history[state.history.length - 1] !== text) {
      state.history.push(text);
      if (state.history.length > 50) state.history.shift();
    }
    state.histIdx = -1;

  }
  function startRepeat(){
    var ms = Math.round(Number(String(el.repeatMs.value).trim() || '0'));
    if (!isFinite(ms) || ms <= 0) return false;
    if (ms < 20) ms = 20;
    stopRepeat(true);
    state.repeatTimer = setInterval(function(){
      if (!state.connected) { stopRepeat(true); return; }
      send(state.lastPayload, state.lastPayload ? state.lastPayload.echo : '');
    }, ms);
    el.btnSend.classList.add('on');
    el.btnSend.textContent = t('stopBtn');
    toast(fill(t('repeatOn'), { n: ms }), 'ok');
    savePrefs();
    return true;
  }
  function stopRepeat(silent){
    if (state.repeatTimer) {
      clearInterval(state.repeatTimer);
      state.repeatTimer = null;
      if (!silent) toast(t('repeatOff'));
    }
    el.btnSend.classList.remove('on');
    el.btnSend.textContent = t('sendBtn');
  }

  /* ---------------- messages ---------------- */
  window.addEventListener('message', function(ev){
    var m = ev.data || {};
    switch (m.type) {
      case 'ports':
        renderPorts(m.ports);
        break;
      case 'rx':
        queueRx(base64ToBytes(m.data || ''));
        break;
      case 'openResult':
        el.btnConn.disabled = false;
        if (m.ok) {
          setConnected(true, { port: m.port, baud: m.baud });
          // Nothing received 4 s after opening: mention the control lines instead of leaving the user waiting
          state.rxAtOpen = state.rxBytes;
          clearTimeout(state.noDataTimer);
          state.noDataTimer = setTimeout(function(){
            if (state.connected && state.rxBytes === state.rxAtOpen) {
              sysLine(t('noDataHint'), 'warn', 'noDataHint');
            }
          }, 4000);
          sysLine(fill(t('opened'), { p: m.port, b: m.baud, f: fmtCfg() }), '', 'opened',
                  { p: m.port, b: m.baud, f: fmtCfg() });
          toast(fill(t('opened'), { p: m.port, b: m.baud, f: fmtCfg() }), 'ok');
          el.sendInput.focus();
        } else {
          setConnected(false);
          el.btnConn.textContent = t('connect');
          toast(fill(t('openFail'), { e: m.error || '' }), 'err');
          sysLine(fill(t('openFail'), { e: m.error || '' }), 'err', 'openFail', { e: m.error || '' });
        }
        break;
      case 'closed':
        clearTimeout(state.noDataTimer);
        if (state.connected) {
          setConnected(false);
          var reason = String(m.reason || '');
          var keyMap = { user: 'closedByUser', replaced: 'closedReplaced', panel: 'closedPanel' };
          if (keyMap[reason]) {
            sysLine(t(keyMap[reason]), '', keyMap[reason]);
          } else if (reason.indexOf('exit:') === 0) {
            var code = reason.slice(5);
            sysLine(fill(t('closedExit'), { c: code }), '', 'closedExit', { c: code });
          } else {
            sysLine(fill(t('closedByHost'), { r: reason }), '', 'closedByHost', { r: reason });
          }
        }
        break;
      case 'bridgeError':
        toast(t('sendFail').replace('{e}', m.message || ''), 'err');
        break;
      case 'sendFailed':
        toast(t('sendFail').replace('{e}', m.error || ''), 'err');
        break;
      case 'clipboardText': {
        var pasteTo = pendingPaste; pendingPaste = null;
        if (!pasteTo) break;
        var pasteTxt = String(m.text || '');
        if (!pasteTxt) break;
        var pa = pasteTo.selectionStart != null ? pasteTo.selectionStart : pasteTo.value.length;
        var pb = pasteTo.selectionEnd != null ? pasteTo.selectionEnd : pa;
        pasteTo.value = pasteTo.value.slice(0, pa) + pasteTxt + pasteTo.value.slice(pb);
        pasteTo.selectionStart = pasteTo.selectionEnd = pa + pasteTxt.length;
        pasteTo.dispatchEvent(new Event('input', { bubbles: true }));
        pasteTo.focus();
        break;
      }
      case 'saved':
        toast(m.ok ? fill(t('saved'), { p: m.path || '' }) : t('saveFail'), m.ok ? 'ok' : 'err');
        break;
    }
  });

  // About dialog: version / date / four capability tiles, filled in on open (same approach as Binary Editor)
  var APP_VER = '__BB_VER__', APP_DATE = '2026-11-02';

  /* ---------------- i18n ---------------- */
  function applyLang(){
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    el.btnLang.textContent = lang === 'zh' ? 'EN' : '中文';
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function(n){
      n.textContent = t(n.getAttribute('data-i18n'));
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-title]'), function(n){
      n.title = t(n.getAttribute('data-i18n-title'));
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-ph]'), function(n){
      n.placeholder = t(n.getAttribute('data-i18n-ph'));
    });
    el.connText.textContent = state.connected ? t('connected') : t('disconnected');
    el.btnConn.textContent = state.connecting ? t('connecting') : (state.connected ? t('disconnect') : t('connect'));
    el.btnSend.textContent = state.repeatTimer ? t('stopBtn') : t('sendBtn');
    el.statusCfg.textContent = fmtCfg();
    var cOpt = el.baud.querySelector('option[value="custom"]');
    if (cOpt) cOpt.textContent = t('baudCustom');
    if (state.ports && state.ports.length) renderPorts(state.ports, true);
    // System rows already printed in the log (ready / connected / open failed ...) must switch language too
    Array.prototype.forEach.call(el.log.querySelectorAll('.ln.sys[data-k]'), function(n){
      var key = n.getAttribute('data-k');
      var vars = null;
      try { vars = JSON.parse(n.getAttribute('data-v') || 'null'); } catch (e) { vars = null; }
      var span = n.querySelector('.txt');
      if (span) span.textContent = vars ? fill(t(key), vars) : t(key);
      // This row also exists in the full archive, so update it there or searches keep returning the old language
      var no = +n.getAttribute('data-n');
      if (no > 0) {
        var hi = no - 1 - state.histBase;
        if (hi >= 0 && hi < state.hist.length) {
          var fresh = n.textContent || '';
          state.histChars += fresh.length - state.hist[hi].length;
          state.hist[hi] = fresh;
        }
      }
    });
    // The "find results" summary is written by script ({n} places / {n} matches), so repaint it on language change
    if (find.allOpen) { find.allSig = ''; renderFindAll(); }
  }

  /* ---------------- find (Ctrl+F): archive-wide match + jump + highlight ---------------- */
  /* Highlights are drawn with the CSS Custom Highlight API: no DOM mutation, so the "build a frame
     then append" pipeline below is left alone; runtimes without it fall back to selecting the match.
     The search covers state.hist - **every** line ever captured, regardless of what is still on screen:
     the log keeps only the last 1200 rows to stay fast, but Find must start from the very first byte. */
  var FIND_MAX = 3000;
  var find = { open: false, q: '', hits: [], idx: -1, timer: 0, allOpen: false };
  var canHL = !!(window.CSS && CSS.highlights && typeof Highlight === 'function');

  /* Is archive row i still on screen? If so return its node (both highlight and jump need it) */
  function domFor(i){
    var first = el.log.firstElementChild;
    if (!first) return null;
    var n0 = parseInt(first.getAttribute('data-n'), 10);
    if (!(n0 > 0)) return null;
    var k = i - (n0 - 1 - state.histBase);
    return (k >= 0 && k < el.log.children.length) ? el.log.children[k] : null;
  }
  /* Build a Range from a character offset inside a row: rows also hold a timestamp span, so walk the text nodes and accumulate */
  function rangeIn(node, off, len){
    var walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT, null), t, acc = 0;
    var sn = null, so = 0, en = null, eo = 0;
    while ((t = walker.nextNode())){
      var L = t.nodeValue.length;
      if (!sn && off >= acc && off <= acc + L) { sn = t; so = off - acc; }
      if (sn && off + len <= acc + L) { en = t; eo = off + len - acc; break; }
      acc += L;
    }
    if (!sn || !en) return null;
    var r = document.createRange();
    r.setStart(sn, so); r.setEnd(en, eo);
    return r;
  }
  /* Scan the archive row by row; each hit is { i: archive index, off: offset within the row, n: row number } */
  function buildFindIndex(){
    var needle = find.q.toLowerCase(), hits = [], i, at, k, t;
    for (i = 0; i < state.hist.length && hits.length < FIND_MAX; i++){
      t = state.hist[i];
      if (!t) continue;
      t = t.toLowerCase();
      at = 0;
      while ((k = t.indexOf(needle, at)) >= 0){
        hits.push({ i: i, off: k, n: state.histBase + i + 1 });
        at = k + needle.length;
        if (hits.length >= FIND_MAX) break;
      }
    }
    return hits;
  }
  function paintFind(){
    if (!canHL) return;
    try {
      CSS.highlights.delete('sc-find');
      CSS.highlights.delete('sc-find-cur');
      if (!find.hits.length) return;
      var all = new Highlight(), i, h, r, node;
      for (i = 0; i < find.hits.length; i++){
        h = find.hits[i];
        node = domFor(h.i);
        if (!node) continue;                    // already scrolled out of the buffer: only listed in the result panel
        r = rangeIn(node, h.off, find.q.length);
        if (r) all.add(r);
      }
      CSS.highlights.set('sc-find', all);
      var cur = null;
      if (find.idx >= 0 && find.hits[find.idx]){
        node = domFor(find.hits[find.idx].i);
        if (node) cur = rangeIn(node, find.hits[find.idx].off, find.q.length);
      }
      if (cur) CSS.highlights.set('sc-find-cur', new Highlight(cur));
    } catch (e) { /* log trimming invalidated the range: drop the highlight, keep the jump */ }
  }
  function updateFindCount(){
    var n = find.hits.length;
    el.findCount.textContent = n && find.idx >= 0 ? (find.idx + 1) + '/' + n : '0/' + n;
    el.findBar.classList.toggle('none', !n && !!find.q);
  }
  // jump=true: jump to the first hit after the term changes; false: the log is growing, so hold the current hit in place
  function runFind(jump){
    var keepAt = (find.idx >= 0 && find.hits[find.idx]) ? find.hits[find.idx].n : -1;
    find.q = el.findInput.value;
    find.hits = []; find.idx = -1;
    if (!find.q) {
      paintFind(); updateFindCount();
      if (find.allOpen) renderFindAll();
      return;
    }
    find.hits = buildFindIndex();
    if (find.hits.length) {
      find.idx = 0;
      if (!jump && keepAt >= 0) {
        for (var j = 0; j < find.hits.length; j++) if (find.hits[j].n >= keepAt) { find.idx = j; break; }
      }
    }
    paintFind(); updateFindCount();
    if (find.allOpen) renderFindAll();
    if (jump && find.idx >= 0) gotoHit(0, true);
  }
  /* ---------------- history view ----------------
     The log keeps only MAX_LINES rows of DOM; everything older survives as text in state.hist.
     Double-clicking a hit that scrolled away rebuilds a read-only window on demand, and the banner
     on top returns to live - so "click a result, see that line" without keeping tens of thousands of rows. */
  function histRow(text, n){
    var d = document.createElement('div');
    d.className = 'ln';
    d.setAttribute('data-n', String(n));
    d.textContent = text;
    return d;
  }

  function showHistWindow(i){
    var total = state.hist.length;
    if (!total) return;
    i = Math.max(0, Math.min(i, total - 1));
    var from = Math.max(0, i - 120), to = Math.min(total, i + 180);
    state.histView = { from: from, to: to };
    state.line = null;
    state.pinBottom = false;

    el.log.textContent = '';
    var frag = document.createDocumentFragment();
    for (var k = from; k < to; k++) frag.appendChild(histRow(state.hist[k], state.histBase + k + 1));
    el.log.appendChild(frag);
    state.lineCount = el.log.childNodes.length;

    var target = el.log.children[i - from];
    if (target) {
      el.log.scrollTop = Math.max(0, target.offsetTop - el.log.clientHeight / 2);
      target.classList.add('histTarget');
      setTimeout(function(){ target.classList.remove('histTarget'); }, 1600);
    }
    showHistBar(from, to);
  }

  function showHistBar(from, to){
    var bar = document.getElementById('histBar');
    if (!bar) {
      bar = document.createElement('div');
      bar.id = 'histBar';
      if (el.logWrap) {
        if (getComputedStyle(el.logWrap).position === 'static') el.logWrap.style.position = 'relative';
        el.logWrap.appendChild(bar);
      }
    }
    bar.textContent = '';
    var msg = document.createElement('span');
    msg.textContent = fill(t('histShown'), { a: state.histBase + from + 1, b: state.histBase + to });
    var grow = document.createElement('span');
    grow.className = 'grow';
    var btn = document.createElement('button');
    btn.textContent = t('histBack');
    btn.addEventListener('click', exitHistView);
    bar.appendChild(msg); bar.appendChild(grow); bar.appendChild(btn);
  }

  function exitHistView(){
    if (!state.histView) return;
    state.histView = null;
    var bar = document.getElementById('histBar');
    if (bar) bar.remove();

    el.log.textContent = '';
    state.line = null;
    var from = Math.max(0, state.hist.length - MAX_LINES);
    var frag = document.createDocumentFragment();
    for (var k = from; k < state.hist.length; k++) frag.appendChild(histRow(state.hist[k], state.histBase + k + 1));
    el.log.appendChild(frag);
    state.lineCount = el.log.childNodes.length;
    scrollEnd();
    if (find.open && find.q) paintFind();
  }

  function gotoHit(i, noRepaint){
    var n = find.hits.length;
    if (!n) return;
    find.idx = ((i % n) + n) % n;
    if (!noRepaint) { paintFind(); updateFindCount(); }
    var h = find.hits[find.idx], node = domFor(h.i);
    if (!node){                                  // this row already scrolled out of the 1200-row display buffer
      markFindAll();
      showHistWindow(h.i);                       // rebuild a window from the full archive, still viewable
      return;
    }
    var lr = el.log.getBoundingClientRect(), rr = node.getBoundingClientRect();
    el.log.scrollTop += (rr.top - lr.top) - Math.max(0, (lr.height - rr.height) / 2);
    state.pinBottom = false;
    if (!canHL) {
      var r2 = rangeIn(node, h.off, find.q.length), s = window.getSelection();
      if (r2 && s) { s.removeAllRanges(); s.addRange(r2); }
    }
    markFindAll();
  }
  function openFind(){
    find.open = true;
    el.findBar.classList.add('show');
    var s = window.getSelection();
    if (s && !s.isCollapsed) {
      var pick = String(s).replace(/\s+/g, ' ').trim();
      if (pick && pick.length <= 80) el.findInput.value = pick;   // search whatever is selected first
    }
    el.findInput.focus();
    el.findInput.select();
    if (el.findInput.value) runFind(true);
    else updateFindCount();
  }
  function closeFind(){
    find.open = false;
    el.findBar.classList.remove('show');
    find.hits = []; find.idx = -1;
    paintFind(); updateFindCount();
    closeFindAll();
    el.log.focus();
  }
  function stepFind(step){
    if (!find.hits.length) { runFind(true); return; }
    gotoHit(find.idx + step);
  }

  /* ---------------- find all: bottom result panel ---------------- */
  /* Hits come from the whole archive; clicking a row jumps there (rows outside the buffer only show here) */
  var FR_MAX = 2000;                 // max rows drawn, extra hits only get a notice (plenty within the 3000-hit cap)
  function renderFindAll(){
    if (!find.allOpen) return;
    var q = find.q, n = find.hits.length;
    el.frSum.textContent = !q ? '' : (n ? fill(t('frCount'), { n: n }) : t('frNone'));
    el.frSum.className = n ? '' : 'none';
    var box = el.frList;
    /* Do not rebuild for the same hit set (the port keeps streaming, so this runs every 400 ms):
       when count + first/last row number + query are unchanged, just mark the current row */
    var sig = n + ':' + q + ':' + (n ? find.hits[0].n + ':' + find.hits[n - 1].n : '');
    if (find.allSig === sig && box.children.length) { markFindAll(); return; }
    find.allSig = sig;
    box.innerHTML = '';
    if (!n) return;
    var frag = document.createDocumentFragment(), upto = Math.min(n, FR_MAX), i;
    for (i = 0; i < upto; i++){
      var h = find.hits[i], full = state.hist[h.i] || '';
      var row = document.createElement('div');
      row.className = 'frRow' + (i === find.idx ? ' cur' : '');
      row.setAttribute('data-i', String(i));
      if (!domFor(h.i)) row.className += ' gone';       // scrolled off screen: dim it
      var ln = document.createElement('span');
      ln.className = 'fln';
      ln.textContent = String(h.n);
      var off = h.off, s0 = Math.max(0, off - 64);
      var s1 = Math.min(full.length, off + q.length + 96);
      var tx = document.createElement('span');
      tx.className = 'ftx';
      tx.title = full;
      tx.innerHTML = (s0 > 0 ? '…' : '') + esc(full.slice(s0, off))
        + '<mark>' + esc(full.substr(off, q.length)) + '</mark>'
        + esc(full.slice(off + q.length, s1)) + (s1 < full.length ? '…' : '');
      row.appendChild(ln); row.appendChild(tx);
      frag.appendChild(row);
    }
    box.appendChild(frag);
    if (n > upto) {
      var more = document.createElement('div');
      more.className = 'frRow';
      more.style.cursor = 'default';
      more.textContent = fill(t('frMore'), { n: upto });
      box.appendChild(more);
    }
    markFindAll();
  }
  // Mark the current hit in the result panel and scroll it into view
  function markFindAll(){
    if (!find.allOpen) return;
    var rows = el.frList.children;
    for (var i = 0; i < rows.length; i++) {
      var on = rows[i].getAttribute('data-i') === String(find.idx);
      rows[i].classList.toggle('cur', on);
      if (on && rows[i].scrollIntoView) { try { rows[i].scrollIntoView({ block: 'nearest' }); } catch (e) {} }
    }
  }
  function openFindAll(){
    if (!el.findBar.classList.contains('show')) openFind();   // open the find bar first if closed (it picks up the selection)
    find.allOpen = true;
    el.findRes.classList.add('show');
    el.resSplit.classList.add('show');
    applyResH();
    if (!find.q || find.q !== el.findInput.value || !find.hits.length) runFind(true);
    renderFindAll();
  }
  function closeFindAll(){
    find.allOpen = false;
    find.allSig = '';
    el.findRes.classList.remove('show');
    el.resSplit.classList.remove('show');
    el.frList.innerHTML = '';
    el.frSum.textContent = '';
  }
  el.btnFind.addEventListener('click', function(){ if (find.open) closeFind(); else openFind(); });
  el.findInput.addEventListener('input', function(){
    clearTimeout(find.timer);
    find.timer = setTimeout(function(){ runFind(true); }, 160);
  });
  el.findInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter') { e.preventDefault(); stepFind(e.shiftKey ? -1 : 1); }
    else if (e.key === 'Escape') { e.preventDefault(); closeFind(); }
  });
  $('findPrev').addEventListener('click', function(){ stepFind(-1); el.findInput.focus(); });
  el.findAll.addEventListener('click', function(){ if (find.allOpen) closeFindAll(); else openFindAll(); });
  el.frClose.addEventListener('click', function(){ closeFindAll(); el.log.focus(); });
  el.frList.addEventListener('click', function(e){
    var row = e.target && e.target.closest ? e.target.closest('.frRow') : null;
    var i = row ? +row.getAttribute('data-i') : -1;
    if (!(i >= 0)) return;                 // the "only the first N shown" row carries no data-i
    gotoHit(i);
  });
  /* Double-click a hit: jump even when the target scrolled out of the display buffer (via the history window) */
  el.frList.addEventListener('dblclick', function(e){
    var row = e.target && e.target.closest ? e.target.closest('.frRow') : null;
    var i = row ? +row.getAttribute('data-i') : -1;
    if (!(i >= 0)) return;
    find.idx = i;
    gotoHit(i);
  });
  $('findNext').addEventListener('click', function(){ stepFind(1); el.findInput.focus(); });
  $('findClose').addEventListener('click', closeFind);

  /* ---------------- result panel height: drag the splitter up and down ---------------- */
  /* Panel height lives in prefs; until it has been dragged, use 35% of the log area (never below 90px) */
  function resDefaultH(){
    var h = el.logWrap ? el.logWrap.getBoundingClientRect().height : 400;
    return Math.max(90, Math.round(h * 0.35));
  }
  function applyResH(){
    var wrap = el.logWrap ? el.logWrap.getBoundingClientRect().height : 600;
    var h = state.resH || resDefaultH();
    h = Math.max(90, Math.min(Math.round(wrap * 0.82), Math.round(h)));   // keep the log visible even when the window shrinks
    el.findRes.style.height = h + 'px';
  }
  function setResH(h, keep){
    var wrap = el.logWrap ? el.logWrap.getBoundingClientRect().height : 600;
    h = Math.max(90, Math.min(Math.round(wrap * 0.82), Math.round(h)));
    state.resH = h;
    applyResH();
    if (!keep) { try { vscode.postMessage({ type: 'savePrefs', prefs: prefsNow() }); } catch (e) {} }
  }
  window.addEventListener('resize', function(){ if (find.allOpen) applyResH(); });
  (function splitDrag(){
    var sp = el.resSplit, drag = false, y0 = 0, h0 = 0;
    sp.addEventListener('pointerdown', function(e){
      drag = true; y0 = e.clientY; h0 = el.findRes.getBoundingClientRect().height;
      sp.classList.add('drag');
      try { sp.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
    });
    sp.addEventListener('pointermove', function(e){
      if (!drag) return;
      setResH(h0 - (e.clientY - y0), true);
    });
    function end(){ if (!drag) return; drag = false; sp.classList.remove('drag'); setResH(state.resH || resDefaultH(), false); }
    sp.addEventListener('pointerup', end);
    sp.addEventListener('pointercancel', end);
    sp.addEventListener('dblclick', function(){ setResH(resDefaultH(), false); });
  })();

  /* ---------------- context menu: drawn by hand so it follows the language setting ---------------- */
  /* VS Code's built-in webview context menu follows the editor language and ignores the extension's
     zh/en switch, so the native menu is swallowed here and an own one is drawn (same as Binary Editor) */
  var ctxTarget = null, pendingPaste = null;
  function editableOf(node){
    var e = node && (node.nodeType === 1 ? node : node.parentNode);
    if (!e || !e.tagName) return null;
    return (e.tagName === 'INPUT' || e.tagName === 'TEXTAREA' || e.isContentEditable) ? e : null;
  }
  function selText(){
    var ed = editableOf(ctxTarget);
    if (ed && ed.selectionStart != null && ed.selectionEnd > ed.selectionStart)
      return ed.value.slice(ed.selectionStart, ed.selectionEnd);
    var s = window.getSelection();
    if (s && s.rangeCount && !s.isCollapsed) return String(s);
    return '';
  }
  function closeCtx(){ $('ctxMenu').classList.remove('show'); }
  function showCtx(e){
    if (el.veil.classList.contains('show')) return;      // no menu over the About dialog
    ctxTarget = e.target;
    var ed = editableOf(ctxTarget), has = !!selText();
    $('ctxCut').disabled = !(ed && has);
    $('ctxCopy').disabled = !has;
    $('ctxPaste').disabled = !ed;
    var m = $('ctxMenu');
    m.classList.add('show');
    var r = m.getBoundingClientRect();
    m.style.left = Math.max(6, Math.min(e.clientX, window.innerWidth - r.width - 6)) + 'px';
    m.style.top = Math.max(6, Math.min(e.clientY, window.innerHeight - r.height - 6)) + 'px';
  }
  document.addEventListener('contextmenu', function(e){
    e.preventDefault();                                   // suppress the native menu
    showCtx(e);
  });
  document.addEventListener('mousedown', function(e){
    if (!e.target.closest || !e.target.closest('#ctxMenu')) closeCtx();
  }, true);
  window.addEventListener('blur', closeCtx);
  el.log.addEventListener('scroll', closeCtx, { passive: true });
  function ctxCopySel(){
    var s = selText();
    if (!s) { toast(t('copyFirst'), 'err'); return false; }
    vscode.postMessage({ type: 'copy', text: s });
    return true;
  }
  $('ctxCopy').addEventListener('click', function(){
    if (ctxCopySel()) toast(t('copied'), 'ok');
    closeCtx();
  });
  $('ctxCut').addEventListener('click', function(){
    if (!ctxCopySel()) { closeCtx(); return; }
    var ed = editableOf(ctxTarget);
    if (ed) {
      var a = ed.selectionStart, b = ed.selectionEnd;
      ed.value = ed.value.slice(0, a) + ed.value.slice(b);
      ed.selectionStart = ed.selectionEnd = a;
      ed.dispatchEvent(new Event('input', { bubbles: true }));
    } else {
      var s = window.getSelection(); if (s) s.deleteFromDocument();
    }
    toast(t('cutDone'), 'ok');
    closeCtx();
  });
  $('ctxPaste').addEventListener('click', function(){
    var ed = editableOf(ctxTarget);
    closeCtx();
    if (!ed) return;
    pendingPaste = ed;
    vscode.postMessage({ type: 'paste' });                // the extension process reads the clipboard, the webview cannot
  });
  $('ctxSelectAll').addEventListener('click', function(){
    closeCtx();
    var ed = editableOf(ctxTarget);
    if (ed) { ed.focus(); if (ed.select) ed.select(); return; }
    var r = document.createRange(); r.selectNodeContents(el.log);
    var s = window.getSelection(); if (s) { s.removeAllRanges(); s.addRange(r); }
  });
  $('ctxFind').addEventListener('click', function(){ closeCtx(); openFind(); });

  /* ---------------- startup ---------------- */
  buildSelects();
  applyPrefs();
  applyLang();
  updateCounters(true);
  sysLine(t('greeting'), '', 'greeting');
  vscode.postMessage({ type: 'ready' });

  // Probe for automated tests (no effect on normal use)
  window.__serial = { state: state, parseHex: parseHex, toHex: toHex, fmtBytes: fmtBytes, serialize: serializeLog };
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:;">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Comparer</title>
<style>
  :root{
    /* Same palette as the Binary Editor: A blue / B purple, differences red, additions green, centre line neutral grey */
    --bg:var(--vscode-editorWidget-background,#eef0f4);
    --panel:var(--vscode-editor-background,#ffffff);
    --line:var(--vscode-panel-border,#dfe2e9);
    --line2:var(--vscode-editorWidget-border,#eceef3);
    --text:var(--vscode-editor-foreground,#1f2430);
    --muted:var(--vscode-descriptionForeground,#8a90a0);
    --accent:var(--vscode-button-background,#2563eb);
    --accent-hover:var(--vscode-button-hoverBackground,#1d4fd7);
    --accent-soft:var(--vscode-list-hoverBackground,#eef2ff);
    /* A / B identity colours, independent of the theme button colour: A is blue, B is purple.
       Everything that points at a pane (tag, status letter, context-menu badge) uses these. */
    --curA:#2563eb;
    --curB:#7c3aed;
    --group-bg:#fcfcfe; --head-bg:#f7f8fb; --off-bg:#f2f3f7;
    --input-bg:var(--vscode-input-background,#fff);
    --row-alt:var(--vscode-editor-lineHighlightBackground,#fafbfd);
    --soft-a:#fafcff; --soft-b:#fbf9ff;
    --soft-line-a:#c7d7ff; --soft-line-b:#ddd0ff;
    --tint-a-head:#e9f0ff; --tint-b-head:#f4f0ff;
    --split:#c9d0dc; --split-hi:#8b94a3; --grip:#9aa3b2;
    --gut:#dc2626;
    --sel-a:#cfe0ff; --sel-b:#e6dcff;
    --del-bg:rgba(220,38,38,.09); --del-ln:rgba(220,38,38,.14); --del-tx:#b91c1c; --del-mark:rgba(220,38,38,.30);
    --ins-bg:rgba(22,163,74,.11); --ins-ln:rgba(22,163,74,.16); --ins-tx:#15803d; --ins-mark:rgba(22,163,74,.30);
    --cur:rgba(37,99,235,.16);
    /* Filler for the side that has no line (added / deleted rows): a faint tint plus
       a very light 45° hairline hatch. Both are tuned to sit under the text without
       competing with it. */
    --empty-fill:rgba(15,23,42,.045);
    --empty-rule:rgba(51,65,85,.16);
    --danger:#dc2626; --danger-bg:#fef2f2;
    /* A=B / A!=B chip: green when identical, red when not (--same-* green, --diff2-* red) */
    --same-fg:#047857; --same-bg:#ecfdf5; --same-line:#6ee7b7;
    --diff2-fg:#b91c1c; --diff2-bg:#fef2f2; --diff2-line:#fca5a5;
    --thumb:rgba(120,130,150,.42); --thumb-hi:rgba(96,108,130,.78);
    /* Column widths are written on #paneHeads / #body .row: pane A (minimap / line numbers / text) - 9px splitter - pane B */
  }
  body.vscode-dark, body.vscode-high-contrast{
    /* Dark fallbacks: use --vscode-* when VS Code injects it, but opening this html elsewhere never renders black on black */
    --bg:var(--vscode-editorWidget-background,#1e1e1e);
    --panel:var(--vscode-editor-background,#1e1e1e);
    --line:var(--vscode-panel-border,#3c3c3c);
    --line2:var(--vscode-editorWidget-border,#343434);
    --text:var(--vscode-editor-foreground,#e6e6e6);
    --muted:var(--vscode-descriptionForeground,#a3a3a3);
    --accent:var(--vscode-button-background,#3b82f6);
    --accent-hover:#2563eb;
    --accent-soft:rgba(59,130,246,.18);
    --group-bg:var(--vscode-editorWidget-background,#252526);
    --head-bg:var(--vscode-sideBar-background,#252526);
    --input-bg:var(--vscode-input-background,#3c3c3c);
    --off-bg:rgba(255,255,255,.07);
    --row-alt:rgba(255,255,255,.045);
    --soft-a:rgba(37,99,235,.10); --soft-b:rgba(167,139,250,.12);
    --soft-line-a:rgba(37,99,235,.42); --soft-line-b:rgba(167,139,250,.42);
    --tint-a-head:rgba(37,99,235,.22); --tint-b-head:rgba(167,139,250,.20);
    --split:#3f3f3f; --split-hi:rgba(255,255,255,.72); --grip:rgba(255,255,255,.46);
    --gut:#ef4444;
    --sel-a:rgba(37,99,235,.34); --sel-b:rgba(167,139,250,.32);
    --curA:#3b82f6;
    --curB:#a78bfa;
    --del-bg:rgba(248,81,73,.13); --del-ln:rgba(248,81,73,.22); --del-tx:#f48771; --del-mark:rgba(248,81,73,.38);
    --ins-bg:rgba(63,185,80,.13); --ins-ln:rgba(63,185,80,.22); --ins-tx:#7ee787; --ins-mark:rgba(63,185,80,.38);
    --cur:rgba(37,99,235,.28);
    --empty-fill:rgba(0,0,0,.20);
    --empty-rule:rgba(255,255,255,.10);
    --danger-bg:rgba(220,38,38,.16);
    --same-fg:#6ee7b7; --same-bg:rgba(110,231,183,.12); --same-line:rgba(110,231,183,.42);
    --diff2-fg:#fca5a5; --diff2-bg:rgba(252,165,165,.13); --diff2-line:rgba(252,165,165,.42);
    --thumb:rgba(255,255,255,.22); --thumb-hi:rgba(255,255,255,.44);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif; font-size:13px;
    display:flex; flex-direction:column; overflow:hidden;
  }
  button{
    font:inherit; border:1px solid var(--line); border-radius:6px; height:28px; padding:0 10px;
    background:var(--input-bg); color:var(--text); cursor:pointer; white-space:nowrap;
    display:inline-flex; align-items:center; gap:5px; flex:0 0 auto;
  }
  button:hover:not(:disabled){background:var(--accent-soft); border-color:var(--accent);}
  button:disabled{opacity:.45; cursor:not-allowed;}
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
  button.primary:hover:not(:disabled){background:var(--accent-hover); border-color:var(--accent-hover);}

  /* ===== Title bar ===== */
  /* 43px in both tools: one number, so the band below it starts at the same place */
  #titlebar{flex:none; background:var(--panel); border-bottom:1px solid var(--line); height:43px;
    padding:7px 14px; display:flex; align-items:center; gap:10px;}
  #titlebar .brand{font-weight:700; font-size:15px; letter-spacing:.4px; color:var(--accent);}
  /* The title-bar group (about / version / language) is written the same way in all three tools:
   same height, radius and font size, and hovering always gives "tinted fill + accent border + accent text".
   Change it here and change it there too (Binary Editor and COM Debugger carry an identical copy). */
  #btnAbout{height:22px; padding:0 9px; font-size:11.5px; border-radius:11px; color:var(--muted);}
  #btnAbout:hover{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}
  .ver{font:600 10.5px/1 Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace; color:#fff; background:var(--accent);
    border-radius:4px; padding:3px 7px;}
  .spacer{flex:1;}
  #pill{font:600 11.5px/1 Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace; color:var(--muted); background:var(--head-bg);
    border:1px solid var(--line2); border-radius:11px; padding:5px 10px; white-space:nowrap;}
  #pill.diff{color:var(--del-tx); border-color:var(--del-ln); background:var(--del-bg);}
  #pill.same{color:var(--ins-tx); border-color:var(--ins-ln); background:var(--ins-bg);}
  /* The language toggle looks like the one in COM Debugger: a normal button, not shrunk into a pill */
  #btnLang{min-width:52px; height:24px; padding:0 10px; font-size:12px; font-weight:600; border-radius:6px; justify-content:center;}

  /* ===== Toolbar ===== */
  #toolbar{flex:none; background:var(--panel); border-bottom:1px solid var(--line); padding:12px 14px 10px;
    display:flex; flex-wrap:wrap; gap:10px; align-items:stretch;}
  /* Same box as the Binary Editor's groups (63px tall, controls on the bottom edge), so both
     toolbars end up the same height and the A / B rows below them line up in a split view */
  .group{position:relative; border:1px solid var(--line2); border-radius:9px; padding:12px 9px 7px;
    background:var(--group-bg); display:flex; gap:6px; align-items:flex-end; flex-wrap:wrap; min-height:63px;}
  .group > .cap{position:absolute; top:-8px; left:9px; background:var(--panel); padding:0 5px;
    font-size:11px; color:var(--muted); letter-spacing:1px;}
  .chk{display:inline-flex; align-items:center; gap:5px; color:var(--muted); user-select:none; height:28px; font-size:12.5px;}
  .chk input{margin:0;}
  /* Same box as the Binary Editor's counter: a 28px inline block, so the "— / —" text
     is vertically centred on the buttons instead of sinking to the bottom of the group
     (the group aligns its children to flex-end, a bare inline span has no height of its
     own), and the spaces around the slash survive - a flex container would drop them. */
  #navPos{display:inline-block; flex:0 0 auto; min-width:64px; height:28px; line-height:28px;
    padding:0 6px; box-sizing:border-box; text-align:center; white-space:pre;
    font:600 12px/28px Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace;
    color:var(--muted); font-variant-numeric:tabular-nums;}
  #navPos b{color:var(--text);}
  #btnList.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:600;}

  /* ===== Body: one scroll container; pane heads, pane toolbars and the row grid share one set of columns ===== */
  #stage{flex:1 1 auto; min-height:0; position:relative; display:flex; overflow:hidden;}
  /* Native scrollbars are hidden everywhere: each pane draws its own (vertical + horizontal), both present, like the Binary Editor */
  #body{flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden; background:var(--panel); position:relative;
    font:12.5px/1.5 Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace; tab-size:4; scrollbar-width:none;}
  #body::-webkit-scrollbar{width:0; height:0;}
  #sticky{position:sticky; top:0; z-index:6; background:var(--panel);}
  #sticky.scrolled{box-shadow:0 3px 8px rgba(15,23,42,.10);}
  #paneHeads, #paneEntries{display:grid; grid-template-columns:26px 58px minmax(0,var(--aw,1fr)) 9px 26px 58px minmax(0,1fr);}

  /* ===== Pane frames + centre splitter (same as the Binary Editor) ===== */
  /* Each pane has a frame: 1px pale border normally, 2px accent on the active one (A blue / B purple) */
  .paneFrame{position:absolute; z-index:7; display:none; pointer-events:none;
    border:1px solid var(--soft-line-a); border-radius:2px;}
  .paneFrame.b{border-color:var(--soft-line-b);}
  .paneFrame.on{display:block;}
  .paneFrame.active{border:2px solid var(--accent);}
  .paneFrame.b.active{border-color:var(--curB);}
  /* The 9px splitter between the panes: a centre line plus a grip, with a left-right cursor */
  #paneSplit{position:absolute; top:0; bottom:0; left:0; width:9px; z-index:9; display:none;
    cursor:col-resize; background:var(--group-bg); touch-action:none;}
  #paneSplit.show{display:block;}
  #paneSplit::before{content:""; position:absolute; top:0; bottom:0; left:50%; width:1px; margin-left:-.5px;
    background:var(--split); transition:background .12s;}
  #paneSplit::after{content:""; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:3px; height:56px; border-radius:2px; background:var(--grip); opacity:.6;
    box-shadow:0 0 0 1px rgba(0,0,0,.06); transition:background .12s, height .12s, opacity .12s;}
  #paneSplit:hover::after, #paneSplit.dragging::after{background:var(--split-hi); height:112px; opacity:1;}
  #paneSplit:hover::before, #paneSplit.dragging::before{background:var(--split-hi);}
  #paneSplit.dragging{background:var(--row-alt);}
  body.resizing-col{user-select:none; cursor:col-resize;}

  /* ===== Scrollbars per pane (vertical on the right edge, horizontal at the bottom, both present) ===== */
  .rail{position:absolute; z-index:8; display:block; opacity:0; pointer-events:none; touch-action:none;}
  .rail.on{opacity:1; pointer-events:auto;}
  .rail.v{width:11px; cursor:default;}
  .rail.h{height:11px; cursor:default;}
  .rail .th{position:absolute; background:var(--thumb,rgba(120,130,150,.45)); border-radius:6px;}
  .rail.v .th{left:2px; right:2px; min-height:22px;}
  .rail.h .th{top:2px; bottom:2px; min-width:22px;}
  .rail:hover .th, .rail.drag .th{background:var(--thumb-hi,rgba(120,130,150,.78));}
  body.resizing-bar{user-select:none;}

  .paneHead{grid-column:1/4; display:flex; align-items:center; gap:7px; padding:4px 10px; height:28px; min-width:0;
    overflow:hidden; background:var(--head-bg); border-bottom:1px solid var(--line); font-family:Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace; font-size:12px;}
  #headB{grid-column:5/8;}
  /* Pane letter: bare coloured letter, the same way the Binary Editor's header draws it
     (it used to be a filled pill here, which made the two tools' headers look unrelated) */
  .paneHead .tag{font:700 12px/1 Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace;
    color:var(--curA); flex:none;}
  /* Side word: 11px muted, the Binary Editor's .lbl metrics */
  .paneHead .side{font-size:11px; color:var(--muted); flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis;}
  /* The separator is a real flex item, so the 7px gap puts exactly the same space on both sides */
  .paneHead .dot{color:var(--muted); font-weight:400; flex:none;}
  .paneHead .act{display:none; font-size:10.5px; font-weight:700; color:#fff; background:var(--curB);
    border-radius:4px; padding:2px 6px; flex:none;}
  .paneHead.dirty .act{display:inline-block;}
  .paneHead .phead{flex:1 1 auto; min-width:0; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis;}
  /* An empty signature must not leave a bare pill behind */
  .paneHead .sig:empty{display:none;}
  .paneHead .sig{flex:0 1 auto; min-width:0; font:11px Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace; color:var(--curA); background:var(--accent-soft);
    border:1px solid var(--soft-line-a); border-radius:4px; padding:2px 7px; white-space:nowrap;
    max-width:52%; overflow:hidden; text-overflow:ellipsis;}
  #headB .tag{color:var(--curB);}
  #headB .sig{color:var(--curB); background:var(--tint-b-head); border-color:var(--soft-line-b);}
  #headA.active{background:var(--tint-a-head); box-shadow:inset 2px 0 0 var(--curA);}
  #headB.active{background:var(--tint-b-head); box-shadow:inset 2px 0 0 var(--curB);}

  .paneEntry{grid-column:1/4; display:flex; align-items:center; gap:5px; flex-wrap:wrap; overflow:hidden;
    padding:6px 8px; border-bottom:1px solid var(--line); background:var(--soft-a);}
  #entryB{grid-column:5/8; background:var(--soft-b);}
  /* Same metrics as the Binary Editor's pane toolbar, so the two tools read alike. */
  .paneEntry button{height:27px; padding:0 7px; font-size:11.5px; border-radius:5px;
    flex:0 0 auto; white-space:nowrap; display:inline-flex; align-items:center; gap:4px;}
  .paneEntry button:disabled{opacity:.4; cursor:not-allowed;}
  .paneEntry button .ci{font-size:11.5px; line-height:1;}
  .paneEntry .sep{flex:0 0 auto; width:1px; height:16px; background:var(--line2); margin:0 4px;}
  /* "Open" is the busiest button in this row, but it no longer gets an A-blue / B-purple fill --
   two big colour blocks were too loud, sitting there like the rest of the row is enough (removed on request) */
  .paneEntry button.w{font-weight:600;}
  /* Same shrink rule as the Binary Editor, so the two pane toolbars wrap at the same width */
  @media (max-width:1180px){
    .paneEntry{gap:4px; padding:6px 6px;}
    .paneEntry button{padding:0 4px; font-size:11px;}
  }

  /* ===== Row grid ===== */
  #rows{padding-bottom:12px;}          /* Leave room for the horizontal bar at the bottom so it never covers the last row */
  #body .row{display:grid; grid-template-columns:26px 58px minmax(0,var(--aw,1fr)) 9px 26px 58px minmax(0,1fr);
    content-visibility:auto; contain-intrinsic-size:auto 19px;}
  /* Column 4 is the centre splitter: pane B's three cells must be placed explicitly on 5/6/7, otherwise they get squeezed into the 9px column */
  #body .row .gut.a{grid-column:1;}
  #body .row .ln.a{grid-column:2;}
  #body .row .code.a{grid-column:3;}
  #body .row .gut.b{grid-column:5;}
  #body .row .ln.b{grid-column:6;}
  #body .row .code.b{grid-column:7;}
  .gut{position:relative; background:var(--off-bg); border-right:1px solid var(--line2);}
  .gut.b{border-left:1px solid var(--split);}
  .gut i{display:none; position:absolute; left:16px; right:4px; top:0; bottom:0; background:var(--gut);
    border-radius:1.5px;}
  /* The whole-file diff strip on the left edge of a pane: red marks = differences, grey frame = the part on screen */
  .gutMap{position:absolute; left:0; width:14px; display:none; z-index:3; cursor:pointer; overflow:hidden;
    background:var(--off-bg); border-right:1px solid var(--line2);}
  .gutMap.show{display:block;}
  .gutMap.none{display:none;}
  .gutMap.b{border-left:1px solid var(--split);}
  .gutMap .gmBars i{position:absolute; left:3px; right:3px; background:var(--gut); border-radius:1px;
    pointer-events:none;}
  .gutMap .gmView{position:absolute; left:0; right:0; display:none; pointer-events:none;
    background:rgba(120,126,140,.30); border-top:1px solid rgba(110,118,135,.55);
    border-bottom:1px solid rgba(110,118,135,.55);}
  .gutMap .gmView.show{display:block;}
  .gutMap:hover .gmBars i{box-shadow:0 0 0 1px var(--panel);}
  .row.del .gut.a i, .row.mod .gut.a i, .row.ins .gut.b i, .row.mod .gut.b i{display:block;}
  .ln{text-align:right; padding:0 6px; color:var(--muted); background:var(--head-bg);
    border-right:1px solid var(--line2); user-select:none; overflow:hidden;}
  .code{padding:0 8px; white-space:pre; overflow:hidden; text-overflow:ellipsis;}
  /* The text is wrapped in .ctx: horizontal scrolling shifts that whole layer (each pane scrolls on its own) */
  .code .ctx{display:inline-block; vertical-align:top;}
  .code.a .ctx{transform:translateX(var(--hxA,0px));}
  .code.b .ctx{transform:translateX(var(--hxB,0px));}
  #body.wrap .code{white-space:pre-wrap; word-break:break-all; overflow:visible;}
  #body.wrap .code .ctx{display:inline; transform:none;}
  /* Inline editing: double-click (or Enter / F2) to edit the row in place */
  .code.edit{background:var(--input-bg) !important; box-shadow:inset 0 0 0 1.5px var(--accent);}
  .code.b.edit{box-shadow:inset 0 0 0 1.5px var(--curB);}
  .code.edit .ctx{outline:none; caret-color:var(--accent); min-width:2px; cursor:text;}
  .code.b.edit .ctx{caret-color:var(--curB);}
  .row.del .code.a{background:var(--del-bg);}
  .row.del .ln.a{background:var(--del-ln); color:var(--del-tx);}
  .row.ins .code.b{background:var(--ins-bg);}
  .row.ins .ln.b{background:var(--ins-ln); color:var(--ins-tx);}
  .row.mod .code.a{background:var(--del-bg);}
  .row.mod .code.b{background:var(--ins-bg);}
  .row.mod .ln.a{background:var(--del-ln); color:var(--del-tx);}
  .row.mod .ln.b{background:var(--ins-ln); color:var(--ins-tx);}
  /* Filler for the side that has no line (added / deleted rows).
     One hairline ruled through the middle of the row, on a faint tint. It is a single
     1px line per cell with NO diagonal pattern and NO per-row offset, so:
       - rows line up by construction (a horizontal rule cannot drift like a 45° hatch did,
         which is what made the first striped attempt shimmer),
       - nothing is per-cell computed: the old alignHatch() read offsetTop for every empty
         cell on every render, which forced a layout of the whole 600+ row list each time.
     A rule is also clearly not a glyph, unlike the dotted version that read as "·". */
  .code.empty{background-color:var(--empty-fill);
    background-image:linear-gradient(var(--empty-rule), var(--empty-rule));
    background-size:100% 1px; background-repeat:no-repeat; background-position:0 50%;}
  .code mark{background:var(--del-mark); color:inherit; border-radius:2px; padding:0;}
  .code.b mark{background:var(--ins-mark);}
  /* Selection: A blue, B purple, painted over the diff background */
  .row.sela .ln.a, .row.sela .code.a{background:var(--sel-a);}
  .row.selb .ln.b, .row.selb .code.b{background:var(--sel-b);}
  .row.cur{box-shadow:inset 0 0 0 1px var(--accent); background:var(--cur);}
  .row.first-diff .ln{border-top:1px solid var(--line2);}

  /* Empty state: no card frame, just one line of text and a button in the middle */
  #empty{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    pointer-events:none; padding:20px; z-index:10;}
  #empty .ecard{display:flex; flex-direction:column; align-items:center; gap:7px; text-align:center;
    color:var(--muted); font-size:12.5px; font-family:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif; max-width:min(420px,88%);}
  #empty b{color:var(--text); font-size:13.5px; font-weight:600;}
  #empty button{pointer-events:auto; margin-top:6px; height:28px; padding:0 12px;}
  #empty.hide{display:none;}

  /* ===== Diff list (bottom, draggable height) ===== */
  #diffSplit{display:none; flex:none; height:9px; cursor:ns-resize; align-items:center; justify-content:center;
    background:var(--group-bg); border-top:1px solid var(--line); position:relative; touch-action:none;}
  #diffSplit.show{display:flex;}
  #diffSplit::after{content:""; width:84px; height:4px; border-radius:2px; background:var(--grip);
    box-shadow:0 0 0 1px rgba(0,0,0,.06); transition:background .12s, width .12s;}
  #diffSplit:hover::after, #diffSplit.dragging::after{background:var(--split-hi); width:112px;}
  #diffSplit.dragging{background:var(--row-alt);}
  #diffPanel{display:none; flex-direction:column; flex:none; min-height:60px; max-height:60vh;
    background:var(--panel); border-top:2px solid var(--split);}
  #diffPanel.show{display:flex;}
  /* List header: only the centred "Diffs A vs B" (file names moved down to the header row, centred over
   the A / B columns), with the close button on the right. When collapsed it shows "A name -> B name"
   so it is still clear which two files are compared. */
  #diffPanel .dhead{padding:5px 10px; display:flex; align-items:center; justify-content:center;
    gap:8px; flex:none; position:relative;
    border-bottom:1px solid var(--line); background:var(--head-bg);}
  #diffPanel .dhead b{color:var(--text);}
  #diffPanel .dhead .sum{color:var(--muted); font-size:11.5px; font-family:Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace;}
  #diffPanel .dhead button{height:23px; padding:0 8px; font-size:11.5px; flex:none;}
  .dright{position:absolute; right:10px; top:50%; transform:translateY(-50%); display:flex; align-items:center; gap:6px;}
  .dmid{flex:0 1 auto; min-width:0; display:flex; align-items:center; gap:8px;}
  /* File-name summary, shown only while collapsed */
  #dFoldInfo{display:none; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #diffPanel.folded #dFoldInfo{display:inline;}
  #dFoldInfo .fa{color:var(--del-tx);}
  #dFoldInfo .fb{color:var(--ins-tx);}
  /* The list viewport: a scrolling list on top, the A and B horizontal drag bars floating underneath */
  #diffBody{flex:1 1 auto; min-height:0; position:relative; display:flex; flex-direction:column;}
  #diffList{flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden;
    font-family:Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace; font-size:12.5px;}
  /* Horizontal scrollbar inside a column: one under A, one under B, both draggable */
  .drail{position:absolute; bottom:2px; height:9px; z-index:6; opacity:0; pointer-events:none; touch-action:none;}
  .drail.on{opacity:1; pointer-events:auto;}
  .drail .th{position:absolute; top:1px; bottom:1px; min-width:24px; border-radius:5px;
    background:var(--thumb,rgba(120,130,150,.45));}
  .drail:hover .th, .drail.drag .th{background:var(--thumb-hi,rgba(120,130,150,.78));}
  #diffList::-webkit-scrollbar{width:12px;}
  #diffList::-webkit-scrollbar-thumb{
    background:var(--vscode-scrollbarSlider-background,rgba(120,130,150,.40));
    border:3px solid transparent; background-clip:content-box; border-radius:10px;}
  /* List columns: range / lines / A preview / B preview. The first three are pinned as narrow as possible,
   the last two take exactly half each -- flex 1 1 0 with min-width:0 never gets pushed out by long lines,
   so A and B of every row start at the same x. */
  #diffPanel{--c-range:104px; --c-cnt:30px; --c-idx:30px;}
  .dcols, .drow{display:flex; align-items:center; gap:8px; padding:0 8px; white-space:nowrap;}
  .dcols{height:22px; flex:none; color:var(--muted); font-size:11px; letter-spacing:.3px;
    background:var(--head-bg); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:2;
    font-family:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif;}
  .drow{min-height:22px; cursor:pointer; border-bottom:1px solid var(--line2); overflow:hidden;}
  .drow:hover{background-color:var(--row-alt);}
  .drow.cur{background-color:var(--accent-soft); box-shadow:inset 2px 0 0 var(--accent);}
  /* Column separators: four thin vertical lines at # | range | lines | A | B, positioned by
   placeColSeps() from the real column widths into --dx0/--dx1/--dx2/--dx3. Drawn as a background
   layer (no layout impact, unaffected by row height) so it runs the full height of the row. */
  .dcols, .drow{background-image:
      linear-gradient(var(--line), var(--line)),
      linear-gradient(var(--line), var(--line)),
      linear-gradient(var(--line), var(--line)),
      linear-gradient(var(--line), var(--line));
    background-repeat:no-repeat;
    background-size:1px 100%;
    background-position:var(--dx0,-99px) 0, var(--dx1,-99px) 0, var(--dx2,-99px) 0, var(--dx3,-99px) 0;
    background-origin:border-box;}
  .rng{flex:0 0 var(--c-range); display:flex; align-items:center; gap:3px; color:var(--text);
    font-weight:600; overflow:hidden;}
  /* Half each: when line numbers grow a digit the whole column widens (fitRangeCol), so text is never clipped to "132~1" */
  .rng .ra{flex:1 1 0; min-width:0; text-align:right; overflow:hidden; text-overflow:ellipsis;}
  .rng .arw{flex:none; width:10px; text-align:center; color:var(--muted); font-weight:400;}
  .rng .rb{flex:1 1 0; min-width:0; overflow:hidden; text-overflow:ellipsis;}
  .rng .nul{color:var(--muted); font-weight:400;}
  .cnt{flex:0 0 var(--c-cnt); text-align:center; color:var(--muted); font-variant-numeric:tabular-nums;}
  /* Row number in front of the range, so the ◀ / ▶ position can be read off the list */
  .idx{flex:0 0 var(--c-idx); text-align:center; color:var(--muted); font-weight:400;
    font-variant-numeric:tabular-nums; opacity:.8;}
  .drow.cur .idx{color:var(--accent); opacity:1; font-weight:600;}
  .pv{flex:1 1 0; min-width:0; display:flex; align-items:center; gap:6px; height:18px;
    padding:0 6px; border-radius:4px; overflow:hidden;}
  /* A / B widths split by --ga : --gb (1:1 by default); dragging the centre separator changes those ratios */
  .pv.a{background:var(--del-bg); color:var(--del-tx); flex-grow:var(--ga,1);}
  .pv.b{background:var(--ins-bg); color:var(--ins-tx); flex-grow:var(--gb,1);}
  .pv .tx{flex:1 1 0; min-width:0; overflow:hidden;}
  /* The inner layer shifts as a whole: every row of the column moves together (the drag bar is under the column, see .drail) */
  .pv .txin{display:inline-block; white-space:pre; vertical-align:top;}
  .pv.a .txin{transform:translateX(calc(-1 * var(--oxa,0px)));}
  .pv.b .txin{transform:translateX(calc(-1 * var(--oxb,0px)));}
  .dcols .h-range{flex:0 0 var(--c-range); text-align:center;}
  .dcols .h-cnt{flex:0 0 var(--c-cnt); text-align:center;}
  .dcols .h-idx{flex:0 0 var(--c-idx); text-align:center;}
  /* The A / B column headers are the file names, centred right above their own columns */
  .dcols .h-pv{flex:1 1 0; min-width:0; display:flex; align-items:center; justify-content:center; gap:5px;}
  .dcols .h-pv .hn{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .dcols .h-pv.a{color:var(--del-tx); flex-grow:var(--ga,1);}
  .dcols .h-pv.b{color:var(--ins-tx); flex-grow:var(--gb,1);}
  /* All four separators drag left / right (placeColSeps writes left, matching the four thin lines):
   0 = # | range -> row-number width; 1 = range | lines -> range width; 2 = lines | A -> lines width;
   3 = A | B -> the A/B split */
  .cgrip{position:absolute; top:0; bottom:0; width:11px; margin-left:-5px; z-index:4;
    cursor:col-resize; display:none; touch-action:none;}
  .cgrip.show{display:block;}
  .cgrip::after{content:""; position:absolute; left:5px; top:0; bottom:0; width:1px;
    background:transparent; transition:background .12s, width .12s;}
  .cgrip:hover::after, .cgrip.on::after{background:var(--accent); width:2px; left:4px;}
  /* One-click collapse: title bar only; click again to expand back to the previous height */
  #diffPanel.folded{height:auto !important; min-height:0; max-height:none;}
  #diffPanel.folded #diffBody{display:none;}

  /* ===== Status bar (same as the Binary Editor: A!=B chip + pane / caret / selection / mode) ===== */
  /* Font size, padding, gap and background all match the Binary Editor status bar, so both tools read as one product */
  #status{flex:none; display:flex; align-items:center; gap:18px; padding:6px 14px; overflow:hidden;
    background:var(--panel); border-top:1px solid var(--line);
    font-family:Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace;
    font-size:12px; color:var(--muted);}
  #status > span{white-space:nowrap; flex:0 0 auto;}
  #status .dot{font-style:normal; color:var(--muted); margin:0 5px;}
  #status b{color:var(--text); font-weight:600;}
  #status .k{color:var(--text);}
  #status .d{color:var(--del-tx);}
  #status .i{color:var(--ins-tx);}
  /* The hint takes the slack in the middle and ellipsises as the window narrows -- the stats on the right never get pushed out */
  #status .hint{flex:1 1 auto; min-width:0; color:var(--muted); opacity:.85;
    overflow:hidden; text-overflow:ellipsis;}
  #status .spacer{flex:0 1 auto; min-width:10px;}
  /* A = B / A != B chip: looks exactly like relchip in the Binary Editor */
  #status .relchip{font-weight:700; border-radius:4px; padding:1px 8px; font-size:11.5px;}
  #status .relchip.same{color:var(--same-fg); background:var(--same-bg); border:1px solid var(--same-line);}
  #status .relchip.diff{color:var(--diff2-fg); background:var(--diff2-bg); border:1px solid var(--diff2-line);}
  /* The narrower the window, the less important items drop out first (better one item fewer than half a word) */
  @media (max-width: 1180px){ #status .hint{display:none;} #status .spacer{flex:1 1 auto;} }
  @media (max-width: 980px){ #status .st-meta{display:none;} }
  @media (max-width: 840px){ #status .st-sel{display:none;} }

  /* ===== Drop overlay ===== */
  #dropHint{position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(37,99,235,.06); z-index:20; pointer-events:none;}
  #dropHint.show{display:flex;}
  #dropHint .dh-card{border:2px dashed var(--accent); border-radius:12px; background:var(--panel);
    padding:22px 30px; text-align:center; color:var(--text); font-size:13px; line-height:1.6;
    box-shadow:0 8px 24px rgba(0,0,0,.12);}
  #dropHint .dh-badge{display:inline-block; font:700 10.5px/1 Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace; color:#fff;
    background:var(--accent); border-radius:4px; padding:3px 6px; margin:0 2px;}
  #dropHint .dh-row1{font-weight:600;}
  #dropHint .dh-row2{margin-top:6px; font-size:11.5px; color:var(--muted);}
  #dropHint kbd{font:11px/1.4 Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace; padding:1px 5px; border-radius:4px;
    border:1px solid var(--line); background:var(--bg); color:var(--text);}

  /* ===== Context menu ===== */
  .ctxMenu{position:fixed; left:0; top:0; z-index:90; display:none; min-width:206px; padding:5px;
    background:var(--panel); border:1px solid var(--line); border-radius:9px;
    box-shadow:0 10px 30px rgba(15,23,42,.22), 0 2px 6px rgba(15,23,42,.08);}
  .ctxMenu.show{display:block;}
  .ctxMenu .ctxHead{display:flex; align-items:center; gap:6px; padding:3px 8px 6px; font-size:11px; color:var(--muted);}
  .ctxMenu .ctxHead .b{background:var(--curA); color:#fff; border-radius:4px; padding:1px 6px;
    font-weight:700; letter-spacing:.3px;}
  .ctxMenu .ctxHead.parB .b{background:var(--curB);}
  .ctxMenu button{display:flex; align-items:center; gap:9px; width:100%; height:29px; padding:0 10px;
    border:1px solid transparent; background:transparent; border-radius:6px; font-size:12.5px;
    color:var(--text); text-align:left; cursor:pointer; white-space:nowrap;}
  .ctxMenu button:hover:not(:disabled){background:var(--accent-soft); color:var(--accent); border-color:var(--soft-line-a);}
  .ctxMenu button.danger:hover:not(:disabled){background:var(--danger-bg); color:var(--danger); border-color:rgba(220,38,38,.45);}
  .ctxMenu button:disabled{opacity:.35; cursor:default;}
  .ctxMenu .sep{display:block; height:1px; margin:4px 6px; background:var(--line2);}

  /* ===== About ===== */
  #veil{position:fixed; inset:0; background:rgba(15,20,30,.42); display:none; align-items:center;
    justify-content:center; z-index:40;}
  #veil.show{display:flex;}
  .dlg{background:var(--panel); border:1px solid var(--line); border-radius:12px;
    box-shadow:0 18px 48px rgba(0,0,0,.28); width:min(600px,92vw); padding:18px 20px;}
  .dlg h3{display:flex; align-items:center; gap:8px; margin:0; font-size:17px;}
  .dlg h3 .vtag{font-size:11px; font-weight:600; color:#fff; background:var(--accent);
    border-radius:4px; padding:1px 7px;}
  .ab-date{margin-left:auto; font:600 11.5px/1 Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace; color:var(--accent);
    background:var(--accent-soft); border:1px solid var(--soft-line-a); border-radius:6px; padding:5px 9px;}
  .ab-blurb{font-size:12.5px; color:var(--muted); line-height:1.6; margin:8px 0 15px;}
  .ab-grid{display:grid; grid-template-columns:1fr 1fr; gap:13px 16px;}
  .ab-item{border-left:3px solid var(--soft-line-a); padding-left:10px;}
  .ab-item .t{font-size:12.5px; font-weight:700;}
  .ab-item .d{font-size:11.5px; color:var(--muted); line-height:1.55; margin-top:3px;}
  .ab-foot{margin-top:16px; padding-top:11px; border-top:1px solid var(--line2);
    font-size:12px; color:var(--muted); display:flex; gap:8px;}
  .ab-foot b{color:var(--text);}
  .btns{display:flex; justify-content:flex-end; gap:8px; margin-top:14px;}

  /* ===== Import dialog: two columns, A / B independent (same as the Binary Editor) ===== */
  .mask{position:fixed; inset:0; background:rgba(15,20,35,.45); display:none; align-items:center;
    justify-content:center; z-index:60;}
  .mask.show{display:flex;}
  .dlg.wide{width:min(1000px,96vw); max-height:92vh; overflow:auto;}
  .dlg > p{margin:4px 0 10px; color:var(--muted); font-size:12.5px; line-height:1.6;}
  .dlg > p b{color:var(--text);}
  .impGrid{display:flex; gap:14px; align-items:stretch;}
  .impCol{flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:6px;
    border:1.5px solid var(--soft-line-a); border-radius:10px; padding:10px; background:var(--soft-a);}
  .impCol.b{border-color:var(--soft-line-b); background:var(--soft-b);}
  .impCol.over{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
  .impCol.b.over{border-color:var(--curB);}
  .impCol .ch{display:flex; align-items:center; gap:8px; font-weight:700; font-size:12.5px;}
  .impCol .ch .bdg{color:#fff; background:var(--accent); border-radius:4px; padding:1px 7px; font-size:11px;}
  .impCol.b .ch .bdg{background:var(--curB);}
  .impCol .ch .len{color:var(--muted); font:11px Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace; font-weight:400;}
  .impCol textarea{
    width:100%; height:132px; font:12px Consolas,"Cascadia Mono","Courier New","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",monospace; color:var(--text);
    border:1px solid var(--line); border-radius:8px; padding:8px; resize:vertical;
    background:var(--input-bg); line-height:1.5; tab-size:4;
  }
  .impCol textarea:focus{outline:none; border-color:var(--accent);}
  .impCol textarea::placeholder{color:var(--muted); opacity:.9;}
  .impCol.b textarea:focus{border-color:var(--curB);}
  .impCol .row{display:flex; gap:6px;}
  .impCol .row button{flex:1 1 0; min-width:0; height:26px; font-size:12px; padding:0 6px;
    justify-content:center;}
  .impTag{display:none; margin-top:1px; font-size:11.5px; color:var(--accent); cursor:pointer;
    background:var(--accent-soft); border:1px solid var(--soft-line-a); border-radius:5px; padding:3px 7px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .impTag.show{display:block;}
  .impCol.b .impTag{color:var(--curB); border-color:var(--soft-line-b);}
  .impErr{min-height:16px; font-size:11.5px; color:var(--danger); font-weight:600;}
  .impFoot{display:flex; align-items:center; gap:8px; margin-top:12px;}
  .impFoot .hint{font-size:11.5px; color:var(--muted);}
  .impFoot .grow{flex:1;}

  /* ===== Toast at the top (same as the Binary Editor) ===== */
  #toastWrap{position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:80;
    display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; max-width:92vw;}
  .toast{display:flex; align-items:center; gap:8px; background:#0f172a; color:#fff; border-radius:8px;
    padding:8px 16px 8px 12px; font-size:13px;
    line-height:1.5; box-shadow:0 8px 26px rgba(0,0,0,.28); max-width:min(92vw,560px); animation:toastIn .16s ease-out;}
  /* A round icon on the left: check = success, exclamation = error, i = info (identical to the Binary Editor toast) */
  .toast .ic{flex:0 0 auto; width:17px; height:17px; border-radius:50%; background:rgba(255,255,255,.22);
    display:flex; align-items:center; justify-content:center; font:700 11.5px/1 "Segoe UI",Arial,sans-serif;}
  .toast .tx{min-width:0;}
  .toast.ok{background:#1d4ed8;}
  .toast.err{background:#dc2626;}
  @keyframes toastIn{from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:none;}}
</style>
</head>
<body>

<div id="titlebar">
  <span class="brand">⬡ Text Comparer</span>
  <button id="btnAbout" data-i18n-title="aboutTip" data-i18n="aboutBtn"></button>
  <span class="ver">__BB_VER__</span>
  <span class="spacer"></span>
  <span id="pill" data-i18n="pillEmpty"></span>
  <button id="btnLang" title="Switch language / 切换界面语言">EN</button>
</div>

<div id="toolbar">
  <div class="group"><span class="cap" data-i18n="capImport"></span>
    <button id="btnImport" data-i18n-title="importTip"><span class="ci">📥</span><span data-i18n="btnImport"></span></button>
  </div>

  <div class="group"><span class="cap" data-i18n="capCompare"></span>
    <button id="btnCompare" class="primary" data-i18n-title="compareTip" data-i18n="btnCompare"></button>
    <button id="btnPrev" data-i18n-title="prevTip">◀</button>
    <span id="navPos">— / —</span>
    <button id="btnNext" data-i18n-title="nextTip">▶</button>
    <button id="btnSwap" data-i18n-title="swapTip">⇄</button>
    <button id="btnList" data-i18n-title="listTip" data-i18n="btnList"></button>
  </div>

  <div class="group"><span class="cap" data-i18n="capEdit"></span>
    <button id="btnUndo" data-i18n-title="undoTip" data-i18n="btnUndo"></button>
    <button id="btnRedo" data-i18n-title="redoTip" data-i18n="btnRedo"></button>
  </div>

  <div class="group"><span class="cap" data-i18n="capOptions"></span>
    <label class="chk"><input type="checkbox" id="optWs" data-i18n-title="wsTip"><span data-i18n="optWs"></span></label>
    <label class="chk"><input type="checkbox" id="optCase"><span data-i18n="optCase"></span></label>
    <label class="chk"><input type="checkbox" id="optBlank"><span data-i18n="optBlank"></span></label>
    <label class="chk"><input type="checkbox" id="optWrap"><span data-i18n="optWrap"></span></label>
  </div>

  <div class="group"><span class="cap" data-i18n="capOutput"></span>
    <button id="btnCopy" data-i18n-title="copyTip" data-i18n="btnCopy"></button>
    <button id="btnSave" data-i18n-title="saveTip" data-i18n="btnSave"></button>
  </div>
</div>

<div id="stage">
<div id="body">
  <div id="sticky">
    <div id="paneHeads">
      <div class="paneHead" id="headA">
        <span class="tag">A</span>
        <span class="side" data-i18n="paneLeft"></span>
        <span class="act" data-i18n="editing"></span>
        <span class="dot">·</span>
        <span class="phead" id="nameA"></span>
        <span class="sig" id="metaA"></span>
      </div>
      <div class="paneHead" id="headB">
        <span class="tag">B</span>
        <span class="side" data-i18n="paneRight"></span>
        <span class="act" data-i18n="editing"></span>
        <span class="dot">·</span>
        <span class="phead" id="nameB"></span>
        <span class="sig" id="metaB"></span>
      </div>
    </div>

    <div id="paneEntries">
      <div class="paneEntry" id="entryA">
        <button id="openA" class="w" data-i18n-title="tipOpen"><span class="ci">📂</span><span data-i18n="eOpen"></span></button>
        <button id="saveA" data-i18n-title="tipSave"><span class="ci">💾</span><span data-i18n="eSave"></span></button>
        <button id="saveAsA" data-i18n-title="tipSaveAs"><span class="ci">📤</span><span data-i18n="eSaveAs"></span></button>
        <button id="clearA" data-i18n-title="tipClear"><span class="ci">🧹</span><span data-i18n="eClear"></span></button>
        <span class="sep"></span>

    el.nameB.title = b.path || b.name || '';
    /* Size chip only once there is something to size: an empty pane already says "Not loaded" */
    el.metaA.textContent = a.lines.length ? metaText(a.lines.length, a.bytes) : '';
    el.metaB.textContent = b.lines.length ? metaText(b.lines.length, b.bytes) : '';
    /* The badge only means something once there is content: an empty pane is not "being edited" */
    el.headA.classList.toggle('dirty', !!a.dirty && a.lines.length > 0);
    el.headB.classList.toggle('dirty', !!b.dirty && b.lines.length > 0);
    // File names live in the list header, centred above the A and B columns; when folded they move to the title bar
    var haCell = el.diffList.querySelector('.h-pv.a .hn');
    var hbCell = el.diffList.querySelector('.h-pv.b .hn');
    if (haCell) { haCell.textContent = a.name || t('noFile'); haCell.title = a.path || a.name || ''; }
    if (hbCell) { hbCell.textContent = b.name || t('noFile'); hbCell.title = b.path || b.name || ''; }
    if (el.dFoldInfo) {
      el.dFoldInfo.innerHTML = '<span class="fa">' + esc(a.name || t('noFile')) + '</span>'
        + ' → <span class="fb">' + esc(b.name || t('noFile')) + '</span>';

  }
  function updatePaneActive(){
    el.headA.classList.toggle('active', state.act === 'A');

      el.frameB.classList.toggle('active', state.act === 'B');

    updateStatus();
  }

  /* ===== Live fields of the bottom status bar =====
     Modelled on the Binary Editor one: A = B / A ≠ B chip · edit pane · caret · selection · mode,
     with "bytes / offset" swapped for "line". */
  function lineOfRow(side, idx){
    var r = state.rows[idx];
    if (!r) return null;
    var n = side === 'A' ? r.a : r.b;
    if (n == null) n = side === 'A' ? r.b : r.a;    // this side is empty (added / deleted), borrow the other side's number
    return n == null ? null : n;
  }
  function updateStatus(){
    if (!el.stRel) return;
    var a = state.a.lines.length, b = state.b.lines.length;
    el.stRel.className = '';
    if (!a && !b) {
      el.stRel.textContent = '';
    } else if (!state.hunks.length) {
      el.stRel.className = 'relchip same'; el.stRel.textContent = 'A = B';
    } else {
      el.stRel.className = 'relchip diff'; el.stRel.textContent = 'A ≠ B';
    }

    el.stAct.textContent = state.act;
    /* A blue, B purple — the same identity colours the pane tags use, never the
       theme button colour (that one can be orange in someone's theme).
       Red / green stay reserved for content meaning (removed / added). */
    el.stAct.style.color = state.act === 'A' ? 'var(--curA)' : 'var(--curB)';

    /* Diff position, in the same slot the Binary Editor puts it. */
    var nHunks = state.hunks.length;
    if (el.stPos) {
      el.stPos.textContent = nHunks
        ? (state.cur >= 0 ? state.cur + 1 : 0) + ' / ' + nHunks
        : '—';
    }

    var s = state.sel, ln = s ? lineOfRow(s.side, s.focus) : null;
    el.stCur.textContent = ln == null ? '—' : fill(t('stLn'), { n: ln });

    if (!s) {
      el.stSel.textContent = '—';
    } else {
      var lo = Math.min(s.anchor, s.focus), hi = Math.max(s.anchor, s.focus);
      var cnt = hi - lo + 1;
      if (cnt === 1) {
        el.stSel.textContent = fill(t('stLn1'), { a: ln });
      } else {
        el.stSel.textContent = fill(t('stLnRange'),
          { a: lineOfRow(s.side, lo), b: lineOfRow(s.side, hi), n: cnt });
      }
    }
    el.stMode.textContent = state.edit ? t('stModeEdit') : t('stModeView');
    /* Browse mode used to be muted (looked like a missing value) - use body colour like every other field, accent while editing */
    el.stMode.style.color = state.edit ? 'var(--accent)' : 'var(--text)';
  }

  /* Empty pane = every button in that pane's strip is dead, exactly like the
     Binary Editor. Only "Open" stays live, because that is how you fill it. */
  function updatePaneGates(){
    ['A', 'B'].forEach(function(p){
      var s = p === 'A' ? state.a : state.b;
      var has = !!(s && (s.lines.length || s.name));
      ['save', 'saveAs', 'clear', 'cut', 'copy', 'paste', 'del'].forEach(function(k){
        var b = $('' + k + p);
        if (b) b.disabled = !has;
      });
    });
  }

  function updateStats(){
    el.stA.textContent = 'A: ' + metaText(state.a.lines.length, state.a.bytes);
    el.stB.textContent = 'B: ' + metaText(state.b.lines.length, state.b.bytes);
    var n = state.hunks.length;
    /* The status bar is the Binary Editor one, item for item: no running commentary
       and no added/removed summary on the right, only the live fields. */
    if (el.stHint) el.stHint.textContent = '';
    if (el.stSum) el.stSum.textContent = '';

    el.pill.classList.remove('diff', 'same');
    if (!state.a.lines.length && !state.b.lines.length) {
      el.pill.textContent = t('pillEmpty');
    } else if (state.oneSide) {
      /* One side cleared / not loaded yet: there is nothing to compare, and saying "A = B" here
         would be a lie */
      el.pill.textContent = t('pillOneSide');
    } else if (!n) {
      el.pill.textContent = t('pillSame');
      el.pill.classList.add('same');
    } else {
      el.pill.textContent = fill(t('pillDiff'), { n: n });
      el.pill.classList.add('diff');
    }

    el.empty.classList.toggle('hide', !empty);
    centerEmpty();
    el.btnPrev.disabled = el.btnNext.disabled = !n;
    el.btnCopy.disabled = el.btnSave.disabled = !n;
    updateUndoBtns();
    updatePaneGates();
    updateStatus();
    /* Report both panes to the host whenever content changes: splits / moved groups restore from it (see __tcSnap below) */
    if (state.a.lines.length || state.b.lines.length) tcHadContent = true;
    if (window.__tcSnap) window.__tcSnap();
  }

  function gotoHunk(idx, scroll, noList){
    if (idx < 0 || idx >= state.hunks.length) return;
    state.cur = idx;

    markCurrent();
    if (scroll) {
      var h = state.hunks[idx];
      var row = rowNode(h.row);
      if (row) {
        var top = row.offsetTop - el.body.clientHeight / 3;
        el.body.scrollTop = Math.max(0, top);
      }

    if (!noList) markListRow();
  }

  /* ================= diff list ================= */
  function renderList(){
    el.diffList.innerHTML = '';
    var n = state.hunks.length;
    if (!n) {
      /* "Identical" only when both sides were actually compared; one loaded side is not a match */
      el.diffSummary.textContent = state.oneSide ? t('diffNone')
        : ((state.a.lines.length || state.b.lines.length) ? t('diffSame') : t('diffNone'));
      hideEmptyList();
      return;
    }
    el.diffSummary.textContent = '';     // the title keeps only "Diffs", no trailing "N diff region(s)"
    if (state.sameHidden) {              // last round was identical and the panel got hidden: differences are back, restore it
      state.sameHidden = false;
      if (state.listOpen) openList();
    }

    var frag = document.createDocumentFragment();

    // Column headers: number | range | line count | A file name (centred) | B file name (centred)
    var head = document.createElement('div');
    head.className = 'dcols';
    head.appendChild(headText('h-idx', '#'));
    head.appendChild(headText('h-range', t('colRange')));
    head.appendChild(headText('h-cnt', t('colLines')));
    head.appendChild(headFile('a', state.a));
    head.appendChild(headFile('b', state.b));
    frag.appendChild(head);

    fitRangeCol();

    var upto = Math.min(n, LIST_CAP);
    for (var k = 0; k < upto; k++) {
      var h = state.hunks[k];
      var d = document.createElement('div');
      d.className = 'drow' + (k === state.cur ? ' cur' : '');
      d.dataset.h = String(k);

      var aFrom = h.a0 != null ? h.a0 : h.a1, aTo = h.a1 != null ? h.a1 : h.a0;
      var bFrom = h.b0 != null ? h.b0 : h.b1, bTo = h.b1 != null ? h.b1 : h.b0;

      var rg = document.createElement('span');
      rg.className = 'rng';
      rg.appendChild(rangeCell(aFrom, aTo, 'ra'));
      var arw = document.createElement('span');
      arw.className = 'arw'; arw.textContent = '→';
      rg.appendChild(arw);
      rg.appendChild(rangeCell(bFrom, bTo, 'rb'));

      var cnt = document.createElement('span');
      cnt.className = 'cnt';
      cnt.textContent = String(h.del + h.ins + h.mod);

      var idx = document.createElement('span');
      idx.className = 'idx';
      idx.textContent = String(k + 1);

      d.appendChild(idx); d.appendChild(rg); d.appendChild(cnt);
      d.appendChild(previewCell('a', preview(h, 'a')));
      d.appendChild(previewCell('b', preview(h, 'b')));
      frag.appendChild(d);
    }
    el.diffList.appendChild(frag);
    if (state.listOpen) openList(); else placeColSeps();
    // The vertical scrollbar only appears once rows fill the box and narrows the columns - measure again next frame
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(layoutDiff);
    else layoutDiff();
  }

  /* ================= per-column horizontal scroll for the list's A / B columns =================
     One offset per column (the whole column shifts together), driven by the thin bar underneath.
     oxMax = pixels by which the longest line overflows the visible width; 0 means it fits, no bar. */
  var ox = { a: 0, b: 0 }, oxMax = { a: 0, b: 0 };

  function applyOx(){
    el.diffList.style.setProperty('--oxa', ox.a.toFixed(0) + 'px');
    el.diffList.style.setProperty('--oxb', ox.b.toFixed(0) + 'px');
  }
  function measureOx(){
    if (!el.diffPanel.classList.contains('show')) return;   // measuring while hidden gives all zeros
    var mx = { a: 0, b: 0 };
    var cells = el.diffList.querySelectorAll('.pv');
    for (var i = 0; i < cells.length; i++) {
      var pv = cells[i];
      var k = pv.classList.contains('a') ? 'a' : 'b';
      var box = pv.firstChild, inn = box && box.firstChild;
      if (!box || !inn) continue;
      var extra = Math.ceil(inn.getBoundingClientRect().width - box.clientWidth);
      if (extra > mx[k]) mx[k] = extra;
    }
    oxMax.a = Math.max(0, mx.a);
    oxMax.b = Math.max(0, mx.b);
    ox.a = Math.min(ox.a, oxMax.a);
    ox.b = Math.min(ox.b, oxMax.b);
    applyOx();
  }
  function paintDiffRails(){
    if (!el.dRailA || !el.dRailB) return;
    var list = [['a', el.dRailA, el.dThA], ['b', el.dRailB, el.dThB]];
    for (var i = 0; i < list.length; i++) {
      var k = list[i][0], rail = list[i][1], th = list[i][2];
      var rw = rail.clientWidth, mx = oxMax[k];
      var on = rw > 24 && mx > 0 && state.listOpen && !state.folded;
      rail.classList.toggle('on', on);
      if (!on) continue;
      var thW = Math.max(24, Math.round(rw / (rw + mx) * rw));
      var travel = Math.max(1, rw - thW);
      th.style.width = thW + 'px';
      th.style.left = Math.round((ox[k] / mx) * travel) + 'px';
    }
  }
  /* Position the two bars against the real widths of the header's A / B columns */
  function placeDiffRails(){
    if (!el.diffBody || !el.dRailA) return;
    var head = el.diffList.querySelector('.dcols');
    if (!head) return;
    var ha = head.querySelector('.h-pv.a'), hb = head.querySelector('.h-pv.b');
    if (!ha || !hb) return;
    var box = el.diffBody.getBoundingClientRect();
    var ra = ha.getBoundingClientRect(), rb = hb.getBoundingClientRect();
    el.dRailA.style.left = Math.round(ra.left - box.left + 4) + 'px';
    el.dRailA.style.width = Math.max(0, Math.round(ra.width - 8)) + 'px';
    el.dRailB.style.left = Math.round(rb.left - box.left + 4) + 'px';
    el.dRailB.style.width = Math.max(0, Math.round(rb.width - 8)) + 'px';
    paintDiffRails();
  }
  function layoutDiff(){
    placeColSeps();
    measureOx();
    placeDiffRails();
  }
  function bindDiffRail(rail, th, k){
    var drag = false, x0 = 0, v0 = 0, travel = 1, range = 1;
    rail.addEventListener('mousedown', function(e){
      if (e.button !== 0 || !rail.classList.contains('on')) return;
      e.preventDefault();
      var rr = rail.getBoundingClientRect(), tr = th.getBoundingClientRect();
      travel = Math.max(1, rr.width - tr.width);
      range = Math.max(1, oxMax[k]);
      if (e.target !== th) {
        var want = (e.clientX - rr.left - tr.width / 2) / travel;
        ox[k] = Math.max(0, Math.min(range, want * range)); applyOx(); paintDiffRails();
      }
      drag = true; x0 = e.clientX; v0 = ox[k];
      rail.classList.add('drag'); document.body.classList.add('resizing-bar');
    });
    window.addEventListener('mousemove', function(e){
      if (!drag) return;
      ox[k] = Math.max(0, Math.min(range, v0 + (e.clientX - x0) / travel * range));
      applyOx(); paintDiffRails();
    });
    function stop(){
      if (!drag) return;
      drag = false; rail.classList.remove('drag'); document.body.classList.remove('resizing-bar');
    }
    window.addEventListener('mouseup', stop);
    window.addEventListener('blur', stop);
  }

  /* Separator positions are computed from the header's real column widths and written to #diffList
     as --dx1/2/3; rows and header both inherit them, so each column reads as one unbroken hairline */
  function placeColSeps(){
    var head = el.diffList.querySelector('.dcols');
    if (!head || !head.getClientRects().length) return;
    var hi = head.querySelector('.h-idx'),
        hr = head.querySelector('.h-range'), hc = head.querySelector('.h-cnt'),
        ha = head.querySelector('.h-pv.a'), hb = head.querySelector('.h-pv.b');
    if (!hi || !hr || !hc || !ha || !hb) return;
    var base = head.getBoundingClientRect().left;
    var x0 = Math.round(hi.getBoundingClientRect().right + 4 - base);
    var x1 = Math.round(hr.getBoundingClientRect().right + 4 - base);
    var x2 = Math.round(hc.getBoundingClientRect().right + 4 - base);
    var x3 = Math.round((ha.getBoundingClientRect().right + hb.getBoundingClientRect().left) / 2 - base);
    el.diffList.style.setProperty('--dx0', x0 + 'px');
    el.diffList.style.setProperty('--dx1', x1 + 'px');
    el.diffList.style.setProperty('--dx2', x2 + 'px');
    el.diffList.style.setProperty('--dx3', x3 + 'px');
    // Four draggable grips sitting on those hairlines, grabbable over the full column height
    var off = Math.round(base - el.diffBody.getBoundingClientRect().left);
    var can = state.listOpen && !state.folded;
    var gs = [[el.grip0, x0], [el.grip1, x1], [el.grip2, x2], [el.grip3, x3]];
    for (var gi = 0; gi < gs.length; gi++) {
      var g = gs[gi][0];
      if (!g) continue;
      g.style.left = (off + gs[gi][1]) + 'px';
      g.classList.toggle('show', can);
    }
  }
  function rangeCell(from, to, cls){
    var s = document.createElement('span');
    s.className = cls + (from == null ? ' nul' : '');
    s.textContent = from == null ? '—' : rangeTxt(from, to);
    return s;
  }
  function previewCell(side, text){
    var sp = document.createElement('span');
    sp.className = 'pv ' + side;
    var tx = document.createElement('span');
    tx.className = 'tx';
    var inn = document.createElement('span');
    inn.className = 'txin';
    inn.textContent = text;
    tx.appendChild(inn);
    sp.appendChild(tx);
    sp.title = text;
    return sp;
  }
  function headText(cls, label){
    var s = document.createElement('span');
    s.className = cls;
    s.textContent = label;
    return s;
  }
  // Header A / B cells: a small block plus the file name, centred over the column
  function headFile(side, f){
    var sp = document.createElement('span');
    sp.className = 'h-pv ' + side;
    var nm = document.createElement('span');
    nm.className = 'hn';
    nm.textContent = f.name || t('noFile');
    nm.title = f.path || f.name || '';
    sp.appendChild(nm);
    return sp;
  }
  function rangeTxt(a, b){
    if (a == null && b == null) return '—';
    if (a === b) return String(a);
    return a + '–' + b;
  }
  function preview(h, key){
    // First non-empty line of the hunk, truncated when too long
    var i, v = null;
    for (i = h.row; i < state.rows.length && state.rows[i].t !== 'eq'; i++) {
      v = key === 'a' ? state.rows[i].at : state.rows[i].bt;
      if (v != null && String(v).trim() !== '') break;
    }
    if (v == null) return '—';
    var s = String(v).replace(/^\s+|\s+$/g, '');
    if (s.length > 160) s = s.slice(0, 160) + '…';
    return s === '' ? '∅' : s;
  }
  function markListRow(){
    var old = el.diffList.querySelector('.drow.cur');
    if (old) old.classList.remove('cur');
    var d = el.diffList.querySelector('.drow[data-h="' + state.cur + '"]');
    if (d) {
      d.classList.add('cur');
      if (d.scrollIntoView) { try { d.scrollIntoView({ block: 'nearest' }); } catch (e) {} }
    }
  }
  function openList(){
    state.listOpen = true;
    el.diffPanel.classList.add('show');
    el.diffSplit.classList.toggle('show', !state.folded);
    el.diffPanel.style.height = state.listH + 'px';
    el.btnList.classList.add('on');
    fitRangeCol();
    syncFoldBtn();
    savePrefs();
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(layoutDiff);
    else layoutDiff();
  }
  /* When the content is identical (or not compared yet) the diff list goes away with its title bar:
     no height and no splitter left behind, or a big empty box hangs below the editor.
     Display only - state.listOpen is untouched, so the panel comes back on the next real difference. */
  function hideEmptyList(){
    if (state.sameHidden && !el.diffPanel.classList.contains('show')) return;
    state.sameHidden = true;
    state.folded = false;
    el.diffPanel.classList.remove('show', 'folded');
    el.diffSplit.classList.remove('show');
    el.btnList.classList.remove('on');
  }
  function closeList(){
    state.listOpen = false;
    state.folded = false;
    el.diffPanel.classList.remove('show', 'folded');
    el.diffSplit.classList.remove('show');
    el.btnList.classList.remove('on');
    syncFoldBtn();
    savePrefs();
  }

  /* ===== Fold / unfold: folding leaves only the title bar (difference count and file names stay visible) =====
     The small triangle button in the toolbar is gone, so clicking the title bar's blank area is the only way back */
  function syncFoldBtn(){ /* no button left to sync; kept so existing call sites stay valid */ }
  function foldList(){
    if (!state.listOpen) { openList(); }
    state.folded = true;
    el.diffPanel.classList.add('folded');
    el.diffSplit.classList.remove('show');     // no height dragging while folded
    syncFoldBtn();
    savePrefs();
  }
  function unfoldList(){
    state.folded = false;
    el.diffPanel.classList.remove('folded');
    if (!state.listOpen) { openList(); return; }
    el.diffSplit.classList.add('show');
    el.diffPanel.style.height = state.listH + 'px';
    fitRangeCol();
    syncFoldBtn();
    savePrefs();
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(layoutDiff);
    else layoutDiff();
  }
  function toggleFold(){ if (state.folded || !state.listOpen) unfoldList(); else foldList(); }

  /* ===== A → B column widths: auto-sized from the line-number digits, still draggable by hand ===== */
  function autoRangeW(){
    var mx = Math.max(state.a.lines.length, state.b.lines.length, 1);
    var d = String(mx).length;
    var cw = charW > 0 ? charW : 7.5;              // the list uses the same monospace stack as the body
    var cell = Math.ceil((2 * d + 1) * cw) + 8;    // widest form is "1719–1721"
    return Math.min(220, Math.max(96, cell * 2 + 18));
  }
  function curRangeW(){
    var v = parseFloat(getComputedStyle(el.diffPanel).getPropertyValue('--c-range'));
    return v > 0 ? v : 104;
  }
  function curCntW(){
    var v = parseFloat(getComputedStyle(el.diffPanel).getPropertyValue('--c-cnt'));
    return v > 0 ? v : 30;
  }
  function curIdxW(){
    var v = parseFloat(getComputedStyle(el.diffPanel).getPropertyValue('--c-idx'));
    return v > 0 ? v : 30;
  }
  /* All four column widths are derived from state and written to CSS variables: row number / range / count / A's share */
  function applyColWidths(){
    var idx = state.idxW > 0 ? Math.max(22, Math.min(96, state.idxW)) : 30;
    var range = state.rangeW > 0 ? Math.max(80, Math.min(460, state.rangeW)) : autoRangeW();
    var cnt = state.cntW > 0 ? Math.max(24, Math.min(140, state.cntW)) : 30;
    var f = Math.min(0.9, Math.max(0.1, state.abFrac));
    el.diffPanel.style.setProperty('--c-idx', Math.round(idx) + 'px');
    el.diffPanel.style.setProperty('--c-range', Math.round(range) + 'px');
    el.diffPanel.style.setProperty('--c-cnt', Math.round(cnt) + 'px');
    el.diffPanel.style.setProperty('--ga', (f * 1000).toFixed(1));
    el.diffPanel.style.setProperty('--gb', ((1 - f) * 1000).toFixed(1));
    return range;
  }
  function fitRangeCol(){
    var want = applyColWidths();
    placeColSeps();               // widths changed, so move the separators with them
    return want;
  }

  /* ================= unified diff (copy / save) ================= */
  function unifiedDiff(){
    var rows = state.rows, C = 3;
    var head = '--- ' + (state.a.name || 'A') + '\n+++ ' + (state.b.name || 'B') + '\n';
    var changes = [], i;
    for (i = 0; i < rows.length; i++) if (rows[i].t !== 'eq') changes.push(i);
    if (!changes.length) return head;

    var groups = [], start = changes[0], prev = changes[0];
    for (i = 1; i < changes.length; i++) {
      if (changes[i] - prev <= 2 * C + 1) { prev = changes[i]; continue; }
      groups.push([start, prev]); start = prev = changes[i];
    }
    groups.push([start, prev]);

    var out = [head];
    groups.forEach(function(g){
      var s = Math.max(0, g[0] - C), e = Math.min(rows.length - 1, g[1] + C);
      var oldStart = 0, newStart = 0, oldCount = 0, newCount = 0, k;
      for (k = s; k <= e; k++) {
        if (rows[k].a != null) { if (!oldStart) oldStart = rows[k].a; oldCount++; }
        if (rows[k].b != null) { if (!newStart) newStart = rows[k].b; newCount++; }
      }
      out.push('@@ -' + oldStart + ',' + oldCount + ' +' + newStart + ',' + newCount + ' @@\n');
      for (k = s; k <= e; k++) {
        var r = rows[k];
        if (r.t === 'eq') out.push(' ' + (r.at == null ? '' : r.at) + '\n');

  /* ---------- drag & drop: VS Code explorer / OS files ---------- */
  /* dataTransfer is locked during a drag (files is empty, types may be just "Files"), so dragenter /
     dragover always preventDefault to claim the drop and the content is inspected on drop.
     Content can come from four sources, tried in order of reliability:
       1) a path in uri-list / text/plain -> handed to the host, which returns a path Save can write back to
       2) File.path set (Electron files dragged from the OS explorer) -> also handed to the host
       3) a readable File object -> decoded in the panel, following the BOM
       4) name only, no content -> have the host search the project by file name + size */
  function collectUris(dt){
    var out = [];
    var looksPath = function(v){
      return /^(file:|vscode-file:|vscode-remote:|[a-zA-Z]:[\\/]|\/|\\\\)/.test(String(v || '').trim());
    };
    var push = function(v){ var t = String(v || '').trim(); if (t && t !== 'undefined' && !/^#/.test(t)) out.push(t); };
    // One URI per line, but it can also be JSON (VS Code's application/vnd.code.uri-list is a JSON array)
    var add = function(raw){
      var s = String(raw || '').trim();
      if (!s) return;
      if (s.charAt(0) === '[' || s.charAt(0) === '{') {
        var got = 0;
        try {
          var walk = function(v){
            if (!v) return;
            if (typeof v === 'string') { if (looksPath(v)) { push(v); got++; } return; }
            if (Array.isArray(v)) { v.forEach(walk); return; }
            if (typeof v === 'object') { ['fsPath', 'path', 'external', 'uri', 'resource'].forEach(function(k){ if (v[k]) walk(v[k]); }); }
          };
          walk(JSON.parse(s));
        } catch (_) {}
        if (got) return;
        // not valid JSON: fish the paths out with a regex
        var m, re = /"(?:fsPath|path|external)"\s*:\s*"([^"]+)"/g;
        while ((m = re.exec(s))) { push(m[1].replace(/\\\\/g, '\\')); got++; }
        if (got) return;
      }
      s.split(/\r?\n/).forEach(function(x){
        x = x.trim();
        if (/^[\[{]/.test(x)) return;
        if (looksPath(x)) push(x);
      });
    };
    var types = [];
    try { types = Array.prototype.map.call((dt && dt.types) || [], function(x){ return String(x); }); } catch (_) {}
    // Read the known MIME types first, then every custom one as well (VS Code has renamed them a few times)
    var known = ['text/uri-list', 'application/vnd.code.uri-list', 'resourceURLs', 'codefiles', 'text/plain'];
    var all = known.concat(types.filter(function(t){ return known.indexOf(t) < 0; }));
    for (var i = 0; i < all.length; i++) {
      try { var v = dt.getData(all[i]); if (v) add(v); } catch (_) {}
      if (out.length) break;
    }
    return Array.from(new Set(out));
  }
  function dropFiles(dt){
    var out = [];
    try { out = Array.prototype.slice.call((dt && dt.files) || []); } catch (_) { out = []; }
    if (!out.length && dt && dt.items) {
      try {
        Array.prototype.forEach.call(dt.items, function(it){
          if (it.kind === 'file' && it.getAsFile) { var f = it.getAsFile(); if (f) out.push(f); }
        });

    }

  }
  function dropTypes(dt){
    try { return Array.prototype.map.call((dt && dt.types) || [], String).join(', '); } catch (_) { return ''; }
  }
  /* Decode inside the panel (used when the File object has no path); BOM rules match the host */
  function decodeDropped(buf){
    var u8 = new Uint8Array(buf);
    try {

        return { text: new TextDecoder('utf-16le').decode(u8.subarray(2)), enc: 'UTF-16LE' };
      }
      if (u8.length >= 2 && u8[0] === 0xFE && u8[1] === 0xFF) {

  /* Where a single dropped file goes. The empty pane wins, but a file that is already on one

     produced a diff of a file against itself. */
  function paneFor(altKey, path){
    var p = String(path || '').toLowerCase();
    var sameA = !!p && String(state.a.path || '').toLowerCase() === p;
    var sameB = !!p && String(state.b.path || '').toLowerCase() === p;
    if (sameA) return 'A';
    if (sameB) return 'B';
    if (altKey) return 'B';

    if (!state.b.lines.length) return 'B';
    return 'B';                       // both sides busy: the new file replaces the right-hand side
  }
  /* Dropped content is decoded -> decide where it goes: a box in the dialog / one pane / both panes */
  function applyDropped(items, boxSide, altKey){
    if (!items.length) return;
    // The content came out of a File object (no path) -> have the host recover the source path by name + size,
    // so Save can write back to the original file just like Open
    function askPath(it, pane, box){

      vscode.postMessage({ type: 'resolvePath', name: it.name, bytes: it.bytes || 0, pane: pane, dialog: box || '' });
    }
    if (boxSide) {
      fillImp(boxSide, items[0]);
      updateImpLen();
      askPath(items[0], boxSide, boxSide);
      toast(fill(t('msgDropBox'), { n: items[0].name || '', p: boxSide }));
      return;
    }
    if (items.length >= 2) {
      loadBoth(items[0], items[1]);
      askPath(items[0], 'A');
      askPath(items[1], 'B');
      toast(fill(t('msgDropFiles'), { n: 2 }), 'ok');
      return;
    }
    var one = paneFor(altKey, items[0] && items[0].path);
    setSide(one, items[0]);

  function dropByContent(files, boxSide, altKey, dtTypes){

      return f.arrayBuffer().then(function(buf){
        if (!buf || !buf.byteLength) return null;

        return { name: f.name || 'dropped.txt', text: d.text, enc: d.enc, bytes: buf.byteLength, path: '' };

      if (ok.length) { applyDropped(ok, boxSide, altKey); return; }

      var names = use.map(function(f){ return f.name || ''; }).filter(Boolean);

  }
  var dragDepth = 0;
  function impSideOf(node){
    if (!el.impMask.classList.contains('show') || !node || !node.closest) return null;
    var col = node.closest('.impCol');
    if (!col) return null;
    return col.classList.contains('b') ? 'B' : 'A';
  }
  document.addEventListener('dragenter', function(e){
    e.preventDefault(); e.stopPropagation();

    if (files.length) { dropByContent(files, boxSide, e.altKey, dropTypes(dt)); return; }

    var txt = '';

  /* ---------- host messages ---------- */
  window.addEventListener('message', function(ev){

        setSide(m.pane === 'B' ? 'B' : 'A', m); break;
      case 'loadBoth':
        if (m.dialog) { fillImp('A', m.a); fillImp('B', m.b); break; }
        loadBoth(m.a, m.b); break;
      case 'clipboard':
        if (m.purpose === 'paste') { applyPaste(m.text); break; }
        if (m.purpose === 'import') {
          var cp = m.pane === 'B' ? 'B' : 'A';
          if (m.text == null || m.text === '') { toast(t('msgClipEmpty'), 'err'); break; }
          fillImp(cp, { text: m.text, name: cp === 'A' ? 'clipboard.txt' : 'clipboard(B).txt' });
          toast(fill(t('msgClipIn'), { p: cp }), 'ok');
          break;
        }
        if (m.text == null || m.text === '') { toast(t('msgClipEmpty')); break; }
        setSide(m.pane === 'B' ? 'B' : 'A', { text: m.text, name: m.name || '' });
        break;
      case 'saved':     toast(fill(t('msgSaved'), { p: m.path || '' }), 'ok'); break;
      case 'savedPane': {

        s.path = String(m.path || '');

  /* ---------- language / preferences ---------- */
  function applyLang(){

      n.innerHTML = t(n.getAttribute('data-i18n-html'));

      n.placeholder = t(n.getAttribute('data-i18n-ph'));

      el.grip3.title = t('colSplitTip');

    // The list header labels (range / line count) are composed strings, so repaint them on language change

  var tcHadContent = false;
  /* Fallback copy: if the state does not make it into a rebuilt webview, this one can still be recovered */
  var SNAP_KEY = 'biosBuddy.tcSnap';
  /* Snapshot format version: copies written before this build carry no version and are dropped on
     sight, so a pair the user cleared before the upgrade does not come back after Reload Window. */
  var SNAP_V = 2;
  function snapOk(v){ return !!v && v.v === SNAP_V; }
  function savePrefs(){
    vscode.setState({ lang: lang, ws: state.opts.ws, case: state.opts.case, blank: state.opts.blank,
      wrap: state.opts.wrap, listH: state.listH, listOpen: state.listOpen,
      folded: state.folded, rangeW: state.rangeW, cntW: state.cntW, idxW: state.idxW, abFrac: state.abFrac,
      snap: lastSnap });
  }

  /* ---------- state snapshot (safety net for Split Editor / moving a tab to another group) ----------
     A rebuilt webview is a fresh page, so both panes are gone. Every content change reports the two
     panes (name / path / text / encoding) to the host, which pushes them back on ready - looking seamless. */
  var snapT = 0;
  function oneSnap(s){
    if (!s.lines.length && !s.name) return null;
    var text = sideText(s);
    return {
      name: s.name || '', path: s.path || '', enc: s.enc || 'UTF-8',
      bytes: text.length ? new Blob([text]).size : (+s.bytes || 0),
      text: text
    };
  }
  window.__tcSnap = function(immediate){
    clearTimeout(snapT);
    var empty = !state.a.lines.length && !state.b.lines.length;
    if (immediate || empty) { snapNow(); return; }
    snapT = setTimeout(snapNow, 600);
  };
  function snapNow(){
      try{
        if ((+state.a.bytes || 0) + (+state.b.bytes || 0) > 8 * 1024 * 1024) return;   // too large to shuttle around
        var a = oneSnap(state.a), b = oneSnap(state.b);
        if (!a && !b) {
          /* Both sides cleared on purpose: forget the saved pair, otherwise reopening the tool
             pushes the old content back and the clear looks like it never happened. */
          if (tcHadContent) {
            tcHadContent = false;
            lastSnap = null;
            vscode.postMessage({ type: 'snapshot', a: null, b: null });
            try{ localStorage.removeItem(SNAP_KEY); }catch(e){}
            savePrefs();
          }
          return;
        }
        tcHadContent = true;
        vscode.postMessage({ type: 'snapshot', a: a, b: b });
        // Keep a copy in both places:
        //   1) webview state - Split Editor / dragging a tab elsewhere carries it into the new instance;
        //   2) localStorage - if the new instance never receives that state, webviews in one window share an origin.
        // Very large snapshots are skipped: pushing every edit through IPC slows the UI down.
        var sz = (a ? a.text.length : 0) + (b ? b.text.length : 0);
        lastSnap = sz > 8 * 1024 * 1024 ? null : { v: SNAP_V, a: a, b: b };
        savePrefs();
        try{
          if (lastSnap && sz <= 3 * 1024 * 1024) localStorage.setItem(SNAP_KEY, JSON.stringify(lastSnap));
          else localStorage.removeItem(SNAP_KEY);
        }catch(e){ /* quota exhausted, fine - the state path still works */ }
      }catch(e){ /* a failed snapshot breaks nothing */ }
  };

  /* ---------- startup ---------- */
  el.optWs.checked = state.opts.ws;
  el.optCase.checked = state.opts.case;
  el.optBlank.checked = state.opts.blank;
  el.optWrap.checked = state.opts.wrap;
  el.body.classList.toggle('wrap', state.opts.wrap);
  applyLang();
  applyColWidths();
  applyPaneRatio();
  placeChrome();
  window.addEventListener('resize', function(){ applyPaneRatio(); layoutDiff(); });
  if (state.folded && state.listOpen) el.diffPanel.classList.add('folded');
  syncFoldBtn();
  updateStats();
  updateHeads();
  renderList();

  /* ---------- self-restore after Split Editor / moving a tab to another group ----------
     VS Code builds a completely new webview from the same html, and the host may not be quick enough
     to send the content back (it may never even hear about it), so it restores itself first:
       1) webview state - on rebuild VS Code hands back whatever setState stored;
       2) localStorage - if that never arrives, this copy is still here.
     When it succeeds, mark ready with restored so the host does not push files in again. */
  var booted = false;
  try{
    var bs = snapOk(saved.snap) ? saved.snap : null;
    if (!bs) {
      var ls = null;
      try{ ls = JSON.parse(localStorage.getItem(SNAP_KEY) || 'null'); }catch(e2){ ls = null; }
      if (snapOk(ls)) bs = ls;
      else if (ls) { try{ localStorage.removeItem(SNAP_KEY); }catch(e2){} }   // Older build: drop it
    }
    if (bs && (bs.a || bs.b)) {
      lastSnap = bs;
      loadBoth(bs.a || null, bs.b || null, true);
      booted = true;
    }
  }catch(e){ booted = false; }

  /* Nothing to restore on our own: ask the host for the last snapshot of this tool.
     "Split editor" can hand a brand new webview to us with no state at all, and the
     host still holds the two panes it was showing a moment ago. */
  if (!booted) { try{ vscode.postMessage({ type: 'needSnap' }); }catch(e){ } }

  savePrefs();
  vscode.postMessage({ type: 'ready', restored: booted });
})();
</script>
</body>
</html>
